function localOverride(path){ const w = P.writers.get(path); return w ? (w.next || w.waiting) : null; }
const isSaving = () => P.writers.size > 0 || localTimer !== null || SS.out.size > 0;

function subHome(){
  if (P.unsubHome) P.unsubHome();
  P.unsubHome = P.homeRef.onSnapshot(snap => {
    const definitive = !snap.metadata.fromCache;
    if (definitive) P.homeReady = true;
    if (!localOverride(P.homeRef.path)) {
      if (snap.exists) { S.home = cleanHome(snap.data()); P.homeExists = true; }
      else if (definitive && !P.homeExists) S.home = defaultHome();
    }
    afterRemote();
  }, err => subError('home', err));
}
function subEntries(){
  if (P.unsubEntries) P.unsubEntries();
  P.unsubEntries = P.col.onSnapshot(snap => {
    const definitive = !snap.metadata.fromCache;
    if (definitive) P.entriesReady = true;
    if (!definitive && snap.empty && S.entries.size) { afterRemote(); return; }
    const m = new Map();
    for (const d of snap.docs) { if (!d.exists) continue; m.set(d.id, cleanEntry(d.id, d.data())); }
    const prefix = P.col.path + '/';
    for (const [path, w] of P.writers) {
      if (!path.startsWith(prefix)) continue;
      const op = w.next || w.waiting; if (!op) continue;
      const id = path.slice(prefix.length);
      if (op.type === 'del') m.delete(id); else m.set(id, cleanEntry(id, op.data));
    }
    if (Editor.id && Editor.dirty && S.entries.has(Editor.id)) m.set(Editor.id, S.entries.get(Editor.id));
    S.entries = m;
    afterRemote();
  }, err => subError('entries', err));
}
function afterRemote(){
  if (!S.ready && P.homeReady && P.entriesReady && S.mode === 'remote') {
    S.ready = true;
    clearTimeout(P.connTimer);
    setBanner(null);
    Editor.refreshReadonly();
  }
  scheduleRender();
  saveMirror();
  Editor.syncFromState();
  syncChanged();
  maintenance();
}
function subError(which, err){
  const c = err && err.code;
  if ((c === 'unavailable' || !KNOWN.has(c)) && P.retries[which] < 5) {
    P.retries[which]++;
    setTimeout(() => (which === 'home' ? subHome() : subEntries()), 1500 * P.retries[which]);
    return;
  }
  goReadonly(c === 'revoked' ? 'Se perdió el acceso a tu almacenamiento. Cierra y vuelve a abrir la app.' : 'No se puede sincronizar ahora mismo. Puedes ver y copiar; para editar, vuelve a abrir la app.');
}
function goReadonly(msg){
  if (S.mode === 'local') return;
  S.mode = 'readonly';
  setBanner(msg);
  Editor.refreshReadonly();
  scheduleRender();
}

function waitClaude(){
  return new Promise(res => {
    if (standalone && !window.claude) return res(null);   // fuera de claude.ai no hay que esperar
    let n = 0;
    (function check(){
      const c = window.claude;
      if (c && typeof c.use === 'function') return res(c);
      if (++n > 25) return res(null);
      setTimeout(check, 100);
    })();
  });
}
async function connect(){
  if (sheetsWanted()) return connectSheets();
  const c = await waitClaude();
  if (!c) return startLocal(false);
  let db = null, user = null, uid = null;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { db = null; }
  if (db && user) { try { uid = await user.id(); } catch (e) { uid = null; } }
  if (!db || !uid) return startLocal(true);
  try {
    P.homeRef = db.doc(`data/users/${uid}/app`);
    P.col = P.homeRef.collection('entries');
  } catch (e) { return startLocal(true); }
  P.db = db; P.uid = uid; S.mode = 'remote';
  const mir = ls.get(K_CACHE);
  if (mir && mir.uid && mir.uid !== uid) { S.home = defaultHome(); S.entries = new Map(); render(); }
  subHome();
  subEntries();
  P.connTimer = setTimeout(() => {
    if (!S.ready && S.mode === 'remote') setBanner('Conectando con tu almacenamiento… Puedes ver y copiar; los cambios se activarán al conectar.');
  }, 10000);
}
function startLocal(runtime){
  const mir = ls.get(K_CACHE);
  if (mir && mir.home) {
    // Ya hay datos sincronizados: no se crea una copia paralela que luego no cuadre.
    loadSnapshot(mir);
    S.mode = 'readonly'; S.ready = true;
    setBanner('No se puede conectar con tu almacenamiento. Estás viendo la última copia guardada: puedes copiar textos, pero no editar hasta que vuelvas a abrir la app con conexión.');
  } else {
    const loc = ls.get(K_LOCAL);
    if (loc && loc.home) loadSnapshot(loc);
    S.mode = 'local'; S.ready = true;
    if (!ls.ok()) setBanner('Este navegador no permite guardar datos: lo que hagas se perderá al cerrar.');
    else setBanner(runtime ? 'Modo local: inicia sesión en Claude para sincronizar. Lo que guardes ahora se queda solo en este navegador.' : 'Modo local: los datos se guardan solo en este navegador.');
  }
  Editor.refreshReadonly();
  render();
  maintenance();
}
function setBanner(msg){
  $('#hBanner').hidden = !msg;
  $('#hBannerText').textContent = msg || '';
}
let syncListeners = [];
function syncChanged(){ syncListeners.forEach(f => f()); }

/* ================= sincronización con Google Sheets ================= */
// Fuera de claude.ai (en GitHub Pages) la app guarda en una hoja de Google a través de un
// Apps Script publicado como aplicación web (Codigo.gs). Para entrar hace falta la contraseña,
// que solo conoce el script; aquí se guarda únicamente un token de sesión de este dispositivo.
// SS imita la interfaz de la base de datos de claude.ai (doc, collection, set, delete, onSnapshot)
// para reutilizar toda la lógica de la app.
const SERVIDOR_URL = 'https://script.google.com/macros/s/AKfycbwpcgU7k0kZlHEZYuj61_GOAw0u5Ho9WV-8RFyvx5zvKHZ_l9vMyw4_fCT41qe2dRcW/exec';                      // dirección /exec del Apps Script (no es secreta)
const K_SRV = 'miespacio.servidor.v1';        // dirección pegada en este navegador, si no está arriba
const K_SES = 'miespacio.sesion.v1';          // token de sesión de este dispositivo
const K_HOJA = 'miespacio.hoja.v1';           // última copia de la hoja, para abrir rápido y sin conexión
const K_OUT = 'miespacio.pendientes.v1';      // cambios que la hoja todavía no ha confirmado
const K_LOCAL_HECHO = 'miespacio.local.subido';
const POLL_MS = 20000;
const standalone = (() => { try { return window.top === window.self; } catch (e) { return false; } })();
function standaloneNow(){ return standalone; }
const SRV_RE = /^(https:\/\/\S+|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/\S*)$/i;
const serverUrl = () => { const u = SERVIDOR_URL || ls.get(K_SRV) || ''; return SRV_RE.test(u) ? u : ''; };
const sheetsWanted = () => standalone && !!serverUrl();

function deviceName(){
  const u = navigator.userAgent || '';
  const d = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : /Linux/.test(u) ? 'Linux' : 'Dispositivo';
  const b = /Edg\//.test(u) ? 'Edge' : /CriOS|Chrome\//.test(u) ? 'Chrome' : /FxiOS|Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : '';
  return b ? `${d} · ${b}` : d;
}

const SS = {
  rev: 0, docs: new Map(), out: new Map(), seqN: 0,
  ready: false, listeners: { app: [], col: [] }, emitT: null,
  busy: false, again: false, pushT: null, pollT: null, sending: new Set(),
  lastOk: 0, lastErr: '', authFailed: false, firstFull: false, started: false,

  load(){
    const c = ls.get(K_HOJA);
    if (c && c.docs && typeof c.docs === 'object') {
      this.rev = Number(c.rev) || 0;
      for (const [k, v] of Object.entries(c.docs)) if (v && typeof v === 'object') this.docs.set(k, v);
      this.ready = this.rev > 0 || this.docs.size > 0 || !!c.ok;
      this.lastOk = Number(c.at) || 0;
    }
    const o = ls.get(K_OUT);
    if (o && typeof o === 'object') for (const [k, v] of Object.entries(o)) if (v && typeof v === 'object') { this.out.set(k, v); this.seqN = Math.max(this.seqN, v.s || 0); }
  },
  saveCache(){ if (!ls.set(K_HOJA, { rev: this.rev, ok: 1, at: this.lastOk, docs: Object.fromEntries(this.docs) })) console.warn('No cabe la copia local'); },
  saveOut(){ if (!ls.set(K_OUT, Object.fromEntries(this.out))) toast('No se pudo guardar el cambio en este dispositivo', 'x'); },
  view(k){
    const o = this.out.get(k);
    if (o) return o.del ? null : o.j;
    const d = this.docs.get(k);
    return d && !d.d ? d.j : null;
  },
  snapshot(){
    const entries = [];
    const keys = new Set([...this.docs.keys(), ...this.out.keys()]);
    for (const k of keys) { if (!k.startsWith('e:')) continue; const j = this.view(k); if (j) entries.push({ id: k.slice(2), ...j }); }
    return { home: this.view('app'), entries };
  },

  /* --- interfaz tipo base de datos --- */
  write(k, data, del){
    const prev = this.out.get(k);
    const known = this.docs.get(k);
    if (del && !known && prev && !this.sending.has(k)) { this.out.delete(k); this.saveOut(); this.emit(); return Promise.resolve(); }
    const b = prev ? prev.b : (known ? known.v : 0);
    this.out.set(k, { b, del: del ? 1 : 0, j: del ? null : clone(data), t: Date.now(), s: ++this.seqN });
    this.saveOut();
    this.emit();
    clearTimeout(this.pushT);
    this.pushT = setTimeout(() => this.sync(), 700);
    return Promise.resolve();
  },
  ref(k, path){
    const self = this;
    return {
      path, id: k.replace(/^e:/, ''),
      set: d => self.write(k, d, false),
      delete: () => self.write(k, null, true),
      onSnapshot(cb){ self.listeners.app.push(cb); self.emit(); return () => { self.listeners.app = self.listeners.app.filter(f => f !== cb); }; },
      collection(){ return self.colRef; },
    };
  },
  get colRef(){
    const self = this;
    return {
      path: 'hoja/entries',
      doc: id => self.ref('e:' + id, 'hoja/entries/' + id),
      onSnapshot(cb){ self.listeners.col.push(cb); self.emit(); return () => { self.listeners.col = self.listeners.col.filter(f => f !== cb); }; },
    };
  },
  emit(){
    if (this.emitT) return;
    this.emitT = setTimeout(() => {
      this.emitT = null;
      const meta = { fromCache: !this.ready };
      const app = this.view('app');
      const hs = { exists: !!app, data: () => clone(app), metadata: meta };
      this.listeners.app.forEach(f => f(hs));
      const docs = [];
      const keys = new Set([...this.docs.keys(), ...this.out.keys()]);
      for (const k of keys) { if (!k.startsWith('e:')) continue; const j = this.view(k); if (j) docs.push({ id: k.slice(2), exists: true, data: () => clone(j) }); }
      const cs = { docs, empty: !docs.length, metadata: meta };
      this.listeners.col.forEach(f => f(cs));
      syncChanged();
    }, 0);
  },

  /* --- red --- */
  async request(body, { keepalive = false, timeout = 30000 } = {}){
    const url = serverUrl();
    if (!url) throw { code: 'config' };
    const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), timeout) : null;
    const payload = JSON.stringify(body);
    try {
      const res = await fetch(url, { method: 'POST', body: payload, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow', cache: 'no-store', keepalive: keepalive && payload.length < 60000, signal: ctrl ? ctrl.signal : undefined });
      const txt = await res.text();
      let j = null; try { j = JSON.parse(txt); } catch (e) { j = null; }
      if (!j) throw { code: 'respuesta' };
      return j;
    } catch (e) {
      if (e && e.code) throw e;
      throw { code: 'red' };
    } finally { if (timer) clearTimeout(timer); }
  },
  token(){ return ls.get(K_SES) || ''; },

  async sync(){
    if (!this.token() || this.authFailed) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try {
      do {
        this.again = false;
        await this.push();
        await this.pull();
      } while (this.again && !this.authFailed);
      this.lastErr = '';
    } catch (e) {
      this.lastErr = e && e.code || 'red';
      if (this.lastErr === 'auth') this.onAuthLost();
    } finally {
      this.busy = false;
      syncChanged();
    }
  },
  check(r){
    if (r && r.ok) return r;
    const code = r && r.error || 'servidor';
    throw { code, msg: r && r.msg };
  },
  async pull(){
    const r = this.check(await this.request({ op: 'pull', token: this.token(), since: this.rev }));
    this.lastOk = Date.now();
    if (!r.same) {
      if (r.full) {
        this.docs = new Map();
        this.firstFull = true;
      }
      for (const it of r.items || []) {
        if (typeof it.k !== 'string') continue;
        if (it.d) this.docs.set(it.k, { v: it.v, d: 1 });
        else this.docs.set(it.k, { v: it.v, j: it.j });
      }
      this.rev = Number(r.rev) || 0;
    }
    const wasReady = this.ready;
    this.ready = true;
    this.saveCache();
    if (!r.same || !wasReady) this.emit();
    if (!wasReady || r.full) setTimeout(offerLocalData, 300);
    if (!wasReady) setTimeout(() => Cal.maybe(), 200);
  },
  async push(){
    for (let round = 0; round < 50; round++) {
      const batch = [];
      let size = 0;
      for (const [k, o] of this.out) {
        if (batch.length >= 150 || size > 3e6) break;
        batch.push([k, o.s]);
        const json = o.del ? '' : JSON.stringify(o.j);
        size += json.length;
      }
      if (!batch.length) return;
      const changes = batch.map(([k]) => { const o = this.out.get(k); return { k, b: o.b, del: o.del, t: o.t, j: o.del ? undefined : o.j }; });
      batch.forEach(([k]) => this.sending.add(k));
      let r;
      try { r = this.check(await this.request({ op: 'push', token: this.token(), changes }, { timeout: 60000 })); }
      finally { this.sending.clear(); }
      const byK = new Map((r.res || []).map(x => [x.k, x]));
      let conflicts = 0, rejected = 0;
      for (const [k, s] of batch) {
        const x = byK.get(k), o = this.out.get(k);
        if (!x || !o) continue;
        const sent = changes.find(c => c.k === k);
        if (x.ok) {
          if (sent.del) this.docs.set(k, { v: x.v, d: 1 }); else this.docs.set(k, { v: x.v, j: sent.j });
          if (o.s === s) this.out.delete(k); else o.b = x.v;
        } else if (x.error === 'conflicto') {
          conflicts++;
          this.docs.set(k, x.d ? { v: x.v, d: 1 } : { v: x.v, j: x.j });
          if (o.s !== s) { o.b = x.v; continue; }
          this.out.delete(k);
          resolveConflict(k, sent, x);
        } else {
          rejected++;
          this.out.delete(k);
        }
      }
      this.saveOut(); this.saveCache(); this.emit();
      if (conflicts) toast(conflicts === 1 ? 'Otro dispositivo cambió lo mismo: se ha conservado su versión' : `${conflicts} cambios chocaban con otro dispositivo`, 'info');
      if (rejected) toast(rejected === 1 ? 'La hoja rechazó un cambio (demasiado grande o no válido)' : `La hoja rechazó ${rejected} cambios`, 'x');
    }
  },
  flushKeepalive(){
    if (!this.out.size || !this.token() || this.authFailed) return;
    const changes = [];
    for (const [k, o] of this.out) { if (changes.length >= 40) break; changes.push({ k, b: o.b, del: o.del, t: o.t, j: o.del ? undefined : o.j }); }
    // Si el navegador cierra la página, el envío sigue; la respuesta se pierde, pero al volver
    // se reenvía y el servidor ve que ya lo tiene (mismo contenido) y no lo duplica.
    this.request({ op: 'push', token: this.token(), changes }, { keepalive: true }).catch(() => {});
  },
  start(){
    if (this.started) return;
    this.started = true;
    this.sync();
    this.pollT = setInterval(() => { if (document.visibilityState === 'visible') { this.sync(); Cal.maybe(); } }, POLL_MS);
    window.addEventListener('online', () => this.sync());
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { this.sync(); Cal.maybe(); } else this.flushKeepalive(); });
  },
  onAuthLost(){
    this.authFailed = true;
    ls.set(K_SES, '');
    showLogin({ expired: true });
  },
};

// Si otro dispositivo cambió lo mismo, nunca se pierde nada en silencio.
function resolveConflict(k, sent, x){
  if (k === 'app') {
    if (sent.del || !sent.j) return;
    const srv = x.d ? null : cleanHome(x.j);
    if (!srv) { SS.write('app', sent.j, false); return; }
    // Se queda el inicio del otro dispositivo y se añaden las carpetas nuevas de este.
    let added = 0;
    const mine = cleanHome(sent.j);
    for (const id of Object.keys(mine.items)) if (!srv.items[id]) { srv.items[id] = mine.items[id]; srv.order.push(id); added++; }
    if (added) SS.write('app', cleanHome(srv), false);
    return;
  }
  if (sent.del) return;                       // lo borraste aquí pero se cambió allí: se conserva
  if (x.d) { SS.write(k, sent.j, false); return; }   // lo borraron allí pero lo cambiaste aquí: se recupera
  const it = S.home.items[sent.j.folder];
  const a = x.j || {}, b = sent.j;
  if (it && it.kind === 'habits') {
    // dos dispositivos marcaron días a la vez: se juntan los días de los dos
    const days = [...new Set([...(a.hd ? a.hd.split(',') : []), ...(b.hd ? b.hd.split(',') : [])])].sort().join(',');
    if (days !== (a.hd || '')) SS.write(k, { ...a, hd: days, updated: Date.now() }, false);
    return;
  }
  if (it && (it.kind === 'notes' || it.kind === 'copy' || it.kind === 'uni') && (a.title !== b.title || a.body !== b.body)) {
    const nid = newId();
    SS.write('e:' + nid, { ...b, title: ((b.title || firstLine(b.body) || 'Nota') + ' (conflicto)').slice(0, 300), pos: (b.pos || 0) + 1, updated: Date.now() }, false);
    toast('Una nota se cambió en dos sitios: se guardaron las dos versiones', 'info');
  }
}

// Datos que había solo en este navegador (modo local de antes): ofrecer subirlos.
async function offerLocalData(){
  if (ls.get(K_LOCAL_HECHO)) return;
  const loc = ls.get(K_LOCAL);
  if (!loc || !loc.home) { ls.set(K_LOCAL_HECHO, 1); return; }
  const home = cleanHome(loc.home);
  const list = Array.isArray(loc.entries) ? loc.entries.filter(e => e && typeof e.id === 'string' && ID_RE.test(e.id) && home.items[e.folder]) : [];
  if (!list.length && JSON.stringify(home.order) === JSON.stringify(defaultHome().order)) { ls.set(K_LOCAL_HECHO, 1); return; }
  const empty = !SS.view('app') && ![...SS.docs.keys()].some(k => k.startsWith('e:') && SS.view(k));
  const ok = empty || await confirmDialog({ title: '¿Subir lo de este navegador?', message: `Hay ${plural(list.length, 'elemento guardado', 'elementos guardados')} solo en este navegador. Se añadirán a la hoja sin borrar nada.`, ok: 'Subir', danger: false });
  ls.set(K_LOCAL_HECHO, 1);
  if (!ok) return;
  const cur = SS.view('app') ? cleanHome(SS.view('app')) : null;
  if (!cur) SS.write('app', home, false);
  else {
    let add = 0;
    for (const id of Object.keys(home.items)) if (!cur.items[id]) { cur.items[id] = home.items[id]; cur.order.push(id); add++; }
    if (add) SS.write('app', cleanHome(cur), false);
  }
  for (const e of list) if (!SS.view('e:' + e.id)) SS.write('e:' + e.id, entryData(cleanEntry(e.id, e)), false);
  toast(empty ? 'Datos subidos a la hoja' : 'Datos añadidos a la hoja', 'check');
}

function connectSheets(){
  P.uid = null; P.db = SS;
  P.homeRef = SS.ref('app', 'hoja/app');
  P.col = P.homeRef.collection('entries');
  S.mode = 'remote';
  subHome();
  subEntries();
  if (SS.token()) SS.start();
  else showLogin({});
  if (!SS.ready) setBanner(SS.token() ? 'Conectando con tu hoja de Google…' : 'Entra con tu contraseña para ver tus datos.');
}

/* --- pantalla de entrada --- */
function showLogin({ expired = false } = {}){
  if ($('#login')) return;
  const needUrl = !SERVIDOR_URL;
  const el = document.createElement('section');
  el.id = 'login'; el.className = 'login'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Entrar');
  el.innerHTML = `<form class="lg" autocomplete="on" novalidate>
      <span class="lgic">${svg('lock')}</span>
      <h1>Mi espacio</h1>
      <p class="lgsub">${expired ? 'Tu sesión ha caducado o se cerró. Vuelve a escribir la contraseña: lo que hayas cambiado sigue guardado en este dispositivo.' : 'Escribe tu contraseña para conectar este dispositivo con tu hoja de Google.'}</p>
      ${needUrl ? `<label class="field"><span>Dirección del servidor (termina en /exec)</span><input class="inp" id="lgUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></label>` : ''}
      <input type="text" name="username" value="Mi espacio" autocomplete="username" hidden>
      <label class="field"><span>Contraseña</span><input class="inp" id="lgPw" type="password" autocomplete="current-password" enterkeyhint="go" required></label>
      <button class="pill lgbtn" id="lgGo" type="submit">Entrar</button>
      <p class="err" id="lgErr" hidden></p>
      ${SS.ready ? '<button class="tbtn lglater" id="lgLater" type="button">Ahora no</button>' : ''}
    </form>`;
  document.body.append(el);
  const urlI = $('#lgUrl', el), pwI = $('#lgPw', el), go = $('#lgGo', el), err = $('#lgErr', el);
  if (urlI) urlI.value = ls.get(K_SRV) || '';
  const later = $('#lgLater', el);
  if (later) later.addEventListener('click', () => { el.remove(); setBanner('Sin sesión: tus cambios se guardan en este dispositivo y se enviarán cuando entres (Configuración → Entrar).'); });
  setTimeout(() => (urlI && !urlI.value ? urlI : pwI).focus({ preventScroll: true }), 60);
  $('form', el).addEventListener('submit', async e => {
    e.preventDefault();
    err.hidden = true;
    if (urlI) {
      const u = urlI.value.trim();
      if (!SRV_RE.test(u) || !/\/exec(\?|$)/.test(u)) { err.textContent = 'Pega la dirección completa que acaba en /exec.'; err.hidden = false; return; }
      ls.set(K_SRV, u);
    }
    const pw = pwI.value;
    if (!pw) { pwI.focus(); return; }
    go.disabled = true; go.textContent = 'Comprobando…';
    let r = null;
    try { r = await SS.request({ op: 'login', password: pw, device: deviceName() }); } catch (x) { r = { ok: false, error: x && x.code || 'red' }; }
    go.disabled = false; go.textContent = 'Entrar';
    if (r && r.ok && r.token) {
      ls.set(K_SES, r.token);
      SS.authFailed = false;
      el.remove();
      setBanner(SS.ready ? null : 'Conectando con tu hoja de Google…');
      if (!P.homeRef) connectSheets();
      if (SS.started) SS.sync(); else SS.start();
      setTimeout(() => Cal.refresh(true), 400);
      toast('Dispositivo conectado', 'check');
      return;
    }
    pwI.value = '';
    err.textContent = ({
      contrasena: `Contraseña incorrecta.${r.quedan ? ` Te quedan ${r.quedan} intentos.` : ''}`,
      bloqueado: `Demasiados intentos. Espera ${r.min || 15} minutos y vuelve a probar.`,
      sin_contrasena: 'Todavía no hay contraseña. Ponla en la hoja: menú Mi espacio → 2. Poner o cambiar la contraseña.',
      red: 'No hay conexión con el servidor. Revisa internet y la dirección.',
      respuesta: 'Esa dirección no responde como el servidor de Mi espacio. Revisa que sea la de /exec y que el acceso sea «Cualquier usuario».',
    })[r.error] || 'No se pudo entrar. Prueba otra vez.';
    err.hidden = false;
    pwI.focus();
  });
}

/* ================= copiar ================= */
function execCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;pointer-events:none;';
  document.body.appendChild(ta);
  let ok = false;
  try {
    const sel = document.getSelection();
    const range = document.createRange();
    range.selectNodeContents(ta);
    sel.removeAllRanges(); sel.addRange(range);
    ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
    sel.removeAllRanges();
  } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
function copyText(text){
  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    let p;
    try { p = navigator.clipboard.writeText(text); } catch (e) { p = Promise.reject(e); }
    return p.then(() => true, () => execCopy(text));
  }
  return Promise.resolve(execCopy(text));
}
function copyAndTell(text, okMsg = 'Copiado'){
  if (!text) { toast('No hay nada que copiar'); return; }
  copyText(text).then(ok => ok ? toast(okMsg, 'check') : manualCopy(text));
}
function manualCopy(text){
  const sh = makeSheet(`<div class="grab"></div><div class="sh-head"><div class="sh-ht"><div class="sh-title">Copia manual</div><div class="sh-sub">El navegador no dejó copiar automáticamente</div></div></div>
    <div class="fbody"><p class="foot">Mantén pulsado el texto y elige «Copiar».</p><textarea class="inp" id="mcText" rows="6" readonly></textarea></div>`, 'tall');
  const t = $('#mcText', sh.el); t.value = text;
  setTimeout(() => { try { t.focus(); t.select(); } catch (e) {} }, 350);
}
// Hoja de compartir del sistema (AirDrop, WhatsApp, Mail…). Si el navegador no la tiene, se copia.
const canShare = typeof navigator.share === 'function';
function shareText(title, text){
  if (!text) { toast('No hay nada que compartir'); return; }
  if (!canShare) { copyAndTell(text); return; }
  let p;
  try { p = navigator.share(title && title !== text ? { title, text } : { text }); } catch (e) { p = Promise.reject(e); }
  p.catch(e => { if (!e || e.name !== 'AbortError') copyAndTell(text); });
}
const noteText = e => [e.title.trim(), e.body.trim()].filter(Boolean).join('\n\n');
function copySnip(id, cell){
  const e = S.entries.get(id); if (!e) return;
  const text = e.body || e.title;
  if (!text) { toast('Este texto está vacío'); return; }
  const card = cell && $('.snip', cell);
  if (card) { card.classList.add('copied'); setTimeout(() => card.classList.remove('copied'), 420); }
  copyAndTell(text);
}

const stack = [];
function makeSheet(html, kind = ''){
  const bd = document.createElement('div'); bd.className = 'backdrop';
  const el = document.createElement('div'); el.className = 'sheet ' + kind;
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = html;
  $('#layer').append(bd, el);
  const obj = {
    el, closed: false, onclose: null,
    close(){
      if (obj.closed) return; obj.closed = true;
      el.classList.remove('show'); bd.classList.remove('show');
      const i = stack.indexOf(obj); if (i >= 0) stack.splice(i, 1);
      if (el.contains(document.activeElement)) document.activeElement.blur();
      if (obj.onclose) obj.onclose();
      setTimeout(() => { bd.remove(); el.remove(); }, 520);
    }
  };
  if (!kind.includes('page')) bd.addEventListener('click', () => obj.close());
  el.addEventListener('click', e => { if (e.target.closest('[data-close]')) obj.close(); });
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('input.inp')) { e.preventDefault(); const nx = e.target.dataset.next; if (nx && $('#' + nx, el)) $('#' + nx, el).focus(); else e.target.blur(); }
  });
  stack.push(obj);
  el.getBoundingClientRect();
  el.classList.add('show'); bd.classList.add('show');
  return obj;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length && !document.querySelector('.dialog')) stack[stack.length - 1].close(); });

function actionSheet({ title, sub, icon, actions }){
  const rows = actions.map((a, i) => {
    if (a.sep) return '<div class="sep"></div>';
    const body = `${svg(a.icon)}<span class="al">${esc(a.label)}${a.sub ? `<small>${esc(a.sub)}</small>` : ''}</span>`;
    if (a.href) return `<a class="act" data-i="${i}" href="${esc(a.href)}"${isWeb(a.href) ? ' target="_blank" rel="noopener noreferrer"' : ''}>${body}</a>`;
    return `<button class="act${a.danger ? ' danger' : ''}" data-i="${i}" type="button">${body}</button>`;
  }).join('');
  const sh = makeSheet(`<div class="grab"></div>${title ? `<div class="sh-head">${icon ? `<span class="shic">${svg(icon)}</span>` : ''}<div class="sh-ht"><div class="sh-title">${esc(title)}</div>${sub ? `<div class="sh-sub">${esc(sub)}</div>` : ''}</div></div>` : ''}<div class="acts-list">${rows}<button class="act cancel" type="button" data-close>Cancelar</button></div>`);
  sh.el.addEventListener('click', e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const a = actions[+b.dataset.i];
    if (a.href) { sh.close(); return; }
    if (a.sync) { a.run(); sh.close(); return; }
    sh.close();
    setTimeout(a.run, 150);
  });
  return sh;
}

function confirmDialog({ title, message, ok = 'Eliminar', danger = true }){
  return new Promise(res => {
    const bd = document.createElement('div'); bd.className = 'backdrop dlg-bd';
    const d = document.createElement('div'); d.className = 'dialog'; d.setAttribute('role', 'alertdialog'); d.setAttribute('aria-modal', 'true');
    d.innerHTML = `<h3>${esc(title)}</h3>${message ? `<p>${esc(message)}</p>` : ''}<div class="btns"><button type="button" data-v="0">Cancelar</button><button type="button" data-v="1" class="${danger ? 'danger' : 'strong'}">${esc(ok)}</button></div>`;
    $('#layer').append(bd, d);
    d.getBoundingClientRect();
    bd.classList.add('show'); d.classList.add('show');
    const key = e => { if (e.key === 'Escape') done(false); };
    const done = v => {
      document.removeEventListener('keydown', key);
      bd.classList.remove('show'); d.classList.remove('show');
      setTimeout(() => { bd.remove(); d.remove(); }, 320);
      res(v);
    };
    d.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) done(b.dataset.v === '1'); });
    bd.addEventListener('click', () => done(false));
    document.addEventListener('keydown', key);
    try { $('[data-v="0"]', d).focus({ preventScroll: true }); } catch (e) {}
  });
}

let toastT = null, toastAct = null;
function toast(msg, icon, action){
  const t = $('#toast');
  if (toastAct && toastAct.expire && !(action && action.key === toastAct.key)) toastAct.expire();
  toastAct = action || null;
  t.innerHTML = (icon ? svg(icon) : '') + `<span>${esc(msg)}</span>` + (action ? `<button class="tact" type="button">${esc(action.label)}</button>` : '');
  t.classList.toggle('act', !!action);
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => {
    t.classList.remove('show');
    const a = toastAct; toastAct = null;
    if (a && a.expire) a.expire();
  }, action ? 4500 : msg.length > 32 ? 2800 : 1500);
}

async function askDeleteItem(id){
  if (!canWrite()) return;
  const it = S.home.items[id]; if (!it) return;
  if (it.kind === 'group') { askUngroup(id); return; }
  const n = hasEntries(it.kind) ? folderEntries(id).length : 0;
  const msg = it.kind === 'link' ? 'Se quitará este acceso directo.'
    : it.kind === 'cal' ? 'Podrás volver a ponerlo desde + → Widget de calendario. Tu Google Calendar no cambia.'
    : n ? `También se borrará lo que tiene dentro (${n}). No se puede deshacer.`
    : 'La carpeta está vacía.';
  const ok = await confirmDialog({ title: it.kind === 'cal' ? '¿Quitar el widget?' : `¿Eliminar «${it.name}»?`, message: msg, ok: it.kind === 'cal' ? 'Quitar' : 'Eliminar' });
  if (!ok || !canWrite() || !S.home.items[id]) return;
  detachItem(id);
  delete S.home.items[id];
  saveHome();
  for (const e of folderEntries(id)) { S.entries.delete(e.id); removeEntryDoc(e.id); }

function renumber(list){

function duplicateEntry(id){
  if (!canWrite()) return;
  const e = S.entries.get(id); if (!e) return;
  const it = S.home.items[e.folder];
  const now = Date.now();
  const ne = { ...e, id: newId(), title: e.title ? (e.title + ' (copia)').slice(0, 300) : e.title, created: now, updated: now };
  if (it && it.kind === 'copy') {
    const list = sortedSnips(e.folder);
    const i = list.findIndex(x => x.id === e.id);
    const nx = list[i + 1];
    ne.pos = nx ? (e.pos + nx.pos) / 2 : e.pos + 1000;
    S.entries.set(ne.id, ne);
    if (nx && !(ne.pos > e.pos && ne.pos < nx.pos)) { list.splice(i + 1, 0, ne); renumber(list); }
    saveEntry(ne);
  } else {
    S.entries.set(ne.id, ne); saveEntry(ne);

function onSnipDrop(order, movedId){

const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const monthsBetween = (a, b) => { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); };
const recurDay = (start, ym) => `${ym}-${pad(Math.min(+start.slice(8, 10) || 1, daysIn(ym)))}`;

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthName = ym => MONTHS[+ym.slice(5, 7) - 1];

  const t = new Date(), y = new Date(), m = new Date();
  y.setDate(t.getDate() - 1); m.setDate(t.getDate() + 1);
  if (s === ymd(t)) return 'Hoy';

// "12,5" · "12.50" · "1.234,56" · "1500" → céntimos (NaN si no vale)
function parseAmount(v){
  let s = String(v || '').replace(/[\s€]/g, '');
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (s.includes(',')) { const i = s.lastIndexOf(','); s = s.slice(0, i).replace(/,/g, '') + '.' + s.slice(i + 1); }
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  if (!/^\d*\.?\d*$/.test(s) || s === '.' ) return NaN;
  const n = Math.round(parseFloat(s) * 100);
  return Number.isFinite(n) ? n : NaN;
}

// Tras tocar el DOM a mano (para que se vean las animaciones), la caché refleja el estado y render() no lo pisa.
function syncListCache(){ const it = S.home.items[S.folder]; if (it && it.kind === 'list') lastFolder = gridHTML(it).html; }

const Fume = {
  timers: new Map(), on: new Set(), gone: new Set(),
  schedule(e){
    if (this.timers.has(e.id)) return;
    const wait = Math.max(0, e.done + DONE_MS - Date.now());
    this.timers.set(e.id, setTimeout(() => this.start(e.id, wait > 0), wait));
  },
  cancel(id){ clearTimeout(this.timers.get(id)); this.timers.delete(id); this.on.delete(id); this.gone.delete(id); },
  start(id, live){
    const e = S.entries.get(id);
    if (!e || !e.done) { this.cancel(id); return; }
    if (!writableNow()) { this.timers.delete(id); return; }   // se reintenta al reconectar
    const cell = S.folder === e.folder ? cellFor(id) : null;
    if (!cell || !live || document.visibilityState === 'hidden') { this.finish(id, live); return; }
    this.on.add(id); cell.classList.add('fume'); syncListCache();
    this.timers.set(id, setTimeout(() => {
      const c = cellFor(id);
      this.gone.add(id); if (c) c.classList.add('gone'); syncListCache();
      this.timers.set(id, setTimeout(() => this.finish(id, true), 360));
    }, 520));
  },
  finish(id, tell){
    this.cancel(id);
    const e = S.entries.get(id);
    if (!e || !e.done || !writableNow()) { scheduleRender(); return; }
    S.entries.delete(id); removeEntryDoc(id);
    const c = cellFor(id);
    if (c && folderEntries(e.folder).length) { c.remove(); syncListCache(); }
    scheduleRender();
    if (tell) Undo.push(e, 'done');
  },
};

const Undo = {
  bin: [], kind: '',
  push(e, kind){
    if (this.kind !== kind) this.bin = [];
    this.kind = kind;
    this.bin.push(clone(e));
    const n = this.bin.length;
    const msg = kind === 'del' ? (n === 1 ? 'Eliminado' : `${n} eliminados`) : (n === 1 ? 'Completado' : `${n} completados`);
    toast(msg, kind === 'del' ? 'trash-2' : 'check', { key: 'undo', label: 'Deshacer', run: () => this.restore(), expire: () => { this.bin = []; this.kind = ''; } });
  },
  restore(){
    const list = this.bin; this.bin = []; this.kind = '';
    if (!canWrite()) return;
    const ids = [];
    for (const x of list) {
      if (!S.home.items[x.folder] || S.entries.has(x.id)) continue;
      const e = cleanEntry(x.id, { ...x, done: 0 });
      S.entries.set(e.id, e); saveEntry(e); ids.push(e.id);
    }
    if (S.folder) renderFolder();
    scheduleRender();
    for (const id of ids) { const c = cellFor(id); if (c) c.classList.add('new'); }
    if (ids.length) toast(ids.length === 1 ? 'Recuperado' : `${ids.length} recuperados`, 'rotate-ccw');
  },
};

// Acepta varias líneas (al pegar una lista); quita viñetas tipo "- ", "• ", "1. ", "[ ] ".
function addTodos(text){
  const fid = S.folder, it = S.home.items[fid];
  if (!it || it.kind !== 'list') return 0;
  const lines = String(text || '').split(/\r?\n/).map(l => l.replace(/^\s*(?:[-*•·–]|\[[ xX]?\]|\d+[.)])\s+/, '').trim()).filter(Boolean).slice(0, 200);
  if (!lines.length) return 0;
  if (!canWrite()) return 0;
  let min = Infinity;
  for (const e of folderEntries(fid)) if (e.pos < min) min = e.pos;
  if (!Number.isFinite(min)) min = 1000;
  const now = Date.now(), ids = [];
  lines.forEach((t, i) => {
    const e = { id: newId(), folder: fid, title: t.slice(0, 300), body: '', pos: min - 1000 * (lines.length - i), created: now, updated: now };
    S.entries.set(e.id, e); saveEntry(e); ids.push(e.id);
  });
  renderFolder(); scheduleRender();
  for (const id of ids) { const c = cellFor(id); if (c) c.classList.add('new'); }
  return ids.length;
}

    clearTimeout(toastT); $('#toast').classList.remove('show');
    a.run();
  });
}

/* ================= finanzas: datos ================= */
const moneyList = fid => folderEntries(fid).filter(e => !e.rep && e.day);
// Por mes: s = gastado hasta hoy, u = apuntado con fecha futura (pendiente)
function monthTotals(fid){
  const t = todayStr(), m = new Map();
  for (const e of moneyList(fid)) {
    if (e.inc) continue;
    const k = ymOf(e.day), o = m.get(k) || { s: 0, u: 0 };
    if (e.day <= t) o.s += e.amt; else o.u += e.amt;
    m.set(k, o);
  }
  return m;
}
function monthStats(fid, ym){
  const t = todayStr();
  const st = { spent: 0, soon: 0, inc: 0, variable: 0, nVar: 0, maxVar: 0, nOut: 0, max: null, cats: new Map(), items: [] };
  for (const e of moneyList(fid)) {
    if (ymOf(e.day) !== ym) continue;
    st.items.push(e);
    if (e.inc) { if (e.day <= t) st.inc += e.amt; continue; }
    st.nOut++;
    if (e.day > t) { st.soon += e.amt; continue; }
    st.spent += e.amt;
    if (!e.src) { st.variable += e.amt; st.nVar++; if (e.amt > st.maxVar) st.maxVar = e.amt; }
    st.cats.set(e.cat, (st.cats.get(e.cat) || 0) + e.amt);
    if (!st.max || e.amt > st.max.amt) st.max = e;
  }
  return st;
}
function spentUntil(fid, ym, dayNum){
  const t = todayStr(); let s = 0;
  for (const e of moneyList(fid)) if (!e.inc && ymOf(e.day) === ym && e.day <= t && +e.day.slice(8) <= dayNum) s += e.amt;
  return s;
}
// Los fijos mensuales son plantillas (rep) que generan un movimiento cada mes.
// El id del movimiento es fijo (plantilla~AAAAMM): si dos dispositivos lo crean a la vez, es el mismo.
function ensureRecurring(){
  if (!writableNow()) return;
  const cur = curYM(), now = Date.now();
  let changed = false;
  for (const t of [...S.entries.values()]) {
    if (!t.rep || !t.day) continue;
    const it = S.home.items[t.folder]; if (!it || it.kind !== 'money') continue;
    const start = ymOf(t.day);
    let m = t.upto ? addYM(t.upto, 1) : start;
    if (m < start) m = start;
    let last = t.upto, k = 0;
    while (m <= cur && k < 36) {
      const id = t.id + '~' + m.replace('-', '');
      if (!S.entries.has(id)) {
        const e = { id, folder: t.folder, title: t.title, body: '', pos: 0, created: now, updated: now, done: 0, amt: t.amt, cat: t.cat, inc: t.inc, day: recurDay(t.day, m), rep: 0, src: t.id, upto: '' };
        S.entries.set(id, e); saveEntry(e); changed = true;
      }
      last = m; m = addYM(m, 1); k++;
    }
    if (last && last !== t.upto) { t.upto = last; saveEntry(t); changed = true; }
  }
  if (changed) scheduleRender();
}

/* ================= mantenimiento y migración ================= */
// Una sola vez: la carpeta Finanzas pasa a ser de tipo finanzas (si está vacía) y aparece una lista.
function migrate(){
  const h = S.home;
  if ((h.mig || 0) >= MIG) return;
  const vals = Object.values(h.items);
  if ((h.mig || 0) < 1) migrate1(h, vals);
  if ((h.mig || 0) < 2) {
    // 2: la carpeta Universidad pasa a ser la sección de Universidad (sus notas se quedan) y aparece el widget de calendario.
    if (!vals.some(i => i.kind === 'uni')) {
      const u = h.items.universidad;
      if (u && u.kind === 'notes') { u.kind = 'uni'; u.calName = 'Universidad'; if (!u.color) u.color = 'lavanda'; if (u.desc === 'Estudios') u.desc = 'Exámenes'; }
      else if (!h.items['universidad-uni']) {
        const id = 'universidad-uni';
        h.items[id] = { id, kind: 'uni', name: 'Universidad', desc: 'Exámenes', icon: 'graduation-cap', url: '', color: 'lavanda', calName: 'Universidad' };
        h.order.splice(Math.min(2, h.order.length), 0, id);
      }
    }
    if (!vals.some(i => i.kind === 'cal') && !h.items.calendario) {
      h.items.calendario = { id: 'calendario', kind: 'cal', name: 'Hoy', desc: '', icon: 'calendar-days', url: '' };
      h.order.unshift('calendario');
    }
  }
  h.mig = MIG;
  S.home = cleanHome(h);
  saveHome();
  scheduleRender();
  Cal.refresh(true);
}
function migrate1(h, vals){
  if (!vals.some(i => i.kind === 'money')) {
    const f = h.items.finanzas;
    if (f && f.kind === 'notes' && !folderEntries('finanzas').length) { f.kind = 'money'; f.budget = 0; if (f.desc === 'Dinero') f.desc = 'Gastos'; }
    else if (!h.items['finanzas-gastos']) {
      const id = 'finanzas-gastos';
      h.items[id] = { id, kind: 'money', name: 'Finanzas', desc: 'Gastos', icon: 'chart-column', url: '', budget: 0 };
      const at = h.order.indexOf('finanzas');
      if (at >= 0) h.order.splice(at + 1, 0, id); else h.order.push(id);
    }
  }
  if (!vals.some(i => i.kind === 'list') && !h.items.recordatorios) {
    h.items.recordatorios = { id: 'recordatorios', kind: 'list', name: 'Recordatorios', desc: 'Tareas', icon: 'list-checks', url: '' };
    h.order.push('recordatorios');
  }
}
function maintenance(){
  if (!S.ready || !writableNow()) return;

  if (P.db === SS && SS.ready && !SS.view('app')) saveHome();

function tileMeta(it){

/* ================= finanzas: pantalla ================= */
const Chart = { days: null };
const r1 = n => Math.round(n * 10) / 10;
function niceMax(v){
  if (!(v > 0)) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v - 1e-9) return m * p;
  return 10 * p;
}
const tickLabel = v => v >= 10000 ? NUM1.format(v / 1000) + ' mil' : NUM1.format(v);
function barPath(x, w, yb, yt, r){
  const h = yb - yt; if (h <= 0) return '';
  r = Math.min(r, h, w / 2);
  return `M${r1(x)},${r1(yb)}V${r1(yt + r)}Q${r1(x)},${r1(yt)} ${r1(x + r)},${r1(yt)}H${r1(x + w - r)}Q${r1(x + w)},${r1(yt)} ${r1(x + w)},${r1(yt + r)}V${r1(yb)}Z`;
}
function gridLines(x0, x1, y0, yT, top){
  let g = '';
  for (let k = 0; k <= 2; k++) {
    const y = r1(y0 - (y0 - yT) * k / 2);
    g += `<line class="gl" x1="${x0}" x2="${r1(x1)}" y1="${y}" y2="${y}"/><text x="${x0 - 8}" y="${r1(y + 4)}" text-anchor="end">${esc(tickLabel(top * k / 2))}</text>`;

}
function mvHTML(e, soon, tpl){

function moneyHTML(it, ym, W){
  const fid = it.id;
  const all = moneyList(fid);
  const tpls = folderEntries(fid).filter(e => e.rep);
  Chart.days = null;
  if (!all.length && !tpls.length) return `<div class="grid">${emptyHTML('wallet', 'Empieza a apuntar', 'Añade lo que gastas y aquí verás cuánto llevas este mes, en qué se te va el dinero y una gráfica mes a mes.', 'Añadir gasto', 'newMoney')}</div>`;
  const t = todayStr(), cur = ymOf(t), isCur = ym === cur, past = ym < cur;
  const dayNow = +t.slice(8), N = daysIn(ym), pym = addYM(ym, -1);
  const st = monthStats(fid, ym);
  let minYM = cur, maxYM = cur;
  for (const e of all) { const m = ymOf(e.day); if (m < minYM) minYM = m; if (m > maxYM) maxYM = m; }

  let h = `<div class="mnav"><button class="iconbtn" type="button" data-act="mprev" aria-label="Mes anterior"${ym <= minYM ? ' disabled' : ''}>${svg('chevron-left')}</button><button class="ml" type="button" data-act="mtoday">${esc(monthLabel(ym))}<small>${isCur ? `Día ${dayNow} de ${N}` : 'Toca para volver a este mes'}</small></button><button class="iconbtn" type="button" data-act="mnext" aria-label="Mes siguiente"${ym >= maxYM ? ' disabled' : ''}>${svg('chevron-right')}</button></div>`;

  // comparación con el mes anterior (este mes: a la misma altura del mes)
  const prev = isCur ? spentUntil(fid, pym, dayNow) : past ? spentUntil(fid, pym, 31) : 0;
  let cmp = '';
  if (prev > 0 && (isCur || past)) {
    const d = st.spent - prev, tail = ` que en ${monthName(pym)}${isCur ? ' a estas alturas' : ''}`;
    cmp = d === 0 ? `<div class="mcmp">${svg('minus')}<span>Lo mismo${esc(tail)}</span></div>`
      : `<div class="mcmp ${d > 0 ? 'up' : 'down'}">${svg(d > 0 ? 'trending-up' : 'trending-down')}<span>${esc(money(Math.abs(d)))} ${d > 0 ? 'más' : 'menos'}${esc(tail)}</span></div>`;
  }

  // presupuesto
  const B = it.budget || 0;
  let meter;
  if (B) {
    const used = st.spent + st.soon, left = B - used, ratio = used / B;
    const cls = ratio >= 1 ? 'bad' : ratio >= .8 ? 'warn' : 'ok';
    const w1 = Math.min(100, st.spent / B * 100), w2 = Math.min(100 - w1, st.soon / B * 100);
    const notes = [];
    if (isCur && left > 0) { const dl = N - dayNow + 1; notes.push(`Unos <b>${esc(money(Math.floor(left / dl)))}</b> al día durante ${plural(dl, 'día', 'días')}`); }
    if (st.soon > 0 && (isCur || !past)) notes.push(`Incluye ${esc(money(st.soon))} pendientes`);
    meter = `<button class="meter ${cls}" type="button" data-act="budget" aria-label="Presupuesto de ${esc(money0(B))}. Toca para cambiarlo"><span class="mbar">${w1 > .05 ? `<i data-w="${w1.toFixed(2)}"></i>` : ''}${w2 > .05 ? `<i class="u" data-w="${w2.toFixed(2)}"></i>` : ''}</span><span class="mrow"><span>Presupuesto <b>${esc(money0(B))}</b></span><span class="mst">${svg(cls === 'ok' ? 'circle-check' : 'circle-alert')}<span>${left >= 0 ? `Quedan <b>${esc(money(left))}</b>` : `Te pasas <b>${esc(money(-left))}</b>`}</span></span></span>${notes.map(n => `<span class="mrow sm">${n}</span>`).join('')}</button>`;
  } else meter = `<button class="mlink" type="button" data-act="budget">${svg('target')}<span>Ponte un presupuesto mensual</span>${svg('chevron-right')}</button>`;

  // cifras pequeñas
  const elapsed = isCur ? dayNow : past ? N : 0;
  const avg = elapsed ? Math.round(st.spent / elapsed) : 0;
  let cells;
  if (st.inc > 0) {
    const bal = st.inc - st.spent;
    cells = [['Ingresos', '+' + money(st.inc), 'pos'], ['Balance', (bal < 0 ? '−' : '+') + money(Math.abs(bal)), bal < 0 ? 'neg' : 'pos'], ['Media al día', money(avg), '']];
  } else {
    // previsión: ritmo diario de lo variable; un gasto grande puntual (un billete, una matrícula) no se extrapola
    const base = st.maxVar > st.variable * .35 ? st.variable - st.maxVar : st.variable;
    const proj = isCur && dayNow >= 5 && st.nVar >= 5 && N > dayNow ? st.spent + st.soon + Math.round(base / dayNow * (N - dayNow)) : 0;
    cells = [['Media al día', money(avg), ''], proj ? ['Previsión del mes', '≈ ' + money0(proj), ''] : ['Gastos', String(st.nOut), ''], ['El mayor', st.max ? money(st.max.amt) : '—', '']];
  }
  const stats = `<div class="mstats">${cells.map(([k, v, c]) => `<div class="ms"><span>${esc(k)}</span><b class="${c}">${esc(v)}</b></div>`).join('')}</div>`;
  h += `<div class="mcard"><div class="mk">${isCur ? 'Gastado este mes' : `Gastado en ${esc(monthName(ym))}`}</div><div class="mbig">${moneyBig(st.spent)}</div>${cmp}${meter}${stats}</div>`;

  // categorías
  const rows = [...st.cats.entries()].sort((a, b) => b[1] - a[1]);
  if (rows.length) {
    h += `<div class="msec"><h3>En qué se va</h3><span>${plural(rows.length, 'categoría', 'categorías')}</span></div><div class="mbox">${rows.map(([k, v]) => {
      const c = catInfo(k, false), pct = v / st.spent * 100;
      return `<div class="crow"><span class="cic">${svg(c.i)}</span><span class="cn">${esc(c.n)}</span><span class="cv">${esc(money(v))}</span><span class="cb"><span class="ctrack"><i data-w="${Math.max(1.5, pct).toFixed(1)}"></i></span><span class="cp">${Math.round(pct)} %</span></span></div>`;
    }).join('')}</div>`;
  }

  // movimientos del mes, por día
  const items = st.items.slice().sort((a, b) => a.day < b.day ? 1 : a.day > b.day ? -1 : b.created - a.created);
  h += `<div class="msec"><h3>Movimientos</h3><span>${items.length ? plural(items.length, 'movimiento', 'movimientos') : ''}</span></div>`;
  if (!items.length) h += `<button class="mlink" type="button" data-act="newMoney">${svg('plus')}<span>Nada apuntado en ${esc(monthName(ym))}. Añadir gasto</span>${svg('chevron-right')}</button>`;
  else {
    let i = 0;
    while (i < items.length) {
      const d = items[i].day; let j = i, tot = 0;
      while (j < items.length && items[j].day === d) { if (!items[j].inc) tot += items[j].amt; j++; }
      const soon = d > t;
      h += `<div class="dg"><span>${esc(dayLabel(d))}${soon ? ' · pendiente' : ''}</span><span>${tot ? esc(money(tot)) : ''}</span></div><div class="mvs">${items.slice(i, j).map(e => mvHTML(e, soon)).join('')}</div>`;
      i = j;
    }
  }

  // fijos mensuales
  if (tpls.length) {
    const tot = tpls.reduce((s, x) => s + (x.inc ? 0 : x.amt), 0);
    h += `<div class="msec"><h3>Fijos mensuales</h3><span>${tot ? esc(money(tot)) + ' al mes' : ''}</span></div><div class="mvs">${tpls.slice().sort((a, b) => (+a.day.slice(8) - +b.day.slice(8)) || (a.created - b.created)).map(x => mvHTML(x, false, true)).join('')}</div>`;
  }

  // gráfica
  const days = S.chart === 'days';
  h += `<div class="msec"><h3>Evolución</h3></div><div class="chart"><div class="seg" role="group" aria-label="Tipo de gráfica"><button type="button" data-act="cm" aria-pressed="${!days}">Por meses</button><button type="button" data-act="cd" aria-pressed="${days}">Día a día</button></div>${days ? daysChart(it, ym, W) : monthsChart(it, ym, W)}</div>`;
  h += `<p class="hint">Mantén pulsado un movimiento para editarlo, repetirlo o borrarlo</p>`;
  return h;
}

function monthsChart(it, sel, W){
  const cur = curYM();
  let end = sel > cur ? sel : cur;
  if (monthsBetween(sel, end) > 5) end = addYM(sel, 5);
  const ms = []; for (let i = 5; i >= 0; i--) ms.push(addYM(end, -i));
  const tot = monthTotals(it.id);
  const vals = ms.map(m => tot.get(m) || { s: 0, u: 0 });
  const B = it.budget || 0;
  const top = niceMax(Math.max(...vals.map(v => v.s + v.u), B) / 100 * 1.04);
  const H = 200, yT = 28, y0 = H - 28, x0 = 40, x1 = W;
  const sy = c => y0 - (c / 100) / top * (y0 - yT);
  const slot = (x1 - x0) / 6, bw = Math.min(24, slot * .52);
  let g = gridLines(x0, x1, y0, yT, top), bars = '', labels = '', hits = '', anyU = false;
  if (B) { const y = r1(sy(B)); g += `<line class="bud" x1="${x0}" x2="${r1(x1)}" y1="${y}" y2="${y}"/>`; }
  vals.forEach((v, i) => {
    const m = ms[i], on = m === sel, cx = x0 + slot * (i + .5), xl = cx - bw / 2;
    let ytop = y0;
    if (v.s > 0) { ytop = Math.min(sy(v.s), y0 - 2); bars += `<path class="${on ? 'bon' : 'boff'}" d="${barPath(xl, bw, y0, ytop, v.u > 0 ? 0 : 4)}"/>`; }
    if (v.u > 0) {
      anyU = true;
      const yb = v.s > 0 ? ytop - 2 : y0, yt = Math.min(yb - (y0 - sy(v.u)), yb - 2);
      bars += `<path class="${on ? 'uon' : 'uoff'}" d="${barPath(xl, bw, yb, yt, 4)}"/>`;
      ytop = yt;
    }
    labels += `<text class="${on ? 'on' : ''}" x="${r1(cx)}" y="${H - 8}" text-anchor="middle">${MONTHS_S[+m.slice(5) - 1]}</text>`;
    if (on) labels += `<text class="vl" x="${r1(cx)}" y="${r1(ytop - 8)}" text-anchor="middle">${esc(money0(v.s + v.u))}</text>`;
    hits += `<rect class="hit" data-ym="${m}" x="${r1(x0 + slot * i)}" y="0" width="${r1(slot)}" height="${H}"><title>${esc(cap(monthName(m)))}: ${esc(money(v.s + v.u))}</title></rect>`;
  });
  const aria = 'Gastos por mes: ' + ms.map((m, i) => `${monthName(m)} ${money0(vals[i].s + vals[i].u)}`).join(', ');
  const full = ms.filter((m, i) => m < cur && vals[i].s > 0);
  const avg = full.length ? Math.round(full.reduce((s, m) => s + tot.get(m).s, 0) / full.length) : 0;
  const leg = [
    avg ? `<span>Media: <b>${esc(money0(avg))}</b> al mes</span>` : '',
    B ? `<span><i class="kb"></i>Presupuesto</span>` : '',
    anyU ? `<span><i class="ku"></i>Pendiente</span>` : '',
  ].filter(Boolean).join('');
  return `<svg viewBox="0 0 ${r1(W)} ${H}" width="${r1(W)}" height="${H}" role="img" aria-label="${esc(aria)}">${g}${bars}${labels}${hits}</svg>${leg ? `<div class="legend">${leg}</div>` : ''}`;
}

function daysChart(it, ym, W){
  const t = todayStr(), cur = ymOf(t), N = daysIn(ym), pym = addYM(ym, -1), PN = daysIn(pym);
  const lastOf = m => m < cur ? daysIn(m) : m === cur ? +t.slice(8) : 0;
  const cumOf = (m, n) => {
    const d = new Array(n + 1).fill(0);
    for (const e of moneyList(it.id)) if (!e.inc && ymOf(e.day) === m && e.day <= t) d[+e.day.slice(8)] += e.amt;
    for (let k = 1; k <= n; k++) d[k] += d[k - 1];
    return d;
  };
  const cum = cumOf(ym, N), pc = cumOf(pym, PN);
  const last = lastOf(ym), pDraw = Math.min(lastOf(pym), N);
  const pAt = d => pc[d === N && PN > N ? PN : Math.min(d, PN)];
  const B = it.budget || 0;
  const top = niceMax(Math.max(cum[last] || 0, pDraw ? pAt(pDraw) : 0, B, 1) / 100 * 1.06);
  const H = 196, yT = 14, y0 = H - 26, x0 = 40, x1 = W - 6;
  const sx = d => x0 + (x1 - x0) * d / N, sy = c => y0 - (c / 100) / top * (y0 - yT);
  const path = (n, fn) => { let s = ''; for (let d = 0; d <= n; d++) s += (d ? 'L' : 'M') + r1(sx(d)) + ',' + r1(sy(fn(d))); return s; };
  let g = gridLines(x0, x1, y0, yT, top);
  for (const d of [1, 8, 15, 22, N]) g += `<text x="${r1(sx(d))}" y="${H - 8}" text-anchor="middle">${d}</text>`;
  if (pDraw > 0) g += `<path class="lp" d="${path(pDraw, pAt)}"/>`;

  if (last > 0) {
    const p = path(last, d => cum[d]), ex = sx(last), ey = sy(cum[last]);
    g += `<path class="la" d="${p}L${r1(ex)},${r1(y0)}L${r1(sx(0))},${r1(y0)}Z"/><path class="lc" d="${p}"/><circle class="dot" cx="${r1(ex)}" cy="${r1(ey)}" r="4"/>`;
    const right = ex > x1 - 70;
    g += `<text class="vl" x="${r1(right ? ex - 8 : ex + 8)}" y="${r1(Math.max(yT + 10, ey - 10))}" text-anchor="${right ? 'end' : 'start'}">${esc(money0(cum[last]))}</text>`;
  }
  g += `<g id="mXh" display="none"><line class="xhl" id="mXl" x1="0" x2="0" y1="${yT}" y2="${y0}"/><circle class="dotp" id="mXp" r="4"/><circle class="dot" id="mXc" r="4"/></g><rect class="ov" x="${x0}" y="0" width="${r1(x1 - x0)}" height="${H}"/>`;
  const pName = cap(monthName(pym));
  const dflt = last > 0
    ? `${ym === cur ? 'Hasta hoy' : 'Total del mes'}: <b>${esc(money(cum[last]))}</b>${pDraw ? ` · ${esc(pName)}: ${esc(money(pAt(Math.min(last, pDraw))))}` : ''}`
    : 'Aún no hay gastos este mes';
  Chart.days = { W, N, x0, x1, last, pDraw, cum, pAt, sx, sy, B, pName, dflt };
  const aria = `Gasto acumulado de ${monthName(ym)}${last ? ': ' + money0(cum[last]) : ''}`;
  const leg = `<span><i class="kc"></i>${esc(cap(monthName(ym)))}</span>${pDraw ? `<span><i class="kp"></i>${esc(pName)}</span>` : ''}${B ? '<span><i class="kb"></i>Ritmo del presupuesto</span>' : ''}`;
  return `<div class="cread" id="mRead">${dflt}</div><svg data-chart="days" viewBox="0 0 ${r1(W)} ${H}" width="${r1(W)}" height="${H}" role="img" aria-label="${esc(aria)}">${g}</svg><div class="legend">${leg}</div>`;
}
function bindChart(){
  const el = $('#fMoney svg[data-chart="days"]'), G = Chart.days;
  if (!el || !G) return;
  const xh = $('#mXh', el), xl = $('#mXl', el), xc = $('#mXc', el), xp = $('#mXp', el), rd = $('#mRead');
  const show = e => {
    const r = el.getBoundingClientRect(); if (!r.width) return;
    const px = (e.clientX - r.left) * (G.W / r.width);
    const d = Math.max(1, Math.min(G.N, Math.round((px - G.x0) / (G.x1 - G.x0) * G.N)));
    const x = r1(G.sx(d)), hasC = d <= G.last, hasP = d <= G.pDraw;
    xl.setAttribute('x1', x); xl.setAttribute('x2', x);
    xc.setAttribute('display', hasC ? 'inline' : 'none');
    xp.setAttribute('display', hasP ? 'inline' : 'none');
    if (hasC) { xc.setAttribute('cx', x); xc.setAttribute('cy', r1(G.sy(G.cum[d]))); }
    if (hasP) { xp.setAttribute('cx', x); xp.setAttribute('cy', r1(G.sy(G.pAt(d)))); }
    xh.setAttribute('display', 'inline');
    rd.innerHTML = `Día ${d}: <b>${hasC ? esc(money(G.cum[d])) : '—'}</b>` + (hasP ? ` · ${esc(G.pName)}: ${esc(money(G.pAt(d)))}` : G.B ? ` · ritmo: ${esc(money0(Math.round(G.B * d / G.N)))}` : '');
  };
  const hide = () => { xh.setAttribute('display', 'none'); rd.innerHTML = G.dflt; };
  el.addEventListener('pointerdown', show);
  el.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) show(e); });
  el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
}
function renderMoney(it){

  });
}

/* ================= calendario (Google Calendar a través del servidor) ================= */
// El servidor (Codigo.gs) lee tu Google Calendar con tu cuenta y devuelve los eventos de los

  wanted(){ return Object.values(S.home.items).some(i => i.kind === 'cal' || i.kind === 'uni'); },

      if (r && r.ok && Array.isArray(r.ev)) { r.at = Date.now(); this.data = r; this.state = 'ok'; ls.set(K_CAL, r); }
      else if (r && r.error === 'auth') { this.state = 'idle'; SS.onAuthLost(); }

  // pide datos nuevos si los que hay tienen más de 5 minutos (o son de otro día)
  maybe(){ const d = this.data; if (!d || Date.now() - (d.at || 0) > 5 * 60000 || d.hoy !== todayStr()) this.refresh(false); },
  paint(){ lastHome = ''; lastFolder = ''; lastUni = ''; scheduleRender(); calListeners.forEach(f => f()); },

const evDay0 = ev => ev.all ? ev.s : ymd(new Date(ev.s));
const evDay1 = ev => { if (ev.all) { const d = parseDay(ev.e || ev.s); d.setDate(d.getDate() - 1); const s = ymd(d); return s < ev.s ? ev.s : s; } return ymd(new Date(Math.max(ev.s, ev.e - 1))); };

  if (day && a < day) return 'Hasta las ' + hm(ev.e);
  if (day && b > day) return 'Desde las ' + hm(ev.s);

}
const calEvents = () => Cal.data && Array.isArray(Cal.data.ev) ? Cal.data.ev : [];

function calWidgetInner(it){
  const now = new Date(), t = ymd(now), ms = now.getTime();
  const left = `<span class="cw-l"><span class="cw-wd">${esc(WEEKDAYS[now.getDay()])}</span><span class="cw-d">${now.getDate()}</span><span class="cw-m">${esc(MONTHS[now.getMonth()])}</span></span>`;

// Clases que añade Pablo (se repiten cada semana, de lunes a viernes) + eventos de Google Calendar de esa semana.
const HM_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
const hexRgba = (h, a) => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); if (!m) return `rgba(142,142,147,${a})`; const n = parseInt(m[1], 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const DOW_S = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
const DOW_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const atTime = (date, hm) => { const [h, m] = hm.split(':').map(Number); return new Date(date.getFullYear(), date.getMonth(), date.getDate(), h, m).getTime(); };
const allClasses = () => [...S.entries.values()].filter(e => e.t === 'class' && e.dow >= 1 && e.dow <= 5 && HM_RE.test(e.hs) && HM_RE.test(e.he) && S.home.items[e.folder] && S.home.items[e.folder].kind === 'uni');
const classColor = e => colorOf(e.col) ? e.col : COLORS[[...e.title].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length].k;
// Las clases de un día como si fueran eventos (para el widget, la agenda y el horario).
function classEventsOn(day){
  const d = parseDay(day), dow = d.getDay();
  return allClasses().filter(e => e.dow === dow).map(e => ({ t: e.title || 'Clase', s: atTime(d, e.hs), e: atTime(d, e.he), loc: e.room, col: colorOf(classColor(e)).h, cal: 'Clase', cls: e.id }));
}
// Todo lo de un día: eventos de Google Calendar + clases.
const dayEvents = day => [...calEvents().filter(ev => evOn(ev, day)), ...classEventsOn(day)];
// Lunes de la semana que se ve: los fines de semana se enseña la siguiente.
function weekMonday(off){
  const t = new Date(), dow = t.getDay();
  const base = new Date(t.getFullYear(), t.getMonth(), t.getDate() - ((dow + 6) % 7) + (dow === 0 || dow === 6 ? 7 : 0));
  base.setDate(base.getDate() + 7 * off);

}
const Sched = { off: 0, evs: [] };
function weekLabel(off, mon){
  const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
  const wkend = [0, 6].includes(new Date().getDay());
  const name = off === 0 ? (wkend ? 'La semana que viene' : 'Esta semana') : off === 1 ? (wkend ? 'Dentro de dos semanas' : 'La semana que viene') : 'La semana pasada';
  const range = mon.getMonth() === fri.getMonth() ? `${mon.getDate()}–${fri.getDate()} ${MONTHS_S[fri.getMonth()]}` : `${mon.getDate()} ${MONTHS_S[mon.getMonth()]} – ${fri.getDate()} ${MONTHS_S[fri.getMonth()]}`;
  return { name, range };
}
// Reparte en columnas lo que se solapa dentro de un día.
function lanes(list){
  list.sort((a, b) => a.s - b.s || b.e - a.e);
  let group = [], end = -Infinity;
  const flush = () => { const n = Math.max(...group.map(x => x.lane)) + 1; group.forEach(x => { x.n = n; }); group = []; };
  for (const x of list) {
    if (group.length && x.s >= end) { flush(); end = -Infinity; }
    const used = new Set(group.filter(g => g.e > x.s).map(g => g.lane));
    let l = 0; while (used.has(l)) l++;
    x.lane = l; group.push(x); end = Math.max(end, x.e);
  }
  if (group.length) flush();
  return list;
}
function schedHTML(it){
  const off = Sched.off, mon = weekMonday(off), today = todayStr(), now = Date.now();
  const days = [0, 1, 2, 3, 4].map(i => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  const st = calStatus();
  Sched.evs = [];
  const cols = days.map(d => {
    const day = ymd(d);
    const timed = [], allDay = [];
    for (const ev of st ? [] : calEvents()) {
      if (!evOn(ev, day)) continue;

// Cada hábito es una entrada de una carpeta de tipo «habits».
// hd = días hechos, 'AAAAMMDD' separados por comas · goal = veces por semana (7 = cada día).
const HD_RE = /^\d{8}(,\d{8})*$/;

const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));

function habitStats(e){
  const set = habitSet(e), goal = e.goal || 7, today = new Date(), tk = dkey(today);
  let streak = 0, best = 0;
  if (goal >= 7) {
    // días seguidos; si hoy aún no está hecho, la racha sigue viva desde ayer
    let d = set.has(tk) ? today : addDays(today, -1);
    while (set.has(dkey(d))) { streak++; d = addDays(d, -1); }
    const sorted = [...set].sort(); let run = 0, prev = null;
    for (const k of sorted) { const d2 = dkeyToDate(k); run = prev && Math.round((d2 - prev) / 864e5) === 1 ? run + 1 : 1; prev = d2; best = Math.max(best, run); }
  } else {
    // semanas seguidas cumpliendo el objetivo; la semana actual cuenta si ya se ha cumplido
    const weekCount = m => { let n = 0; for (let i = 0; i < 7; i++) if (set.has(dkey(addDays(m, i)))) n++; return n; };
    let m = mondayOf(today);
    if (weekCount(m) < goal) m = addDays(m, -7);
    while (weekCount(m) >= goal) { streak++; m = addDays(m, -7); }
    if (set.size) {
      const first = mondayOf(dkeyToDate([...set].sort()[0])); let run = 0;
      for (let w = first; w <= today; w = addDays(w, 7)) { run = weekCount(w) >= goal ? run + 1 : 0; best = Math.max(best, run); }
    }

}

/* ================= gastos compartidos ================= */
// La sección guarda las personas (it.people; «Yo» va siempre). Cada gasto es una entrada:
// amt = importe · subj = quién pagó · hours = entre quiénes se reparte ('A,B'; vacío = todos) · day = fecha.
// Un pago para saldar cuentas es una entrada con inc = 1: subj paga a room.
const splitMembers = it => [ME, ...(it.people || [])];
const splitParts = (e, mem) => { const p = e.hours ? e.hours.split(',').filter(x => mem.includes(x)) : []; return p.length ? p : mem; };
function splitShares(amt, parts){ const base = Math.floor(amt / parts.length); let rest = amt - base * parts.length; return parts.map(() => base + (rest-- > 0 ? 1 : 0)); }
function splitCalc(it){
  const mem = splitMembers(it), bal = Object.fromEntries(mem.map(m => [m, 0]));
  let total = 0, n = 0;
  for (const e of folderEntries(it.id)) {
    if (!e.amt || !(e.subj in bal)) continue;
    if (e.inc) { if (e.room in bal) { bal[e.subj] += e.amt; bal[e.room] -= e.amt; } continue; }
    const parts = splitParts(e, mem), sh = splitShares(e.amt, parts);
    total += e.amt; n++;
    bal[e.subj] += e.amt;
    parts.forEach((p, i) => { bal[p] -= sh[i]; });
  }
  // Los pagos mínimos para quedar en paz: quien más debe paga a quien más le deben.
  const debt = mem.filter(m => bal[m] < 0).map(m => ({ m, v: -bal[m] })).sort((a, b) => b.v - a.v);
  const cred = mem.filter(m => bal[m] > 0).map(m => ({ m, v: bal[m] })).sort((a, b) => b.v - a.v);
  const pays = [];
  for (let i = 0, j = 0; i < debt.length && j < cred.length;) {
    const x = Math.min(debt[i].v, cred[j].v);
    if (x > 0) pays.push({ from: debt[i].m, to: cred[j].m, amt: x });
    debt[i].v -= x; cred[j].v -= x;
    if (!debt[i].v) i++;
    if (j < cred.length && !cred[j].v) j++;
  }
  return { mem, bal, pays, total, n };
}
function splitMine(it){
  if (!(it.people || []).length) return 'Sin personas';

}

  };
  return { html: `<div class="fgrid-top">${top}</div>` + arr.map(row).join(''), hint: arr.length ? 'Toca un gasto para editarlo · El botón ✓ apunta un pago como hecho' : '' };

  const sh = makeSheet(`<div class="fhead"><span class="l"></span><div class="ft">Personas</div><button class="tbtn strong r" type="button" data-close>Listo</button></div>
    <div class="fbody"><div class="addrow" style="margin-top:4px"><span class="pc">${svg('plus')}</span><input id="ppNew" type="text" maxlength="24" placeholder="Nombre" autocomplete="off" autocapitalize="words" enterkeyhint="done" aria-label="Nombre de la persona"><button class="go" id="ppGo" type="button" aria-label="Añadir" hidden>${svg('check')}</button></div>
    <div class="group" id="ppList"></div><p class="foot">Tú ya estás («Yo»). Solo se puede quitar a alguien que no aparezca en ningún gasto.</p></div>`, 'tall');
  const f = sh.el, I = $('#ppNew', f), go = $('#ppGo', f);
  const used = n => folderEntries(fid).some(e => e.subj === n || e.room === n || (e.hours && e.hours.split(',').includes(n)));
  const paint = () => {
    const it = S.home.items[fid]; if (!it) { sh.close(); return; }
    $('#ppList', f).innerHTML = splitMembers(it).map(n => `<div class="prow"><span class="av">${esc(initials(n))}</span><b>${esc(n)}</b>${n === ME ? '' : `<button class="iconbtn" type="button" data-rm="${esc(n)}" aria-label="Quitar a ${esc(n)}">${svg('x')}</button>`}</div>`).join('');
  };
  const add = () => {
    const it = S.home.items[fid]; if (!it || !canWrite()) return;
    const names = I.value.split(/[,\n]/).map(cleanName).filter(Boolean);
    const next = cleanPeople([...(it.people || []), ...names]);
    if (next.length === (it.people || []).length) { if (names.length) toast('Ese nombre ya está'); return; }
    it.people = next; saveHome();
    I.value = ''; go.hidden = true; paint(); renderFolder(); scheduleRender();
  };
  I.addEventListener('input', () => { go.hidden = !I.value.trim(); });
  I.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
  go.addEventListener('pointerdown', e => e.preventDefault());
  go.addEventListener('click', add);
  f.addEventListener('click', e => {
    const b = e.target.closest('[data-rm]'); if (!b || !canWrite()) return;
    const it = S.home.items[fid]; if (!it) return;
    if (used(b.dataset.rm)) { toast(`${b.dataset.rm} aparece en algún gasto: no se puede quitar`, 'info'); return; }
    it.people = (it.people || []).filter(n => n !== b.dataset.rm); saveHome();
    paint(); renderFolder(); scheduleRender();
  });
  paint();
  if (!(S.home.items[fid].people || []).length) setTimeout(() => { try { I.focus({ preventScroll: true }); } catch (x) {} }, 350);
}
function splitSummary(it){
  const c = splitCalc(it);
  const lines = [`${it.name}: ${money(c.total)} en ${plural(c.n, 'gasto', 'gastos')}`];
  if (c.pays.length) { lines.push('', 'Para quedar en paz:'); for (const p of c.pays) lines.push(`• ${p.from} paga ${money(p.amt)} a ${p.to}`); }
  else lines.push('', 'Estamos en paz.');
  return lines.join('\n');
}
function splitMenu(it){
  actionSheet({ title: it.name, sub: 'Gastos compartidos', icon: it.icon, actions: [
    { icon: 'users', label: 'Personas', sub: splitMembers(it).join(', '), run: () => splitPeople(it.id) },
    ...(canShare ? [{ icon: 'share', label: 'Compartir las cuentas', sub: 'Quién paga a quién, para mandarlo al grupo', sync: true, run: () => shareText('', splitSummary(it)) }] : [{ icon: 'copy', label: 'Copiar las cuentas', sub: 'Quién paga a quién, para mandarlo al grupo', sync: true, run: () => copyAndTell(splitSummary(it), 'Cuentas copiadas') }]),
    { icon: 'pencil', label: 'Cambiar nombre e icono', run: () => openItemForm({ id: it.id }) },
  ]});
}

/* ================= bloqueo con Face ID ================= */
// Cortina de privacidad: al abrir la app (o al volver tras un rato) pide Face ID, Touch ID o el código
// del dispositivo, con una llave de acceso (passkey) que solo vale en este dispositivo y esta web.
// No cifra los datos guardados; evita que alguien con el móvil desbloqueado en la mano los lea.
const K_LOCK = 'miespacio.bloqueo.v1';     // { id: llave en base64url, mins: minutos fuera antes de volver a pedirlo }
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const BIO = /iPhone|iPad/.test(navigator.userAgent) ? 'Face ID' : /Mac/.test(navigator.userAgent) ? 'Touch ID' : 'la huella o el PIN';
const Lock = {
  supported: standaloneNow() && !!window.PublicKeyCredential && !!navigator.credentials && window.isSecureContext !== false,
  el: null, busy: false, hiddenAt: 0, okAt: 0, covered: false,
  cfg(){ const c = ls.get(K_LOCK); return this.supported && c && typeof c.id === 'string' && c.id ? { id: c.id, mins: [0, 1, 5, 15].includes(c.mins) ? c.mins : 1 } : null; },
  async enable(){
    const rnd = n => crypto.getRandomValues(new Uint8Array(n));
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rnd(32), rp: { name: 'Mi espacio' }, user: { id: rnd(16), name: 'Mi espacio', displayName: 'Mi espacio' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000, attestation: 'none' } });
    if (!cred || !cred.rawId) throw new Error('sin llave');
    ls.set(K_LOCK, { id: b64u(cred.rawId), mins: 1 });
    this.okAt = Date.now();
  },
  disable(){ try { localStorage.removeItem(K_LOCK); } catch (e) {} this.hide(); },
  setMins(m){ const c = this.cfg(); if (c) ls.set(K_LOCK, { id: c.id, mins: m }); },
  async verify(){
    const c = this.cfg(); if (!c) return true;
    if (this.busy) return false;
    this.busy = true;
    try {
      const r = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64u(c.id), transports: ['internal'] }], userVerification: 'required', timeout: 60000 } });
      return !!r;
    } catch (e) { return false; }
    finally { this.busy = false; }
  },
  show(){
    if (this.el) return;
    const el = document.createElement('section');
    el.className = 'lockscr'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Mi espacio está bloqueado');
    el.innerHTML = `<div class="lg"><span class="lgic">${svg('lock')}</span><h1>Mi espacio</h1><p class="lgsub" id="lkSub">Bloqueado</p>
      <button class="pill lgbtn" id="lkGo" type="button">Desbloquear con ${esc(BIO)}</button>
      ${sheetsWanted() ? `<button class="tbtn lglater" id="lkPw" type="button">Usar la contraseña</button>
      <form id="lkForm" hidden novalidate><label class="field" style="text-align:left"><span>Contraseña de Mi espacio</span><input class="inp" id="lkPass" type="password" autocomplete="current-password" enterkeyhint="go"></label><button class="pill lgbtn" id="lkEnter" type="submit">Entrar</button></form>` : ''}
      <p class="err" id="lkErr" hidden></p></div>`;
    document.body.append(el);
    document.documentElement.classList.add('locked');
    this.el = el;
    $('#lkGo', el).addEventListener('click', () => this.tryUnlock());
    const pwB = $('#lkPw', el), form = $('#lkForm', el), err = $('#lkErr', el);
    if (pwB) {
      pwB.addEventListener('click', () => { form.hidden = false; pwB.hidden = true; $('#lkGo', el).hidden = true; err.hidden = true; try { $('#lkPass', el).focus(); } catch (e) {} });
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const pw = $('#lkPass', el).value; if (!pw) return;
        const go = $('#lkEnter', el); go.disabled = true; go.textContent = 'Comprobando…'; err.hidden = true;
        let r; try { r = await SS.request({ op: 'login', password: pw, device: deviceName() }); } catch (x) { r = { ok: false, error: x && x.code || 'red' }; }
        go.disabled = false; go.textContent = 'Entrar';
        if (r && r.ok && r.token) {
          const old = SS.token();
          ls.set(K_SES, r.token); SS.authFailed = false;
          if (old && old !== r.token) SS.request({ op: 'logout', token: old }, { timeout: 8000 }).catch(() => {});
          const lg = $('#login'); if (lg) lg.remove();
          this.unlocked();
          if (SS.started) SS.sync(); else SS.start();
          return;
        }
        $('#lkPass', el).value = '';
        err.textContent = r.error === 'contrasena' ? `Contraseña incorrecta.${r.quedan ? ` Te quedan ${r.quedan} intentos.` : ''}` : r.error === 'bloqueado' ? `Demasiados intentos. Espera ${r.min || 15} minutos.` : `Sin conexión no se puede comprobar la contraseña. Usa ${BIO}.`;
        err.hidden = false;
      });
    }
  },
  hide(){ if (this.el) { this.el.remove(); this.el = null; } document.documentElement.classList.remove('locked'); this.covered = false; },
  unlocked(){ this.okAt = Date.now(); this.hide(); },
  async tryUnlock(){
    if (!this.el || this.busy) return;
    const err = $('#lkErr', this.el); if (err) err.hidden = true;
    if (await this.verify()) this.unlocked();
    else if (this.el && err) { const fm = $('#lkForm', this.el); if (!fm || fm.hidden) { err.textContent = 'No se ha podido comprobar. Toca el botón para probar otra vez.'; err.hidden = false; } }
  },
  lockNow(auto){ if (!this.cfg()) return; this.show(); this.covered = false; if (auto) setTimeout(() => this.tryUnlock(), 250); },
  init(){
    if (!this.cfg()) return;
    this.lockNow(true);
    document.addEventListener('visibilitychange', () => {
      const c = this.cfg(); if (!c) return;
      if (document.visibilityState === 'hidden') {
        if (this.busy) return;                       // la hoja de Face ID no cuenta como salir de la app
        this.hiddenAt = Date.now();
        if (!this.el) { this.show(); this.covered = true; }   // tapa el contenido en el selector de apps
        return;
      }
      if (!this.el) return;
      if (this.covered && (Date.now() - this.hiddenAt < c.mins * 60000 || Date.now() - this.okAt < 2500)) { this.hide(); return; }
      this.covered = false;
      setTimeout(() => this.tryUnlock(), 250);
    });
  },
};

/* ================= atajos de Siri ================= */
// La app Atajos del iPhone habla directamente con el servidor (op 'atajo') usando una clave propia.
// Esa clave se crea aquí (necesita la sesión) y se guarda solo en este dispositivo para poder copiarla.
const K_ATAJO = 'miespacio.atajo.v1';
const SIRI = [
  { id: 'gasto', say: 'Apunta un gasto', icon: 'wallet', what: 'Te pregunta cuánto y en qué, y lo apunta en Finanzas con la fecha de hoy. Te dice lo que llevas este mes.',
