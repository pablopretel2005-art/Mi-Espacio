function moneyHTML(it, ym, W){
  const fid = it.id;
  const all = moneyList(fid);
  const tpls = folderEntries(fid).filter(e => e.rep);
  Chart.days = null;
  if (!all.length && !tpls.length) return `<div class="grid">${emptyHTML('wallet', 'Empieza a apuntar', 'Añade lo que gastas y aquí verás cuánto llevas este mes, en qué se te va el dinero y una gráfica mes a mes.', 'Añadir gasto', 'newMoney')}</div>`;
  const t = todayStr(), cur = ymOf(t), isCur = ym === cur, past = ym < cur;
  const dayNow = +t.slice(8), N = daysIn(ym), pym = addYM(ym, -1);
  const st = monthStats(fid, ym);
  let minYM = cur, maxYM = cur;
  for (const e of all) { const m = ymOf(e.day); if (m < minYM) minYM = m; if (m > maxYM) maxYM = m; }

  let h = `<div class="mnav"><button class="iconbtn" type="button" data-act="mprev" aria-label="Mes anterior"${ym <= minYM ? ' disabled' : ''}>${svg('chevron-left')}</button><button class="ml" type="button" data-act="mtoday">${esc(monthLabel(ym))}<small>${isCur ? `Día ${dayNow} de ${N}` : 'Toca para volver a este mes'}</small></button><button class="iconbtn" type="button" data-act="mnext" aria-label="Mes siguiente"${ym >= maxYM ? ' disabled' : ''}>${svg('chevron-right')}</button></div>`;

  // comparación con el mes anterior (este mes: a la misma altura del mes)
  const prev = isCur ? spentUntil(fid, pym, dayNow) : past ? spentUntil(fid, pym, 31) : 0;
  let cmp = '';
  if (prev > 0 && (isCur || past)) {
    const d = st.spent - prev, tail = ` que en ${monthName(pym)}${isCur ? ' a estas alturas' : ''}`;
    cmp = d === 0 ? `<div class="mcmp">${svg('minus')}<span>Lo mismo${esc(tail)}</span></div>`
      : `<div class="mcmp ${d > 0 ? 'up' : 'down'}">${svg(d > 0 ? 'trending-up' : 'trending-down')}<span>${esc(money(Math.abs(d)))} ${d > 0 ? 'más' : 'menos'}${esc(tail)}</span></div>`;
  }

  // presupuesto
  const B = it.budget || 0;
  let meter;
  if (B) {
    const used = st.spent + st.soon, left = B - used, ratio = used / B;
    const cls = ratio >= 1 ? 'bad' : ratio >= .8 ? 'warn' : 'ok';
    const w1 = Math.min(100, st.spent / B * 100), w2 = Math.min(100 - w1, st.soon / B * 100);
    const notes = [];
    if (isCur && left > 0) { const dl = N - dayNow + 1; notes.push(`Unos <b>${esc(money(Math.floor(left / dl)))}</b> al día durante ${plural(dl, 'día', 'días')}`); }
    if (st.soon > 0 && (isCur || !past)) notes.push(`Incluye ${esc(money(st.soon))} pendientes`);
    meter = `<button class="meter ${cls}" type="button" data-act="budget" aria-label="Presupuesto de ${esc(money0(B))}. Toca para cambiarlo"><span class="mbar">${w1 > .05 ? `<i data-w="${w1.toFixed(2)}"></i>` : ''}${w2 > .05 ? `<i class="u" data-w="${w2.toFixed(2)}"></i>` : ''}</span><span class="mrow"><span>Presupuesto <b>${esc(money0(B))}</b></span><span class="mst">${svg(cls === 'ok' ? 'circle-check' : 'circle-alert')}<span>${left >= 0 ? `Quedan <b>${esc(money(left))}</b>` : `Te pasas <b>${esc(money(-left))}</b>`}</span></span></span>${notes.map(n => `<span class="mrow sm">${n}</span>`).join('')}</button>`;
  } else meter = `<button class="mlink" type="button" data-act="budget">${svg('target')}<span>Ponte un presupuesto mensual</span>${svg('chevron-right')}</button>`;

  // cifras pequeñas
  const elapsed = isCur ? dayNow : past ? N : 0;
  const avg = elapsed ? Math.round(st.spent / elapsed) : 0;
  let cells;
  if (st.inc > 0) {
    const bal = st.inc - st.spent;
    cells = [['Ingresos', '+' + money(st.inc), 'pos'], ['Balance', (bal < 0 ? '−' : '+') + money(Math.abs(bal)), bal < 0 ? 'neg' : 'pos'], ['Media al día', money(avg), '']];
  } else {
    // previsión: ritmo diario de lo variable; un gasto grande puntual (un billete, una matrícula) no se extrapola
    const base = st.maxVar > st.variable * .35 ? st.variable - st.maxVar : st.variable;
    const proj = isCur && dayNow >= 5 && st.nVar >= 5 && N > dayNow ? st.spent + st.soon + Math.round(base / dayNow * (N - dayNow)) : 0;
    cells = [['Media al día', money(avg), ''], proj ? ['Previsión del mes', '≈ ' + money0(proj), ''] : ['Gastos', String(st.nOut), ''], ['El mayor', st.max ? money(st.max.amt) : '—', '']];
  }
  const stats = `<div class="mstats">${cells.map(([k, v, c]) => `<div class="ms"><span>${esc(k)}</span><b class="${c}">${esc(v)}</b></div>`).join('')}</div>`;
  h += `<div class="mcard"><div class="mk">${isCur ? 'Gastado este mes' : `Gastado en ${esc(monthName(ym))}`}</div><div class="mbig">${moneyBig(st.spent)}</div>${cmp}${meter}${stats}</div>`;

  // categorías
  const rows = [...st.cats.entries()].sort((a, b) => b[1] - a[1]);
  if (rows.length) {
    h += `<div class="msec"><h3>En qué se va</h3><span>${plural(rows.length, 'categoría', 'categorías')}</span></div><div class="mbox">${rows.map(([k, v]) => {
      const c = catInfo(k, false), pct = v / st.spent * 100;
      return `<div class="crow"><span class="cic">${svg(c.i)}</span><span class="cn">${esc(c.n)}</span><span class="cv">${esc(money(v))}</span><span class="cb"><span class="ctrack"><i data-w="${Math.max(1.5, pct).toFixed(1)}"></i></span><span class="cp">${Math.round(pct)} %</span></span></div>`;
    }).join('')}</div>`;
  }

  // movimientos del mes, por día
  const items = st.items.slice().sort((a, b) => a.day < b.day ? 1 : a.day > b.day ? -1 : b.created - a.created);
  h += `<div class="msec"><h3>Movimientos</h3><span>${items.length ? plural(items.length, 'movimiento', 'movimientos') : ''}</span></div>`;
  if (!items.length) h += `<button class="mlink" type="button" data-act="newMoney">${svg('plus')}<span>Nada apuntado en ${esc(monthName(ym))}. Añadir gasto</span>${svg('chevron-right')}</button>`;
  else {
    let i = 0;
    while (i < items.length) {
      const d = items[i].day; let j = i, tot = 0;
      while (j < items.length && items[j].day === d) { if (!items[j].inc) tot += items[j].amt; j++; }
      const soon = d > t;
      h += `<div class="dg"><span>${esc(dayLabel(d))}${soon ? ' · pendiente' : ''}</span><span>${tot ? esc(money(tot)) : ''}</span></div><div class="mvs">${items.slice(i, j).map(e => mvHTML(e, soon)).join('')}</div>`;
      i = j;
    }
  }

  // fijos mensuales
  if (tpls.length) {
    const tot = tpls.reduce((s, x) => s + (x.inc ? 0 : x.amt), 0);
    h += `<div class="msec"><h3>Fijos mensuales</h3><span>${tot ? esc(money(tot)) + ' al mes' : ''}</span></div><div class="mvs">${tpls.slice().sort((a, b) => (+a.day.slice(8) - +b.day.slice(8)) || (a.created - b.created)).map(x => mvHTML(x, false, true)).join('')}</div>`;
  }

  // gráfica
  const days = S.chart === 'days';
  h += `<div class="msec"><h3>Evolución</h3></div><div class="chart"><div class="seg" role="group" aria-label="Tipo de gráfica"><button type="button" data-act="cm" aria-pressed="${!days}">Por meses</button><button type="button" data-act="cd" aria-pressed="${days}">Día a día</button></div>${days ? daysChart(it, ym, W) : monthsChart(it, ym, W)}</div>`;
  h += `<p class="hint">Mantén pulsado un movimiento para editarlo, repetirlo o borrarlo</p>`;
  return h;
}

function monthsChart(it, sel, W){
  const cur = curYM();
  let end = sel > cur ? sel : cur;
  if (monthsBetween(sel, end) > 5) end = addYM(sel, 5);
  const ms = []; for (let i = 5; i >= 0; i--) ms.push(addYM(end, -i));
  const tot = monthTotals(it.id);
  const vals = ms.map(m => tot.get(m) || { s: 0, u: 0 });
  const B = it.budget || 0;
  const top = niceMax(Math.max(...vals.map(v => v.s + v.u), B) / 100 * 1.04);
  const H = 200, yT = 28, y0 = H - 28, x0 = 40, x1 = W;
  const sy = c => y0 - (c / 100) / top * (y0 - yT);
  const slot = (x1 - x0) / 6, bw = Math.min(24, slot * .52);
  let g = gridLines(x0, x1, y0, yT, top), bars = '', labels = '', hits = '', anyU = false;
  if (B) { const y = r1(sy(B)); g += `<line class="bud" x1="${x0}" x2="${r1(x1)}" y1="${y}" y2="${y}"/>`; }
  vals.forEach((v, i) => {
    const m = ms[i], on = m === sel, cx = x0 + slot * (i + .5), xl = cx - bw / 2;
    let ytop = y0;
    if (v.s > 0) { ytop = Math.min(sy(v.s), y0 - 2); bars += `<path class="${on ? 'bon' : 'boff'}" d="${barPath(xl, bw, y0, ytop, v.u > 0 ? 0 : 4)}"/>`; }
    if (v.u > 0) {
      anyU = true;
      const yb = v.s > 0 ? ytop - 2 : y0, yt = Math.min(yb - (y0 - sy(v.u)), yb - 2);
      bars += `<path class="${on ? 'uon' : 'uoff'}" d="${barPath(xl, bw, yb, yt, 4)}"/>`;
      ytop = yt;
    }
    labels += `<text class="${on ? 'on' : ''}" x="${r1(cx)}" y="${H - 8}" text-anchor="middle">${MONTHS_S[+m.slice(5) - 1]}</text>`;
    if (on) labels += `<text class="vl" x="${r1(cx)}" y="${r1(ytop - 8)}" text-anchor="middle">${esc(money0(v.s + v.u))}</text>`;
    hits += `<rect class="hit" data-ym="${m}" x="${r1(x0 + slot * i)}" y="0" width="${r1(slot)}" height="${H}"><title>${esc(cap(monthName(m)))}: ${esc(money(v.s + v.u))}</title></rect>`;
  });
  const aria = 'Gastos por mes: ' + ms.map((m, i) => `${monthName(m)} ${money0(vals[i].s + vals[i].u)}`).join(', ');
  const full = ms.filter((m, i) => m < cur && vals[i].s > 0);
  const avg = full.length ? Math.round(full.reduce((s, m) => s + tot.get(m).s, 0) / full.length) : 0;
  const leg = [
    avg ? `<span>Media: <b>${esc(money0(avg))}</b> al mes</span>` : '',
    B ? `<span><i class="kb"></i>Presupuesto</span>` : '',
    anyU ? `<span><i class="ku"></i>Pendiente</span>` : '',
  ].filter(Boolean).join('');
  return `<svg viewBox="0 0 ${r1(W)} ${H}" width="${r1(W)}" height="${H}" role="img" aria-label="${esc(aria)}">${g}${bars}${labels}${hits}</svg>${leg ? `<div class="legend">${leg}</div>` : ''}`;
}

function daysChart(it, ym, W){
  const t = todayStr(), cur = ymOf(t), N = daysIn(ym), pym = addYM(ym, -1), PN = daysIn(pym);
  const lastOf = m => m < cur ? daysIn(m) : m === cur ? +t.slice(8) : 0;
  const cumOf = (m, n) => {
    const d = new Array(n + 1).fill(0);
    for (const e of moneyList(it.id)) if (!e.inc && ymOf(e.day) === m && e.day <= t) d[+e.day.slice(8)] += e.amt;
    for (let k = 1; k <= n; k++) d[k] += d[k - 1];
    return d;
  };
  const cum = cumOf(ym, N), pc = cumOf(pym, PN);
  const last = lastOf(ym), pDraw = Math.min(lastOf(pym), N);
  const pAt = d => pc[d === N && PN > N ? PN : Math.min(d, PN)];
  const B = it.budget || 0;
  const top = niceMax(Math.max(cum[last] || 0, pDraw ? pAt(pDraw) : 0, B, 1) / 100 * 1.06);
  const H = 196, yT = 14, y0 = H - 26, x0 = 40, x1 = W - 6;
  const sx = d => x0 + (x1 - x0) * d / N, sy = c => y0 - (c / 100) / top * (y0 - yT);
  const path = (n, fn) => { let s = ''; for (let d = 0; d <= n; d++) s += (d ? 'L' : 'M') + r1(sx(d)) + ',' + r1(sy(fn(d))); return s; };
  let g = gridLines(x0, x1, y0, yT, top);
  for (const d of [1, 8, 15, 22, N]) g += `<text x="${r1(sx(d))}" y="${H - 8}" text-anchor="middle">${d}</text>`;
  if (pDraw > 0) g += `<path class="lp" d="${path(pDraw, pAt)}"/>`;
  if (B) g += `<line class="bud" x1="${r1(sx(0))}" y1="${r1(y0)}" x2="${r1(sx(N))}" y2="${r1(sy(B))}"/>`;
  if (last > 0) {
    const p = path(last, d => cum[d]), ex = sx(last), ey = sy(cum[last]);
    g += `<path class="la" d="${p}L${r1(ex)},${r1(y0)}L${r1(sx(0))},${r1(y0)}Z"/><path class="lc" d="${p}"/><circle class="dot" cx="${r1(ex)}" cy="${r1(ey)}" r="4"/>`;
    const right = ex > x1 - 70;
    g += `<text class="vl" x="${r1(right ? ex - 8 : ex + 8)}" y="${r1(Math.max(yT + 10, ey - 10))}" text-anchor="${right ? 'end' : 'start'}">${esc(money0(cum[last]))}</text>`;
  }
  g += `<g id="mXh" display="none"><line class="xhl" id="mXl" x1="0" x2="0" y1="${yT}" y2="${y0}"/><circle class="dotp" id="mXp" r="4"/><circle class="dot" id="mXc" r="4"/></g><rect class="ov" x="${x0}" y="0" width="${r1(x1 - x0)}" height="${H}"/>`;
  const pName = cap(monthName(pym));
  const dflt = last > 0
    ? `${ym === cur ? 'Hasta hoy' : 'Total del mes'}: <b>${esc(money(cum[last]))}</b>${pDraw ? ` · ${esc(pName)}: ${esc(money(pAt(Math.min(last, pDraw))))}` : ''}`
    : 'Aún no hay gastos este mes';
  Chart.days = { W, N, x0, x1, last, pDraw, cum, pAt, sx, sy, B, pName, dflt };
  const aria = `Gasto acumulado de ${monthName(ym)}${last ? ': ' + money0(cum[last]) : ''}`;
  const leg = `<span><i class="kc"></i>${esc(cap(monthName(ym)))}</span>${pDraw ? `<span><i class="kp"></i>${esc(pName)}</span>` : ''}${B ? '<span><i class="kb"></i>Ritmo del presupuesto</span>' : ''}`;
  return `<div class="cread" id="mRead">${dflt}</div><svg data-chart="days" viewBox="0 0 ${r1(W)} ${H}" width="${r1(W)}" height="${H}" role="img" aria-label="${esc(aria)}">${g}</svg><div class="legend">${leg}</div>`;
}
function bindChart(){
  const el = $('#fMoney svg[data-chart="days"]'), G = Chart.days;
  if (!el || !G) return;
  const xh = $('#mXh', el), xl = $('#mXl', el), xc = $('#mXc', el), xp = $('#mXp', el), rd = $('#mRead');
  const show = e => {
    const r = el.getBoundingClientRect(); if (!r.width) return;
    const px = (e.clientX - r.left) * (G.W / r.width);
    const d = Math.max(1, Math.min(G.N, Math.round((px - G.x0) / (G.x1 - G.x0) * G.N)));
    const x = r1(G.sx(d)), hasC = d <= G.last, hasP = d <= G.pDraw;
    xl.setAttribute('x1', x); xl.setAttribute('x2', x);
    xc.setAttribute('display', hasC ? 'inline' : 'none');
    xp.setAttribute('display', hasP ? 'inline' : 'none');
    if (hasC) { xc.setAttribute('cx', x); xc.setAttribute('cy', r1(G.sy(G.cum[d]))); }
    if (hasP) { xp.setAttribute('cx', x); xp.setAttribute('cy', r1(G.sy(G.pAt(d)))); }
    xh.setAttribute('display', 'inline');
    rd.innerHTML = `Día ${d}: <b>${hasC ? esc(money(G.cum[d])) : '—'}</b>` + (hasP ? ` · ${esc(G.pName)}: ${esc(money(G.pAt(d)))}` : G.B ? ` · ritmo: ${esc(money0(Math.round(G.B * d / G.N)))}` : '');
  };
  const hide = () => { xh.setAttribute('display', 'none'); rd.innerHTML = G.dflt; };
  el.addEventListener('pointerdown', show);
  el.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) show(e); });
  el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
}
function renderMoney(it){
  const box = $('#fMoney');
  if (!S.moneyMonth) S.moneyMonth = curYM();
  const W = Math.max(240, (box.clientWidth || Math.min(window.innerWidth, 600) - 44) - 28);
  const html = moneyHTML(it, S.moneyMonth, W);
  if (html === lastMoney) return;
  box.innerHTML = html; lastMoney = html;

function bindMoney(){

    let d = null;
    try { d = JSON.parse(ta.value); } catch (e) { d = null; }
    if (!d || typeof d !== 'object' || !d.home || !Array.isArray(d.entries)) { err.textContent = 'Ese texto no es una copia válida de Mi espacio.'; err.hidden = false; return; }
    const home = cleanHome(d.home);
    const ok = await confirmDialog({ title: '¿Restaurar esta copia?', message: `Se sustituirá todo por ${plural(home.order.length, 'elemento', 'elementos')} y ${plural(d.entries.length, 'nota o texto', 'notas o textos')}.`, ok: 'Restaurar', danger: false });
    if (!ok || !canWrite()) return;
    applyRestore(home, d.entries);
    sh.close();
    toast('Copia restaurada', 'check');
  });
}
function applyRestore(home, list){
  const entries = new Map();
  for (const raw of list) {
    if (!raw || typeof raw !== 'object' || !home.items[raw.folder]) continue;
    const id = typeof raw.id === 'string' && ID_RE.test(raw.id) && !entries.has(raw.id) ? raw.id : newId();
    entries.set(id, cleanEntry(id, raw));
  }
  if (Editor.id) closeNote(true);
  if (S.folder) closeFolder();
  for (const id of S.entries.keys()) if (!entries.has(id)) removeEntryDoc(id);
  S.home = home; S.entries = entries;
  saveHome();
  for (const e of entries.values()) saveEntry(e);
  render();
}

/* ================= gestos ================= */
let suppressClickUntil = 0, lpHeld = false;
document.addEventListener('click', e => { if (Date.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); } }, true);
const endHold = () => { if (lpHeld) { lpHeld = false; suppressClickUntil = Date.now() + 400; } };
document.addEventListener('pointerup', endHold, true);
document.addEventListener('pointercancel', endHold, true);
document.addEventListener('touchend', endHold, true);
document.addEventListener('touchstart', () => {}, { passive: true }); // activa :active en iOS

function longPress(container, sel, onLong, disabled, deep = false){
  let t = null, cur = null, sx = 0, sy = 0;
  const own = cell => !!cell && (deep ? container.contains(cell) : cell.parentElement === container);
  const clear = () => { clearTimeout(t); t = null; if (cur) cur.classList.remove('pressing'); cur = null; };
  container.addEventListener('pointerdown', e => {
    if (disabled() || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const cell = e.target.closest('.cell');
    if (!own(cell) || e.target.closest('.badge')) return;
    clear();
    cur = $(sel, cell); sx = e.clientX; sy = e.clientY;
    if (cur) cur.classList.add('pressing');
    t = setTimeout(() => {
      const c = cur; clear();
      lpHeld = true; suppressClickUntil = Date.now() + 100000;
      if (c) { c.classList.remove('lift'); void c.offsetWidth; c.classList.add('lift'); }
      onLong(cell.dataset.id, cell);
    }, 480);
  });
  container.addEventListener('pointermove', e => { if (t && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) clear(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => container.addEventListener(ev, () => { if (t) clear(); }));
  container.addEventListener('contextmenu', e => {
    const cell = e.target.closest('.cell');
    if (!own(cell)) return;
    e.preventDefault();
    if (disabled() || lpHeld || Date.now() < suppressClickUntil) return;
    clear();
    suppressClickUntil = Date.now() + 400;
    onLong(cell.dataset.id, cell);
  });
}

function sortable(container, { scroller, active, onDrop }){
  let st = null;
  const cells = () => [...container.children].filter(c => c.classList.contains('cell'));
  const cellAt = target => { const c = target.closest('.cell'); return c && c.parentElement === container ? c : null; };
  function start(cell, x, y, mouse){
    st = { cell, sx: x, sy: y, x, y, mouse, on: false, timer: null };
    if (!mouse) st.timer = setTimeout(begin, 160);
  }
  function begin(){
    if (!st || st.on) return;
    const r = st.cell.getBoundingClientRect();
    st.ox = st.sx - r.left; st.oy = st.sy - r.top;
    const g = st.cell.cloneNode(true);
    g.classList.add('ghost'); g.removeAttribute('data-id');
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    document.body.appendChild(g);
    st.ghost = g; st.on = true; Drag.active = true;
    st.before = cells().map(c => c.dataset.id).join('|');
    st.cell.classList.add('drag-src');
    place();
    st.raf = requestAnimationFrame(tick);
  }
  function place(){
    st.ghost.style.transform = `translate3d(${st.x - st.ox}px, ${st.y - st.oy}px, 0) scale(1.05)`;
    const cr = container.getBoundingClientRect();
    const px = st.x - cr.left, py = st.y - cr.top;
    const list = cells();
    for (const c of list) {
      if (c === st.cell) continue;
      if (px >= c.offsetLeft && px <= c.offsetLeft + c.offsetWidth && py >= c.offsetTop && py <= c.offsetTop + c.offsetHeight) { moveTo(c, list); break; }
    }
  }
  function moveTo(target, list){
    const from = list.indexOf(st.cell), to = list.indexOf(target);
    const first = new Map(list.map(c => [c, c.getBoundingClientRect()]));
    if (to > from) target.after(st.cell); else target.before(st.cell);
    for (const c of list) { c.style.transition = 'none'; c.style.transform = ''; }
    const moved = [];
    for (const c of list) {
      if (c === st.cell) continue;
      const a = first.get(c), b = c.getBoundingClientRect();
      const dx = a.left - b.left, dy = a.top - b.top;
      if (dx || dy) { c.style.transform = `translate(${dx}px, ${dy}px)`; moved.push(c); }
    }
    void container.offsetWidth;
    for (const c of moved) { c.style.transition = 'transform .28s cubic-bezier(.32,.72,0,1)'; c.style.transform = ''; }
  }
  function tick(){
    if (!st || !st.on) return;
    const sr = scroller.getBoundingClientRect(), edge = 72;
    let v = 0;
    if (st.y < sr.top + edge) v = -Math.min(16, (sr.top + edge - st.y) / 4);
    else if (st.y > sr.bottom - edge) v = Math.min(16, (st.y - (sr.bottom - edge)) / 4);
    if (v) { const b = scroller.scrollTop; scroller.scrollTop += v; if (scroller.scrollTop !== b) place(); }
    st.raf = requestAnimationFrame(tick);
  }
  function finish(){
    const s = st; st = null;
    if (!s) return;
    clearTimeout(s.timer);
    if (!s.on) return;
    cancelAnimationFrame(s.raf);
    suppressClickUntil = Date.now() + 400;
    const r = s.cell.getBoundingClientRect();
    s.ghost.style.transition = 'transform .26s cubic-bezier(.32,.72,0,1)';
    s.ghost.style.transform = `translate3d(${r.left}px, ${r.top}px, 0) scale(1)`;
    const after = cells().map(c => c.dataset.id);
    setTimeout(() => {
      s.ghost.remove();
      s.cell.classList.remove('drag-src');
      for (const c of cells()) { c.style.transition = ''; c.style.transform = ''; }
      Drag.active = false;
      if (after.join('|') !== s.before) onDrop(after, s.cell.dataset.id);
      lastHome = ''; lastFolder = '';
      render();
    }, 270);
  }
  container.addEventListener('touchstart', e => {
    if (!active() || e.touches.length !== 1 || st || e.target.closest('.badge')) return;
    const c = cellAt(e.target); if (!c) return;
    const t = e.touches[0];
    start(c, t.clientX, t.clientY, false);
  }, { passive: true });
  container.addEventListener('touchmove', e => {
    if (!st || st.mouse) return;
    const t = e.touches[0]; st.x = t.clientX; st.y = t.clientY;
    if (!st.on) { if (Math.hypot(st.x - st.sx, st.y - st.sy) > 8) { clearTimeout(st.timer); st = null; } return; }
    e.preventDefault();
    place();
  }, { passive: false });
  container.addEventListener('touchend', () => { if (st && !st.mouse) finish(); });
  container.addEventListener('touchcancel', () => { if (st && !st.mouse) finish(); });
  container.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0 || !active() || st || e.target.closest('.badge')) return;
    const c = cellAt(e.target); if (!c) return;
    e.preventDefault();
    start(c, e.clientX, e.clientY, true);
  });
  window.addEventListener('pointermove', e => {
    if (!st || !st.mouse) return;
    st.x = e.clientX; st.y = e.clientY;
    if (!st.on) { if (Math.hypot(st.x - st.sx, st.y - st.sy) > 5) begin(); else return; }
    place();
  });
  window.addEventListener('pointerup', () => { if (st && st.mouse) finish(); });
  container.addEventListener('dragstart', e => e.preventDefault());
}

/* ================= enlaces de eventos ================= */
function bind(){
  $$('[data-ic]').forEach(el => el.insertAdjacentHTML('afterbegin', svg(el.dataset.ic)));

  // inicio
  $('#hAdd').addEventListener('click', () => { if (canWrite()) createMenu(); });
  $('#hDone').addEventListener('click', stopEditing);
  $('#hFolder').addEventListener('click', () => openItemForm({ kind: 'notes' }));
  $('#hSettings').addEventListener('click', openSettings);
  const hGrid = $('#hGrid');
  hGrid.addEventListener('click', e => {
    const cell = e.target.closest('.cell'); if (!cell) return;
    const id = cell.dataset.id, it = S.home.items[id]; if (!it) return;
    if (e.target.closest('.badge')) { e.preventDefault(); askDeleteItem(id); return; }
    if (S.editing === 'home') { e.preventDefault(); return; }
    if (it.kind === 'link') { if (!safeUrl(it.url)) { e.preventDefault(); openItemForm({ id }); } return; }
    openFolder(id);
  });
  $('#hScroll').addEventListener('click', e => { if (S.editing === 'home' && !e.target.closest('.cell')) stopEditing(); });
  longPress(hGrid, '.tile', id => itemActions(id), () => S.editing === 'home');
  sortable(hGrid, { scroller: $('#hScroll'), active: () => S.editing === 'home', onDrop: order => {
    if (!canWrite()) return;
    const known = order.filter(id => S.home.items[id]);
    S.home.order = known.concat(S.home.order.filter(id => !known.includes(id)));
    saveHome();
  }});

  // carpeta
  $('#fBack').addEventListener('click', closeFolder);
  $('#fDone').addEventListener('click', stopEditing);
  $('#fAdd').addEventListener('click', () => {
    const it = S.home.items[S.folder]; if (!it) return;
    if (it.kind === 'notes') newNote();
    else if (it.kind === 'list') focusNewTodo();
    else if (it.kind === 'money') openMoneyForm({ focus: true });
    else openSnipForm();
  });
  const fGrid = $('#fGrid');
  fGrid.addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) { if (act.dataset.act === 'newNote') newNote(); else if (act.dataset.act === 'newSnip') openSnipForm(); return; }
    const cell = e.target.closest('.cell'); if (!cell) return;
    const id = cell.dataset.id;
    if (e.target.closest('.badge')) { askDeleteEntry(id); return; }
    if (S.editing === S.folder) return;
    const it = S.home.items[S.folder]; if (!it) return;
    if (it.kind === 'notes') Editor.open(id);
    else if (it.kind === 'list') toggleTodo(id, cell);
    else if (it.kind === 'copy') copySnip(id, cell);
  });
  $('#fScroll').addEventListener('click', e => { if (S.editing && S.editing === S.folder && !e.target.closest('.cell')) stopEditing(); });
  longPress(fGrid, '.note, .snip, .todo', id => entryActions(id), () => S.editing === S.folder);
  sortable(fGrid, { scroller: $('#fScroll'), active: () => !!S.folder && S.editing === S.folder, onDrop: onSnipDrop });
  const q = $('#fQuery');
  q.addEventListener('input', () => { S.query = q.value; $('#fClear').hidden = !q.value; renderFolder(); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') q.blur(); });
  $('#fClear').addEventListener('click', () => { q.value = ''; S.query = ''; $('#fClear').hidden = true; renderFolder(); });
  bindLists();
  bindMoney();

  // teclado en tarjetas
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"].tile, .note, .snip, .todo, .mv')) { e.preventDefault(); e.target.click(); }
  });

  // nota
  const nT = $('#nTitle'), nB = $('#nBody'), sNote = $('#sNote');
  $('#nBack').addEventListener('click', () => closeNote(false));
  nT.addEventListener('input', () => { autosize(nT); Editor.onInput(); });
  nB.addEventListener('input', () => { autosize(nB); Editor.onInput(); });
  nT.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); nB.focus(); try { nB.setSelectionRange(0, 0); } catch (x) {} } });
  $('#nCopy').addEventListener('click', () => copyAndTell(nB.value || nT.value));
  $('#nDel').addEventListener('click', async () => {
    Editor.commit();
    if (!S.entries.has(Editor.id)) { Editor.dirty = false; closeNote(true); return; }
    if (await askDeleteEntry(Editor.id)) { Editor.dirty = false; closeNote(true); }
  });
  $('#nDone').addEventListener('pointerdown', e => e.preventDefault());
  $('#nDone').addEventListener('click', () => { Editor.commit(); if (document.activeElement) document.activeElement.blur(); });
  sNote.addEventListener('focusin', e => { if (e.target.matches('textarea') && !e.target.readOnly) { $('#nDone').hidden = false; $('#nDel').hidden = true; } });
  sNote.addEventListener('focusout', () => setTimeout(() => {
    const a = document.activeElement;
    if (!(a && sNote.contains(a) && a.matches('textarea'))) { $('#nDone').hidden = true; $('#nDel').hidden = Editor.ro; }
  }, 0));

  // guardar al salir
  const flush = () => { Editor.commit(); if (S.mode === 'local') flushLocal(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); else { maintenance(); scheduleRender(); } });
  window.addEventListener('pagehide', flush);
}

/* ================= arranque ================= */
function boot(){
  let snap = null;
  if (sheetsWanted()) { SS.load(); const v = SS.snapshot(); if (v.home) snap = v; }
  else snap = ls.get(K_CACHE) || ls.get(K_LOCAL);
  if (snap && snap.home) loadSnapshot(snap);
  bind();
  render();
  connect();
}
boot();
})();
