<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi espacio">
<title>Mi espacio</title>
<style>
:root{
  /* Mi espacio: negro puro, tarjetas #191919, iconos blancos tipo Lucide.
     Layout: pila de pantallas tipo iOS (inicio > carpeta > nota), cuadrícula fija de 2 columnas. */
  --bg:#000000;
  --card:#191919;
  --card-hi:#242424;
  --raised:#262626;
  --sheet:#121212;
  --field:#1e1e1e;
  --line:#2a2a2a;
  --text:#ffffff;
  --muted:#8e8e93;
  --faint:#5c5c61;
  --danger:#ff453a;
  --ok:#30d158;
  --warn:#ffd60a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  --r-card:22px;
  --gap:12px;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --pl:max(22px, env(safe-area-inset-left,0px), calc((100% - 600px) / 2));
  --pr:max(22px, env(safe-area-inset-right,0px), calc((100% - 600px) / 2));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:24px;height:24px;flex:none;display:block}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- pantallas ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .46s var(--ease),opacity .46s var(--ease);will-change:transform}
.screen.off{transform:translateX(100%)}
.screen.under{transform:translateX(-24%);opacity:.3}
.scroll{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px var(--pr) 32px var(--pl)}

/* cabecera de inicio */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:calc(var(--st) + 22px) var(--pr) 6px var(--pl);flex:none}
.top h1{margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.022em;text-wrap:balance}
.top .sub{margin:5px 0 0;color:var(--muted);font-size:16px;letter-spacing:-.008em}
.round{width:44px;height:44px;border-radius:50%;background:var(--raised);display:grid;place-items:center;flex:none;transition:transform .2s var(--ease),background-color .2s}
.round:active{transform:scale(.88);background:#333}
.round svg{width:24px;height:24px;stroke-width:2}
.pill{height:36px;padding:0 17px;border-radius:18px;background:#fff;color:#000;font-weight:600;font-size:16px;flex:none;transition:transform .2s var(--ease)}
.pill:active{transform:scale(.94)}

/* cuadrícula */
.grid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.cell{position:relative;min-width:0;display:flex}
.wig{position:relative;flex:1;display:flex;min-width:0}
.tile{position:relative;flex:1;min-width:0;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:17px 14px 16px;background:var(--card);border-radius:var(--r-card);color:var(--text);text-decoration:none;text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:transform .22s var(--ease),background-color .22s}
.tile .ic svg{width:30px;height:30px;stroke-width:1.8}
.tile .name{display:block;font-size:19px;line-height:1.2;font-weight:600;letter-spacing:-.016em;overflow-wrap:anywhere}
.tile .desc{display:block;margin-top:3px;font-size:15px;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.tile .ext{position:absolute;top:16px;right:14px;color:var(--faint)}
.tile .ext svg{width:18px;height:18px}
.tile.ph .name{color:var(--faint)}
.tile:active,.tile.pressing,.note:active,.note.pressing,.snip:active,.snip.pressing{transform:scale(.955);background:var(--card-hi)}
.lift{animation:lift .4s var(--ease)}
@keyframes lift{0%{transform:scale(.955)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
.cell.new .wig{animation:appear .55s var(--ease)}
@keyframes appear{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}

/* modo reorganizar */
.badge{position:absolute;top:-9px;left:-9px;width:28px;height:28px;border-radius:50%;background:#3a3a3c;color:#fff;display:none;place-items:center;z-index:2;box-shadow:0 0 0 3px var(--bg)}
.badge svg{width:15px;height:15px;stroke-width:3}
.editing .badge{display:grid}
.editing .wig{animation:wig .32s ease-in-out infinite}
.editing .cell:nth-child(even) .wig{animation-delay:-.16s;animation-duration:.3s}
@keyframes wig{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.editing .tile,.editing .snip{cursor:grab}
.drag-src .wig{opacity:0;animation:none}
.drag-src::before{content:"";position:absolute;inset:0;border-radius:var(--r-card);border:1.5px dashed #3a3a3c}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;display:flex;filter:drop-shadow(0 18px 28px rgba(0,0,0,.75))}
.ghost .wig{animation:none}
.ghost .badge{display:none}
.ghost .tile,.ghost .snip{background:var(--card-hi)}

/* barra inferior */
.bottom{flex:none;padding:0 var(--pr) calc(var(--sb) + 10px) var(--pl)}
.bottom .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px;min-height:58px}
.bottom .lbl{color:var(--muted);font-size:15.5px;letter-spacing:-.008em}
.bottom .acts{display:flex;gap:4px;margin-right:-8px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;color:#fff;flex:none;transition:transform .2s var(--ease),background-color .2s}
.iconbtn:active{transform:scale(.88);background:#1a1a1a}
.iconbtn svg{width:26px;height:26px;stroke-width:1.8}

/* avisos */
.banner{display:flex;align-items:flex-start;gap:10px;margin:0 0 14px;padding:12px 14px;border-radius:16px;background:#151515;color:#d1d1d6;font-size:14.5px;line-height:1.4}
.banner .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--warn)}
.hint{margin:20px 4px 0;color:var(--faint);font-size:13.5px;line-height:1.4;text-align:center}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:56px 24px;color:var(--muted);font-size:15px;line-height:1.45}
.empty svg{width:40px;height:40px;color:#3a3a3c;stroke-width:1.5;margin-bottom:6px}
.empty b{color:#fff;font-size:18px;font-weight:600}
.empty .pill{margin-top:12px}

/* pantalla de carpeta */
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px;padding:calc(var(--st) + 8px) var(--pr) 2px calc(var(--pl) - 12px);flex:none}
.back{display:flex;align-items:center;gap:1px;height:44px;min-width:0;max-width:62%;padding:0 10px 0 4px;font-size:17px;border-radius:12px;transition:opacity .2s}
.back:active{opacity:.5}
.back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back svg{width:28px;height:28px;stroke-width:2.2}
.navacts{display:flex;align-items:center;gap:2px;margin-right:-8px}
.navacts .pill{margin-left:6px;margin-right:8px}
.head{display:flex;align-items:center;gap:14px;padding:6px var(--pr) 14px var(--pl);flex:none}
.hic{width:52px;height:52px;border-radius:16px;background:var(--card);display:grid;place-items:center;flex:none}
.hic svg{width:28px;height:28px;stroke-width:1.8}
.ht{flex:1;min-width:0}
.ht h2{margin:0;font-size:28px;line-height:1.12;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance}
.ht p{margin:3px 0 0;color:var(--muted);font-size:15px}
.searchwrap{padding:0 var(--pr) 4px var(--pl);flex:none}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 12px;border-radius:12px;background:#151515;color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 1.5px #3a3a3c}
.search svg{width:18px;height:18px}
.search input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;font-size:17px;color:#fff;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#6b6b70}
.clr{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}

/* notas y textos rápidos */
.note{flex:1;min-width:0;min-height:136px;display:flex;flex-direction:column;gap:6px;padding:15px 15px 13px;border-radius:20px;background:var(--card);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:transform .22s var(--ease),background-color .22s}
.note .t{font-size:16.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.note.untitled .t{color:var(--muted)}
.note .p{font-size:14.5px;line-height:1.38;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-line}
.note .d{margin-top:auto;padding-top:4px;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.snip{flex:1;min-width:0;min-height:70px;display:flex;align-items:center;padding:14px 15px;border-radius:18px;background:var(--card);font-size:16.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:transform .22s var(--ease),background-color .3s,color .3s}
.snip.copied{background:#fff;color:#000;transition:transform .22s var(--ease),background-color 0s,color 0s}
.ghost .snip,.ghost .note{transform:none}
.drag-src:has(.snip)::before{border-radius:18px}
.drag-src:has(.note)::before{border-radius:20px}

/* editor de nota */
#nScroll{padding-top:4px}
.ntitle{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;padding:0;margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em;overflow:hidden}
.ndate{margin:8px 0 16px;color:var(--faint);font-size:13.5px}
.nbody{display:block;width:100%;min-height:320px;border:0;outline:0;background:transparent;resize:none;padding:0 0 60px;margin:0;font-size:17.5px;line-height:1.5;overflow:hidden;color:#f2f2f2}
textarea::placeholder,input::placeholder{color:#55555a}

/* hojas */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);opacity:0;transition:opacity .36s var(--ease)}
.backdrop.show{opacity:1}
.backdrop:not(.show),.sheet:not(.show),.dialog:not(.show){pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;width:100%;max-width:600px;margin:0 auto;max-height:calc(100% - var(--st) - 16px);display:flex;flex-direction:column;background:var(--sheet);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .5s var(--ease);padding-bottom:var(--sb)}
.sheet.show{transform:none}
.sheet.page{height:calc(100% - var(--st) - 12px)}
.sheet.tall{max-height:min(86%, calc(100% - var(--st) - 16px))}
.grab{width:38px;height:5px;border-radius:3px;background:#3a3a3c;margin:8px auto 2px;flex:none}
.sh-head{display:flex;align-items:center;gap:13px;padding:12px 22px 6px;flex:none}
.shic{width:44px;height:44px;border-radius:13px;background:var(--card);display:grid;place-items:center;flex:none}
.shic svg{width:24px;height:24px;stroke-width:1.8}
.sh-ht{min-width:0}
.sh-title{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.sh-sub{font-size:14px;color:var(--muted);margin-top:1px}
.acts-list{padding:8px 12px 10px;overflow-y:auto}
.act{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:9px 14px;border-radius:14px;text-align:left;font-size:17px;text-decoration:none;transition:background-color .15s}
.act:active{background:#222}
.act svg{width:23px;height:23px;stroke-width:1.8}
.act .al{flex:1;min-width:0}
.act small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.act.danger{color:var(--danger)}
.act.cancel{justify-content:center;font-weight:600;margin-top:6px;background:#1c1c1c}
.sep{height:1px;background:var(--line);margin:4px 14px}

.fhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 8px 6px;flex:none}
.fhead .l{justify-self:start}
.fhead .r{justify-self:end}
.fhead .ft{font-size:17px;font-weight:600;text-align:center;padding:0 4px}
.tbtn{height:44px;padding:0 12px;font-size:17px;border-radius:12px;color:#fff}
.tbtn.strong{font-weight:600}
.tbtn:disabled{color:#4a4a4e}
.tbtn:not(:disabled):active{opacity:.5}
.fbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 20px 28px;margin:0}
.preview{display:flex;justify-content:center;padding:6px 0 22px}
.preview .cell{width:calc(50% - 6px);max-width:210px;pointer-events:none}
.field{display:block;margin:0 0 16px}
.field > span{display:block;margin:0 4px 7px;color:var(--muted);font-size:13.5px;font-weight:500}
.inp{display:block;width:100%;height:50px;padding:0 15px;border-radius:14px;border:0;outline:0;background:var(--field);font-size:17px;color:#fff;-webkit-appearance:none;appearance:none}
.inp:focus{box-shadow:0 0 0 1.5px #4a4a4e}
textarea.inp{height:auto;min-height:190px;padding:14px 15px;line-height:1.45;resize:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--field)}
.seg button{height:42px;border-radius:11px;font-size:15.5px;font-weight:500;color:var(--muted);transition:background-color .2s,color .2s}
.seg button[aria-pressed="true"]{background:#3a3a3c;color:#fff}
.seg-note{margin:8px 4px 0;color:var(--faint);font-size:13px;line-height:1.4}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.icopt{aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:var(--field);color:#fff;transition:transform .15s var(--ease),background-color .15s,color .15s}
.icopt svg{width:24px;height:24px;stroke-width:1.8}
.icopt[aria-pressed="true"]{background:#fff;color:#000}
.icopt:active{transform:scale(.88)}

.gl{margin:8px 6px 8px;color:var(--muted);font-size:13px;font-weight:500}
.group{background:#1b1b1b;border-radius:16px;overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 16px;font-size:16.5px;text-align:left}
.row + .row{border-top:1px solid #2a2a2a}
.row .rv{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.row svg{width:21px;height:21px;stroke-width:1.9}
button.row:active{background:#232323}
.sdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--warn)}
.sdot.ok{background:var(--ok)}
.sdot.bad{background:var(--danger)}
.foot{color:var(--faint);font-size:13px;line-height:1.45;margin:2px 6px 18px}
.err{color:var(--danger);font-size:14px;margin:10px 4px 0}

/* diálogo */
.dlg-bd{z-index:110}
.dialog{position:fixed;left:50%;top:50%;z-index:111;width:min(300px,calc(100% - 48px));transform:translate(-50%,-50%) scale(1.08);opacity:0;transition:transform .32s var(--ease),opacity .22s;background:#1f1f1f;border-radius:18px;overflow:hidden;text-align:center}
.dialog.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.dialog h3{margin:20px 18px 6px;font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.dialog p{margin:0 18px 18px;color:#c7c7cc;font-size:14px;line-height:1.4}
.dialog .btns{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #333}
.dialog .btns button{height:50px;font-size:17px}
.dialog .btns button + button{border-left:1px solid #333}
.dialog .btns .danger{color:var(--danger);font-weight:600}
.dialog .btns .strong{font-weight:600}

/* aviso flotante */
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);z-index:200;display:flex;align-items:center;gap:8px;max-width:calc(100% - 40px);padding:11px 18px 11px 15px;border-radius:999px;background:#f2f2f2;color:#000;font-size:15.5px;font-weight:600;line-height:1.3;transform:translate(-50%,14px) scale(.95);opacity:0;pointer-events:none;transition:transform .38s var(--ease),opacity .24s}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1}
.toast svg{width:18px;height:18px;stroke-width:2.6}

/* inicio: contador o total en la tarjeta */
.tile .meta{position:absolute;top:18px;right:14px;max-width:calc(100% - 66px);color:var(--muted);font-size:14px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .meta.cnt{top:16px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:#2c2c2e;color:#fff;font-size:13.5px;line-height:24px;text-align:center}

/* listas */
.addrow{display:flex;align-items:center;gap:12px;height:54px;margin:2px 0 12px;padding:0 5px 0 15px;border-radius:18px;background:#151515;color:var(--muted)}
.addrow:focus-within{box-shadow:0 0 0 1.5px #3a3a3c}
.addrow .pc{width:26px;height:26px;border-radius:50%;border:2px dashed #4a4a4e;display:grid;place-items:center;flex:none}
.addrow .pc svg{width:14px;height:14px;stroke-width:3}
.addrow input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;font-size:17px;color:#fff;-webkit-appearance:none;appearance:none}
.addrow .go{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.addrow .go svg{width:23px;height:23px;stroke-width:2.4}
.grid.list{display:flex;flex-direction:column;gap:0}
.list > .cell{display:grid;grid-template-rows:1fr;padding-bottom:8px;transition:grid-template-rows .34s var(--ease),padding-bottom .34s var(--ease)}
.list > .cell > .wig{min-height:0}
.list > .cell.gone{grid-template-rows:0fr;padding-bottom:0}
.list > .cell.gone > .wig{overflow:hidden}
.list > .cell.fume .wig{animation:fume .58s var(--ease) forwards}
@keyframes fume{to{opacity:0;filter:blur(7px);transform:translateY(-8px) scale(.97)}}
.list > .cell.new .wig{animation:appearL .38s var(--ease)}
@keyframes appearL{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.list .drag-src::before{bottom:8px;border-radius:18px}
.editing .list .wig{animation-name:wigs}
@keyframes wigs{0%,100%{transform:rotate(-.3deg)}50%{transform:rotate(.3deg)}}
.todo{flex:1;min-width:0;display:flex;align-items:center;gap:13px;min-height:56px;padding:13px 15px;border-radius:18px;background:var(--card);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .22s var(--ease),background-color .22s}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #5c5c61;flex:none;display:grid;place-items:center;color:#000;transition:background-color .25s var(--ease),border-color .25s,transform .25s var(--ease)}
.chk svg{width:15px;height:15px;stroke-width:3.2;opacity:0;transform:scale(.3);transition:opacity .2s,transform .3s var(--ease)}
.todo.done .chk{background:#fff;border-color:#fff}
.todo.done .chk svg{opacity:1;transform:none}
.tt{flex:1;min-width:0;font-size:16.5px;line-height:1.35;letter-spacing:-.01em;overflow-wrap:anywhere}
.tt span{background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 56%;background-size:0% 1.6px;-webkit-box-decoration-break:slice;box-decoration-break:slice;transition:background-size .42s var(--ease),color .3s}
.todo.done .tt span{background-size:100% 1.6px;color:var(--muted)}
.todo:active,.todo.pressing,.mv:active,.mv.pressing{transform:scale(.975);background:var(--card-hi)}
.ghost .todo{background:var(--card-hi)}
.inp.short{min-height:110px}

/* aviso con botón */
.toast{width:max-content}
.toast .tact{margin:-4px -8px -4px 4px;padding:6px 8px 6px 12px;border-left:1px solid #c7c7cc;color:#000;font-size:15.5px;font-weight:700}
.toast.act.show{pointer-events:auto}

/* finanzas */
.money{padding-top:2px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0 -8px 10px}
.mnav .ml{flex:1;min-width:0;padding:3px 0;border-radius:12px;font-size:17px;font-weight:600;letter-spacing:-.01em;text-align:center}
.mnav .ml small{display:block;margin-top:1px;color:var(--muted);font-size:13px;font-weight:400}
.mnav .ml:active{opacity:.6}
.mnav .iconbtn:disabled{color:#3a3a3c;background:none;transform:none}
.mcard{background:var(--card);border-radius:var(--r-card);padding:18px 18px 16px;margin-bottom:6px}
.mk{color:var(--muted);font-size:14.5px;font-weight:500}
.mbig{margin-top:4px;font-size:46px;line-height:1.05;font-weight:700;letter-spacing:-.035em;overflow-wrap:anywhere}
.mbig .c{font-size:27px;letter-spacing:-.015em}
.mcmp{display:flex;align-items:flex-start;gap:7px;margin-top:9px;color:var(--muted);font-size:14.5px;line-height:1.35}
.mcmp svg{width:18px;height:18px;stroke-width:2.2;margin-top:1px}
.mcmp.up svg{color:var(--danger)}
.mcmp.down svg{color:var(--ok)}
.meter{display:block;width:100%;margin-top:16px;text-align:left;font-size:14px;color:var(--muted)}
.mbar{display:flex;gap:2px;height:8px;border-radius:4px;background:#2c2c2e;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:4px;flex:none}
.meter.ok .mbar i,.meter.ok .mst svg{background:none;color:var(--ok)}
.meter.warn .mst svg{color:var(--warn)}
.meter.bad .mst svg{color:var(--danger)}
.meter.ok .mbar i{background:var(--ok)}
.meter.warn .mbar i{background:var(--warn)}
.meter.bad .mbar i{background:var(--danger)}
.mbar i.u{opacity:.4}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;line-height:1.35}
.mrow b{color:#fff;font-weight:600}
.mrow.sm{display:block;margin-top:5px;font-size:13.5px}
.mst{display:flex;align-items:center;gap:5px;text-align:right}
.mst svg{width:16px;height:16px;stroke-width:2.3}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ms span{display:block;color:var(--muted);font-size:12.5px}
.ms b{display:block;margin-top:3px;font-size:16px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.ms b.pos{color:var(--ok)}
.ms b.neg{color:var(--danger)}
.mlink{display:flex;align-items:center;gap:11px;width:100%;margin-top:8px;padding:13px 14px;border-radius:16px;background:var(--card);font-size:15.5px;color:#fff;text-align:left}
.mlink span{flex:1;min-width:0}
.mlink svg{width:20px;height:20px;stroke-width:1.9}
.mlink svg:last-child{width:18px;height:18px;color:var(--faint)}
.mcard .mlink{margin-top:16px;background:#232323}
.mlink:active{opacity:.7}
.msec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 4px 10px}
.msec h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.msec span{color:var(--muted);font-size:14px}
.mbox{background:var(--card);border-radius:20px;padding:4px 0}
.crow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:7px;padding:11px 16px}
.crow + .crow{border-top:1px solid #232323}
.cic{width:34px;height:34px;border-radius:11px;background:#262626;display:grid;place-items:center;flex:none}
.cic svg{width:18px;height:18px;stroke-width:1.9}
.crow .cic{grid-row:span 2}
.cn{font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.cb{grid-column:2 / 4;display:flex;align-items:center;gap:10px}
.ctrack{flex:1;height:6px;border-radius:3px;background:#2a2a2a;overflow:hidden}
.ctrack i{display:block;height:100%;border-radius:3px;background:#fff}
.cp{width:38px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.dg{display:flex;justify-content:space-between;gap:10px;margin:16px 6px 7px;color:var(--muted);font-size:13.5px;font-weight:500}
.msec + .dg{margin-top:4px}
.mvs{display:flex;flex-direction:column;gap:8px}
.mv{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:62px;padding:11px 15px 11px 13px;border-radius:18px;background:var(--card);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .22s var(--ease),background-color .22s}
.mv.soon{opacity:.6}
.mvt{flex:1;min-width:0}
.mvt b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvt small{display:flex;align-items:center;gap:4px;margin-top:2px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden}
.mvt small svg{width:13px;height:13px;stroke-width:2.2;flex:none}
.mva{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mva.inc{color:var(--ok)}
.chart{background:var(--card);border-radius:20px;padding:14px 14px 12px}
.chart .seg{margin-bottom:12px;background:#232323}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chart svg text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:#2c2c2e;stroke-width:1}
.chart .bud{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.chart .bon{fill:#fff}
.chart .boff{fill:#545458}
.chart .uon{fill:rgba(255,255,255,.36)}
.chart .uoff{fill:rgba(84,84,88,.5)}
.chart text.on{fill:#fff;font-weight:600}
.chart text.vl{fill:#fff;font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.chart .hit,.chart .ov{fill:transparent;cursor:pointer}
.chart .lc{fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .lp{fill:none;stroke:#636366;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .la{fill:rgba(255,255,255,.08)}
.chart .dot{fill:#fff;stroke:var(--card);stroke-width:2}
.chart .dotp{fill:#8e8e93;stroke:var(--card);stroke-width:2}
.chart .xhl{stroke:#8e8e93;stroke-width:1}
.cread{min-height:21px;margin:0 2px 8px;color:var(--muted);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.cread b{color:#fff;font-weight:600}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:10px 2px 0;color:var(--muted);font-size:12.5px}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{color:#fff;font-weight:600}
.legend i{display:block;width:14px;height:2px;border-radius:1px}
.legend i.kc{background:#fff}
.legend i.kp{background:#636366}
.legend i.kb{height:0;border-top:2px dashed var(--warn);border-radius:0}
.legend i.ku{width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.36)}
.amt{display:flex;align-items:baseline;justify-content:center;gap:5px;padding:18px 0 20px;cursor:text}
.amt input{width:2.7ch;max-width:calc(100% - 50px);padding:0;border:0;outline:0;background:transparent;text-align:center;font-size:56px;font-weight:700;letter-spacing:-.03em;color:#fff;-webkit-appearance:none;appearance:none}
.amt input::placeholder{color:#3a3a3c}
.amt span{font-size:34px;font-weight:600;color:var(--muted)}
.lead{margin:12px 8px 0;text-align:center;font-size:17px;font-weight:600;line-height:1.35}
.foot.center{text-align:center;margin-left:14px;margin-right:14px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:68px;padding:8px 2px;border-radius:14px;background:var(--field);color:#d1d1d6;font-size:12px;font-weight:500;line-height:1.15;text-align:center;transition:background-color .15s,color .15s,transform .15s var(--ease)}
.cat svg{width:22px;height:22px;stroke-width:1.8}
.cat[aria-pressed="true"]{background:#fff;color:#000}
.cat:active{transform:scale(.92)}
.sug{display:flex;gap:8px;overflow-x:auto;margin:-6px -20px 16px;padding:0 20px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sug::-webkit-scrollbar{display:none}
.sug button{flex:none;height:34px;padding:0 13px;border-radius:17px;background:var(--field);color:#d1d1d6;font-size:14.5px;white-space:nowrap}
.sug button:active{background:#2c2c2e}
.swrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin:0 0 4px;padding:10px 16px;border-radius:14px;background:var(--field);font-size:16.5px;text-align:left}
.swrow .al{flex:1;min-width:0}
.swrow small{display:block;margin-top:2px;color:var(--muted);font-size:13px}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:#39393d;flex:none;transition:background-color .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.swrow[aria-pressed="true"] .sw{background:var(--ok)}
.swrow[aria-pressed="true"] .sw::after{transform:translateX(20px)}
#mfRepNote{margin-top:8px}
.dbtn{display:block;width:100%;height:50px;margin-top:14px;border-radius:14px;background:#1c1c1c;color:var(--danger);font-size:17px;font-weight:500}
.dbtn:active{background:#262626}
.seg button:disabled{opacity:.35}
input[type="date"].inp{display:flex;align-items:center;text-align:left;line-height:50px}
input[type="date"].inp::-webkit-date-and-time-value{text-align:left}
input[type="date"].inp::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6}

/* entrada con contraseña */
.login{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 24px)}
.lg{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:stretch}
.lgic{width:64px;height:64px;border-radius:20px;background:var(--card);display:grid;place-items:center;margin:0 auto 18px}
.lgic svg{width:30px;height:30px;stroke-width:1.8}
.lg h1{margin:0;text-align:center;font-size:30px;font-weight:700;letter-spacing:-.022em}
.lgsub{margin:8px 4px 26px;text-align:center;color:var(--muted);font-size:15.5px;line-height:1.45}
.lgbtn{height:50px;border-radius:14px;font-size:17px;margin-top:4px;width:100%}
.lgbtn:disabled{opacity:.6}
.lglater{margin:14px auto 0;color:var(--muted)}
.lg .err{text-align:center}
.steps{margin:4px 0 14px;padding-left:22px;color:#e5e5ea;font-size:16px;line-height:1.5}
.steps li{margin-bottom:10px}
.steps b{color:#fff}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
}
</style>
</head>
<body>
<main id="app">
  <section class="screen" id="sHome" aria-label="Mi espacio">
    <header class="top">
      <div>
        <h1>Mi espacio</h1>
        <p class="sub">Tu pequeño ecosistema</p>
      </div>
      <button class="round" id="hAdd" type="button" aria-label="Añadir" data-ic="plus"></button>
      <button class="pill" id="hDone" type="button" hidden>Listo</button>
    </header>
    <div class="scroll" id="hScroll">
      <div class="banner" id="hBanner" hidden><span class="dot"></span><span id="hBannerText"></span></div>
      <div class="grid" id="hGrid"></div>
      <p class="hint" id="hHint" hidden>Arrastra para mover · Pulsa Listo al terminar</p>
    </div>
    <footer class="bottom">
      <div class="bar">
        <span class="lbl">Tu espacio personal</span>
        <div class="acts">
          <button class="iconbtn" id="hFolder" type="button" aria-label="Crear carpeta" data-ic="folder-plus"></button>
          <button class="iconbtn" id="hSettings" type="button" aria-label="Configuración" data-ic="settings-2"></button>
        </div>
      </div>
    </footer>
  </section>

  <section class="screen off" id="sFolder" inert aria-label="Carpeta">
    <header class="nav">
      <button class="back" id="fBack" type="button" data-ic="chevron-left"><span>Mi espacio</span></button>
      <div class="navacts">
        <button class="iconbtn" id="fMore" type="button" aria-label="Más opciones" data-ic="ellipsis" hidden></button>
        <button class="pill" id="fDone" type="button" hidden>Listo</button>
      </div>
    </header>
    <div class="head">
      <div class="hic" id="fIcon"></div>
      <div class="ht"><h2 id="fName"></h2><p id="fSub"></p></div>
      <button class="round" id="fAdd" type="button" aria-label="Añadir" data-ic="plus"></button>
    </div>
    <div class="searchwrap" id="fSearchWrap">
      <label class="search" data-ic="search"><input id="fQuery" type="text" placeholder="Buscar notas" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar notas"><button class="clr" id="fClear" type="button" aria-label="Borrar búsqueda" data-ic="x" hidden></button></label>
    </div>
    <div class="scroll" id="fScroll">
      <div class="addrow" id="fAddRow" hidden><span class="pc" data-ic="plus"></span><input id="fNew" type="text" placeholder="Añadir a la lista" autocomplete="off" enterkeyhint="next" aria-label="Añadir a la lista"><button class="go" id="fNewGo" type="button" aria-label="Añadir" data-ic="check" hidden></button></div>
      <div class="money" id="fMoney" hidden></div>
      <div class="grid" id="fGrid"></div>
      <p class="hint" id="fHint" hidden></p>
    </div>
  </section>

  <section class="screen off" id="sNote" inert aria-label="Nota">
    <header class="nav">
      <button class="back" id="nBack" type="button" data-ic="chevron-left"><span id="nBackLbl">Notas</span></button>
      <div class="navacts">
        <button class="iconbtn" id="nCopy" type="button" aria-label="Copiar contenido" data-ic="copy"></button>
        <button class="iconbtn" id="nDel" type="button" aria-label="Eliminar nota" data-ic="trash-2"></button>
        <button class="pill" id="nDone" type="button" hidden>Listo</button>
      </div>
    </header>
    <div class="scroll" id="nScroll">
      <textarea id="nTitle" class="ntitle" rows="1" placeholder="Título" aria-label="Título" enterkeyhint="next"></textarea>
      <p class="ndate" id="nDate"></p>
      <textarea id="nBody" class="nbody" placeholder="Escribe aquí…" aria-label="Contenido de la nota"></textarea>
    </div>
  </section>
</main>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function slot(){ if (P.active < 4) { P.active++; return Promise.resolve(); } return new Promise(r => P.waiters.push(r)); }

}
async function pump(w){

    await slot();
    w.waiting = null;
    try { await attempt(w.ref, op); } finally { release(); }
  }
  w.busy = false;
  if (!w.next) P.writers.delete(w.ref.path);
  syncChanged();
}
async function attempt(ref, op){
  for (let i = 0; ; i++) {
    try {
      if (op.type === 'del') await ref.delete(); else await ref.set(op.data);
      P.failed = false;
      return true;
    } catch (e) {
      const c = e && e.code;
      if (c === 'resource_exhausted' && i < 4) { await sleep(900 + Math.random() * 1500 * (i + 1)); continue; }
      if ((c === 'unavailable' || !KNOWN.has(c)) && i < 1) { await sleep(400 + Math.random() * 900); continue; }
      P.failed = true;
      if (c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') goReadonly('Se perdió el acceso a tu almacenamiento. Cierra y vuelve a abrir la app.');

  write(k, data, del){
    const prev = this.out.get(k);
    const known = this.docs.get(k);
    if (del && !known && prev && !this.sending.has(k)) { this.out.delete(k); this.saveOut(); this.emit(); return Promise.resolve(); }
    const b = prev ? prev.b : (known ? known.v : 0);
    this.out.set(k, { b, del: del ? 1 : 0, j: del ? null : clone(data), t: Date.now(), s: ++this.seqN });
    this.saveOut();
    this.emit();
    clearTimeout(this.pushT);
    this.pushT = setTimeout(() => this.sync(), 700);
    return Promise.resolve();
  },
  ref(k, path){
    const self = this;
    return {
      path, id: k.replace(/^e:/, ''),
      set: d => self.write(k, d, false),
      delete: () => self.write(k, null, true),
      onSnapshot(cb){ self.listeners.app.push(cb); self.emit(); return () => { self.listeners.app = self.listeners.app.filter(f => f !== cb); }; },
      collection(){ return self.colRef; },
    };
  },
  get colRef(){
    const self = this;
    return {
      path: 'hoja/entries',
      doc: id => self.ref('e:' + id, 'hoja/entries/' + id),
      onSnapshot(cb){ self.listeners.col.push(cb); self.emit(); return () => { self.listeners.col = self.listeners.col.filter(f => f !== cb); }; },
    };
  },
  emit(){
    if (this.emitT) return;
    this.emitT = setTimeout(() => {
      this.emitT = null;
      const meta = { fromCache: !this.ready };
      const app = this.view('app');
      const hs = { exists: !!app, data: () => clone(app), metadata: meta };
      this.listeners.app.forEach(f => f(hs));
      const docs = [];
      const keys = new Set([...this.docs.keys(), ...this.out.keys()]);
      for (const k of keys) { if (!k.startsWith('e:')) continue; const j = this.view(k); if (j) docs.push({ id: k.slice(2), exists: true, data: () => clone(j) }); }
      const cs = { docs, empty: !docs.length, metadata: meta };
      this.listeners.col.forEach(f => f(cs));
      syncChanged();
    }, 0);
  },

  /* --- red --- */
  async request(body, { keepalive = false, timeout = 30000 } = {}){
    const url = serverUrl();
    if (!url) throw { code: 'config' };
    const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), timeout) : null;
    const payload = JSON.stringify(body);
    try {
      const res = await fetch(url, { method: 'POST', body: payload, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow', cache: 'no-store', keepalive: keepalive && payload.length < 60000, signal: ctrl ? ctrl.signal : undefined });
      const txt = await res.text();
      let j = null; try { j = JSON.parse(txt); } catch (e) { j = null; }
      if (!j) throw { code: 'respuesta' };
      return j;
    } catch (e) {
      if (e && e.code) throw e;
      throw { code: 'red' };
    } finally { if (timer) clearTimeout(timer); }
  },
  token(){ return ls.get(K_SES) || ''; },

  async sync(){
    if (!this.token() || this.authFailed) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try {
      do {
        this.again = false;
        await this.push();
        await this.pull();
      } while (this.again && !this.authFailed);
      this.lastErr = '';
    } catch (e) {
      this.lastErr = e && e.code || 'red';
      if (this.lastErr === 'auth') this.onAuthLost();
    } finally {
      this.busy = false;
      syncChanged();
    }
  },
  check(r){
    if (r && r.ok) return r;
    const code = r && r.error || 'servidor';
    throw { code, msg: r && r.msg };
  },
  async pull(){
    const r = this.check(await this.request({ op: 'pull', token: this.token(), since: this.rev }));
    this.lastOk = Date.now();
    if (!r.same) {
      if (r.full) {
        this.docs = new Map();
        this.firstFull = true;
      }
      for (const it of r.items || []) {
        if (typeof it.k !== 'string') continue;
        if (it.d) this.docs.set(it.k, { v: it.v, d: 1 });
        else this.docs.set(it.k, { v: it.v, j: it.j });
      }
      this.rev = Number(r.rev) || 0;
    }
    const wasReady = this.ready;
    this.ready = true;
    this.saveCache();
    if (!r.same || !wasReady) this.emit();
    if (!wasReady || r.full) setTimeout(offerLocalData, 300);
  },
  async push(){
    for (let round = 0; round < 50; round++) {
      const batch = [];
      let size = 0;
      for (const [k, o] of this.out) {
        if (batch.length >= 150 || size > 3e6) break;
        batch.push([k, o.s]);
        const json = o.del ? '' : JSON.stringify(o.j);
        size += json.length;
      }
      if (!batch.length) return;
      const changes = batch.map(([k]) => { const o = this.out.get(k); return { k, b: o.b, del: o.del, t: o.t, j: o.del ? undefined : o.j }; });
      batch.forEach(([k]) => this.sending.add(k));
      let r;
      try { r = this.check(await this.request({ op: 'push', token: this.token(), changes }, { timeout: 60000 })); }
      finally { this.sending.clear(); }
      const byK = new Map((r.res || []).map(x => [x.k, x]));
      let conflicts = 0, rejected = 0;
      for (const [k, s] of batch) {
        const x = byK.get(k), o = this.out.get(k);
        if (!x || !o) continue;
        const sent = changes.find(c => c.k === k);
        if (x.ok) {
          if (sent.del) this.docs.set(k, { v: x.v, d: 1 }); else this.docs.set(k, { v: x.v, j: sent.j });
          if (o.s === s) this.out.delete(k); else o.b = x.v;
        } else if (x.error === 'conflicto') {
          conflicts++;
          this.docs.set(k, x.d ? { v: x.v, d: 1 } : { v: x.v, j: x.j });
          if (o.s !== s) { o.b = x.v; continue; }
          this.out.delete(k);
          resolveConflict(k, sent, x);
        } else {
          rejected++;
          this.out.delete(k);
        }
      }
      this.saveOut(); this.saveCache(); this.emit();
      if (conflicts) toast(conflicts === 1 ? 'Otro dispositivo cambió lo mismo: se ha conservado su versión' : `${conflicts} cambios chocaban con otro dispositivo`, 'info');
      if (rejected) toast(rejected === 1 ? 'La hoja rechazó un cambio (demasiado grande o no válido)' : `La hoja rechazó ${rejected} cambios`, 'x');
    }
  },
  flushKeepalive(){
    if (!this.out.size || !this.token() || this.authFailed) return;
    const changes = [];
    for (const [k, o] of this.out) { if (changes.length >= 40) break; changes.push({ k, b: o.b, del: o.del, t: o.t, j: o.del ? undefined : o.j }); }
    // Si el navegador cierra la página, el envío sigue; la respuesta se pierde, pero al volver
    // se reenvía y el servidor ve que ya lo tiene (mismo contenido) y no lo duplica.
    this.request({ op: 'push', token: this.token(), changes }, { keepalive: true }).catch(() => {});
  },
  start(){
    if (this.started) return;
    this.started = true;
    this.sync();
    this.pollT = setInterval(() => { if (document.visibilityState === 'visible') this.sync(); }, POLL_MS);
    window.addEventListener('online', () => this.sync());
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.sync(); else this.flushKeepalive(); });
  },
  onAuthLost(){
    this.authFailed = true;
    ls.set(K_SES, '');
    showLogin({ expired: true });
  },
};

// Si otro dispositivo cambió lo mismo, nunca se pierde nada en silencio.
function resolveConflict(k, sent, x){
  if (k === 'app') {
    if (sent.del || !sent.j) return;
    const srv = x.d ? null : cleanHome(x.j);
    if (!srv) { SS.write('app', sent.j, false); return; }
    // Se queda el inicio del otro dispositivo y se añaden las carpetas nuevas de este.
    let added = 0;
    const mine = cleanHome(sent.j);
    for (const id of mine.order) if (!srv.items[id]) { srv.items[id] = mine.items[id]; srv.order.push(id); added++; }
    if (added) SS.write('app', srv, false);
    return;
  }
  if (sent.del) return;                       // lo borraste aquí pero se cambió allí: se conserva
  if (x.d) { SS.write(k, sent.j, false); return; }   // lo borraron allí pero lo cambiaste aquí: se recupera
  const it = S.home.items[sent.j.folder];
  const a = x.j || {}, b = sent.j;
  if (it && (it.kind === 'notes' || it.kind === 'copy') && (a.title !== b.title || a.body !== b.body)) {
    const nid = newId();
    SS.write('e:' + nid, { ...b, title: ((b.title || firstLine(b.body) || 'Nota') + ' (conflicto)').slice(0, 300), pos: (b.pos || 0) + 1, updated: Date.now() }, false);
    toast('Una nota se cambió en dos sitios: se guardaron las dos versiones', 'info');
  }
}

// Datos que había solo en este navegador (modo local de antes): ofrecer subirlos.
async function offerLocalData(){
  if (ls.get(K_LOCAL_HECHO)) return;
  const loc = ls.get(K_LOCAL);
  if (!loc || !loc.home) { ls.set(K_LOCAL_HECHO, 1); return; }
  const home = cleanHome(loc.home);
  const list = Array.isArray(loc.entries) ? loc.entries.filter(e => e && typeof e.id === 'string' && ID_RE.test(e.id) && home.items[e.folder]) : [];
  if (!list.length && JSON.stringify(home.order) === JSON.stringify(defaultHome().order)) { ls.set(K_LOCAL_HECHO, 1); return; }
  const empty = !SS.view('app') && ![...SS.docs.keys()].some(k => k.startsWith('e:') && SS.view(k));
  const ok = empty || await confirmDialog({ title: '¿Subir lo de este navegador?', message: `Hay ${plural(list.length, 'elemento guardado', 'elementos guardados')} solo en este navegador. Se añadirán a la hoja sin borrar nada.`, ok: 'Subir', danger: false });
  ls.set(K_LOCAL_HECHO, 1);
  if (!ok) return;
  const cur = SS.view('app') ? cleanHome(SS.view('app')) : null;
  if (!cur) SS.write('app', home, false);
  else {
    let add = 0;
    for (const id of home.order) if (!cur.items[id]) { cur.items[id] = home.items[id]; cur.order.push(id); add++; }
    if (add) SS.write('app', cur, false);
  }
  for (const e of list) if (!SS.view('e:' + e.id)) SS.write('e:' + e.id, entryData(cleanEntry(e.id, e)), false);
  toast(empty ? 'Datos subidos a la hoja' : 'Datos añadidos a la hoja', 'check');
}

function connectSheets(){
  P.uid = null; P.db = SS;
  P.homeRef = SS.ref('app', 'hoja/app');
  P.col = P.homeRef.collection('entries');
  S.mode = 'remote';
  subHome();
  subEntries();
  if (SS.token()) SS.start();
  else showLogin({});
  if (!SS.ready) setBanner(SS.token() ? 'Conectando con tu hoja de Google…' : 'Entra con tu contraseña para ver tus datos.');
}

/* --- pantalla de entrada --- */
function showLogin({ expired = false } = {}){
  if ($('#login')) return;
  const needUrl = !SERVIDOR_URL;
  const el = document.createElement('section');
  el.id = 'login'; el.className = 'login'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Entrar');
  el.innerHTML = `<form class="lg" autocomplete="on" novalidate>
      <span class="lgic">${svg('lock')}</span>
      <h1>Mi espacio</h1>
      <p class="lgsub">${expired ? 'Tu sesión ha caducado o se cerró. Vuelve a escribir la contraseña: lo que hayas cambiado sigue guardado en este dispositivo.' : 'Escribe tu contraseña para conectar este dispositivo con tu hoja de Google.'}</p>
      ${needUrl ? `<label class="field"><span>Dirección del servidor (termina en /exec)</span><input class="inp" id="lgUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></label>` : ''}
      <input type="text" name="username" value="Mi espacio" autocomplete="username" hidden>
      <label class="field"><span>Contraseña</span><input class="inp" id="lgPw" type="password" autocomplete="current-password" enterkeyhint="go" required></label>
      <button class="pill lgbtn" id="lgGo" type="submit">Entrar</button>
      <p class="err" id="lgErr" hidden></p>
      ${SS.ready ? '<button class="tbtn lglater" id="lgLater" type="button">Ahora no</button>' : ''}
    </form>`;
  document.body.append(el);
  const urlI = $('#lgUrl', el), pwI = $('#lgPw', el), go = $('#lgGo', el), err = $('#lgErr', el);
  if (urlI) urlI.value = ls.get(K_SRV) || '';
  const later = $('#lgLater', el);
  if (later) later.addEventListener('click', () => { el.remove(); setBanner('Sin sesión: tus cambios se guardan en este dispositivo y se enviarán cuando entres (Configuración → Entrar).'); });
  setTimeout(() => (urlI && !urlI.value ? urlI : pwI).focus({ preventScroll: true }), 60);
  $('form', el).addEventListener('submit', async e => {
    e.preventDefault();
    err.hidden = true;
    if (urlI) {
      const u = urlI.value.trim();
      if (!SRV_RE.test(u) || !/\/exec(\?|$)/.test(u)) { err.textContent = 'Pega la dirección completa que acaba en /exec.'; err.hidden = false; return; }
      ls.set(K_SRV, u);
    }
    const pw = pwI.value;
    if (!pw) { pwI.focus(); return; }
    go.disabled = true; go.textContent = 'Comprobando…';
    let r = null;
    try { r = await SS.request({ op: 'login', password: pw, device: deviceName() }); } catch (x) { r = { ok: false, error: x && x.code || 'red' }; }
    go.disabled = false; go.textContent = 'Entrar';
    if (r && r.ok && r.token) {
      ls.set(K_SES, r.token);
      SS.authFailed = false;
      el.remove();
      setBanner(SS.ready ? null : 'Conectando con tu hoja de Google…');
      if (!P.homeRef) connectSheets();
      if (SS.started) SS.sync(); else SS.start();
      toast('Dispositivo conectado', 'check');
      return;
    }
    pwI.value = '';
    err.textContent = ({
      contrasena: `Contraseña incorrecta.${r.quedan ? ` Te quedan ${r.quedan} intentos.` : ''}`,
      bloqueado: `Demasiados intentos. Espera ${r.min || 15} minutos y vuelve a probar.`,
      sin_contrasena: 'Todavía no hay contraseña. Ponla en la hoja: menú Mi espacio → 2. Poner o cambiar la contraseña.',
      red: 'No hay conexión con el servidor. Revisa internet y la dirección.',
      respuesta: 'Esa dirección no responde como el servidor de Mi espacio. Revisa que sea la de /exec y que el acceso sea «Cualquier usuario».',
    })[r.error] || 'No se pudo entrar. Prueba otra vez.';
    err.hidden = false;
    pwI.focus();
  });
}

async function logoutSheets(){
  const n = SS.out.size;
  const ok = await confirmDialog({ title: '¿Salir de este dispositivo?', message: n ? `Hay ${plural(n, 'cambio', 'cambios')} sin enviar a la hoja. Si sales ahora se perderán.` : 'Se borrará la copia guardada en este dispositivo. Tus datos siguen en la hoja.', ok: 'Salir' });
  if (!ok) return;
  const tok = SS.token();
  if (tok) { try { await SS.request({ op: 'logout', token: tok }, { timeout: 8000 }); } catch (e) {} }
  [K_SES, K_HOJA, K_OUT].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  location.reload();
}

/* ================= render ================= */
const Drag = { active: false };
let renderQueued = false;
function scheduleRender(){ if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
function render(){
  if (Drag.active) return;
  renderHome();
  if (S.folder) renderFolder();
}

function tileInner(it){
  return `<span class="ic">${svg(it.icon)}</span><span class="txt"><span class="name">${esc(it.name)}</span>${it.desc ? `<span class="desc">${esc(it.desc)}</span>` : ''}</span>${it.kind === 'link' ? `<span class="ext">${svg('arrow-up-right')}</span>` : ''}${tileMeta(it)}`;
}
function tileHTML(it){
  const inner = tileInner(it);
  const tile = it.kind === 'link'
    ? `<a class="tile" href="${esc(safeUrl(it.url) || '#')}"${isWeb(it.url) ? ' target="_blank" rel="noopener noreferrer"' : ''} draggable="false" aria-label="${esc(it.name)}, acceso directo">${inner}</a>`
    : `<div class="tile" role="button" tabindex="0" aria-label="${esc(it.name)}, ${esc(kindLabel(it.kind).toLowerCase())}">${inner}</div>`;
  return `<div class="cell" data-id="${esc(it.id)}"><div class="wig">${tile}<button class="badge" type="button" aria-label="Eliminar ${esc(it.name)}">${svg('minus')}</button></div></div>`;
}
let lastHome = '';
function renderHome(){
  const items = S.home.order.map(id => S.home.items[id]).filter(Boolean);
  const html = items.length ? items.map(tileHTML).join('')
    : `<div class="empty">${svg('layout-grid')}<b>Tu espacio está vacío</b><span>Pulsa + para crear una carpeta o un acceso directo.</span></div>`;
  if (html !== lastHome) { $('#hGrid').innerHTML = html; lastHome = html; }
  const ed = S.editing === 'home';
  $('#sHome').classList.toggle('editing', ed);
  $('#hAdd').hidden = ed;
  $('#hDone').hidden = !ed;
  $('#hHint').hidden = !ed;
}

function noteHTML(e){
  const t = e.title.trim();
  const shown = t || firstLine(e.body);
  const preview = t ? e.body.trim() : e.body.trim().split('\n').slice(1).join('\n').trim();
  return `<div class="cell" data-id="${esc(e.id)}"><div class="wig"><div class="note${shown ? '' : ' untitled'}" role="button" tabindex="0"><span class="t">${esc(shown || 'Nota sin título')}</span>${preview ? `<span class="p">${esc(preview.slice(0, 400))}</span>` : ''}<span class="d">${esc(fmtDate(e.updated))}</span></div></div></div>`;
}
function snipHTML(e){
  const t = e.title.trim() || firstLine(e.body) || 'Sin título';
  return `<div class="cell" data-id="${esc(e.id)}"><div class="wig"><div class="snip" role="button" tabindex="0" aria-label="Copiar ${esc(t)}"><span>${esc(t)}</span></div><button class="badge" type="button" aria-label="Eliminar ${esc(t)}">${svg('minus')}</button></div></div>`;
}
const emptyHTML = (icon, title, text, btn, act) => `<div class="empty">${svg(icon)}<b>${esc(title)}</b><span>${text}</span>${btn ? `<button class="pill" type="button" data-act="${act}">${esc(btn)}</button>` : ''}</div>`;

let lastFolder = '', lastMoney = '';
function gridHTML(it){
  const list = folderEntries(it.id);
  const ed = S.editing === it.id;
  let html = '', hint = '';
  if (it.kind === 'notes') {
    let arr = list.sort((a, b) => b.updated - a.updated);
    const q = norm(S.query.trim());
    if (q) arr = arr.filter(e => norm(e.title).includes(q) || norm(e.body).includes(q));
    if (arr.length) { html = arr.map(noteHTML).join(''); if (!q) hint = 'Mantén pulsada una nota para copiarla, duplicarla o eliminarla'; }
    else if (q) html = emptyHTML('search', 'Sin resultados', `Ninguna nota contiene «${esc(S.query.trim())}».`);
    else html = emptyHTML('notepad-pen', 'Aún no hay notas', 'Crea la primera con el botón +.', 'Nueva nota', 'newNote');
  } else if (it.kind === 'list') {
    const arr = list.sort(snipSort);
    if (arr.length) { html = arr.map(todoHTML).join(''); hint = ed ? 'Arrastra para mover · Pulsa Listo al terminar' : 'Toca para tachar · Mantén pulsado para editar'; }
    else html = emptyHTML('list-checks', 'Lista vacía', 'Escribe arriba y pulsa Intro para añadir. Al tocar el círculo se tacha y, al momento, desaparece.');
  } else if (it.kind === 'copy') {
    const arr = list.sort(snipSort);
    if (arr.length) { html = arr.map(snipHTML).join(''); hint = ed ? 'Arrastra para mover · Pulsa Listo al terminar' : 'Toca para copiar · Mantén pulsado para más opciones'; }
    else html = emptyHTML('copy', 'Aún no hay textos', 'Guarda aquí lo que copias a menudo: tu correo, tu dirección, respuestas que repites…', 'Nuevo texto', 'newSnip');
  }
  return { html, hint };
}
function renderFolder(){
  const it = S.home.items[S.folder];
  if (!it || it.kind === 'link') { if (Editor.id) closeNote(true); closeFolder(); return; }
  const list = folderEntries(it.id);
  const isList = it.kind === 'list', isMoney = it.kind === 'money';
  let count;
  if (isList) { const p = list.filter(e => !e.done).length; count = p ? plural(p, 'pendiente', 'pendientes') : list.length ? 'Todo hecho' : 'Nada pendiente'; }
  else if (isMoney) count = countLabel('money', list.filter(e => !e.rep).length);
  else count = countLabel(it.kind, list.length);
  $('#fIcon').innerHTML = svg(it.icon);
  $('#fName').textContent = it.name;
  $('#fSub').textContent = [it.desc, count].filter(Boolean).join(' · ');
  $('#fSearchWrap').hidden = it.kind !== 'notes';
  $('#fAddRow').hidden = !isList;
  $('#fMoney').hidden = !isMoney;
  const grid = $('#fGrid');
  grid.hidden = isMoney;
  grid.classList.toggle('list', isList);
  const ed = S.editing === it.id;
  $('#sFolder').classList.toggle('editing', ed);
  $('#fAdd').hidden = ed;
  $('#fDone').hidden = !ed;
  $('#fMore').hidden = ed || !(isList || isMoney);
  $('#fAdd').setAttribute('aria-label', ({ notes: 'Nueva nota', copy: 'Nuevo texto', list: 'Añadir a la lista', money: 'Nuevo gasto' })[it.kind] || 'Añadir');
  const g = gridHTML(it);
  if (g.html !== lastFolder) { grid.innerHTML = g.html; lastFolder = g.html; }
  $('#fHint').textContent = g.hint;
  $('#fHint').hidden = !g.hint;
  if (isMoney) renderMoney(it);
  else if (lastMoney) { $('#fMoney').innerHTML = ''; lastMoney = ''; Chart.days = null; }
}

/* ================= navegación ================= */
function setScreen(el, state){
  el.classList.toggle('off', state === 'off');
  el.classList.toggle('under', state === 'under');
  el.inert = state !== 'on';
}
function openFolder(id){
  const it = S.home.items[id];
  if (!it || it.kind === 'link') return;
  S.folder = id; S.query = ''; $('#fQuery').value = ''; $('#fClear').hidden = true;
  if (S.editing) S.editing = null;
  S.moneyMonth = curYM();
  $('#fNew').value = ''; $('#fNewGo').hidden = true;
  lastFolder = ''; lastMoney = '';
  renderFolder(); renderHome();
  $('#fScroll').scrollTop = 0;
  setScreen($('#sHome'), 'under');
  setScreen($('#sFolder'), 'on');
}
function closeFolder(){
  if (S.editing && S.editing !== 'home') S.editing = null;
  if (document.activeElement) document.activeElement.blur();
  S.folder = null;
  setScreen($('#sFolder'), 'off');
  setScreen($('#sHome'), 'on');
  renderHome();
}
function startEditing(scope){
  if (!canWrite()) return;
  S.editing = scope;
  render();
}

const Editor = {
  id: null, folder: null, dirty: false, timer: null, ro: false,
  open(id){
    const fid = S.folder, it = S.home.items[fid];
    const e = id ? S.entries.get(id) : null;
    Editor.id = e ? e.id : newId(); Editor.folder = fid; Editor.dirty = false;
    const t = $('#nTitle'), b = $('#nBody');
    t.value = e ? e.title : ''; b.value = e ? e.body : '';
    $('#nDate').textContent = e ? 'Editada ' + fmtDate(e.updated).toLowerCase() : 'Nueva nota';
    $('#nBackLbl').textContent = it ? it.name : 'Atrás';
    Editor.refreshReadonly();
    $('#nScroll').scrollTop = 0;
    setScreen($('#sFolder'), 'under');
    setScreen($('#sNote'), 'on');
    requestAnimationFrame(() => { autosize(t); autosize(b); });
  },
  refreshReadonly(){
    Editor.ro = !writableNow();
    $('#nTitle').readOnly = Editor.ro; $('#nBody').readOnly = Editor.ro;
    $('#nDel').hidden = Editor.ro || !$('#nDone').hidden;
  },
  onInput(){
    if (Editor.ro || !Editor.id) return;
    Editor.dirty = true;
    clearTimeout(Editor.timer);
    Editor.timer = setTimeout(Editor.commit, 450);
  },
  commit(){
    clearTimeout(Editor.timer); Editor.timer = null;
    if (!Editor.id || !Editor.dirty) return;
    if (!writableNow()) return;
    Editor.dirty = false;
    const title = $('#nTitle').value, body = $('#nBody').value;
    let e = S.entries.get(Editor.id);
    if (!e) {
      if (!title.trim() && !body.trim()) return;
      const now = Date.now();
      e = { id: Editor.id, folder: Editor.folder, title: '', body: '', pos: 0, created: now, updated: now };
      S.entries.set(e.id, e);
    }
    if (e.title === title && e.body === body) return;
    e.title = title; e.body = body; e.updated = Date.now();
    saveEntry(e);
    $('#nDate').textContent = 'Editada ' + fmtDate(e.updated).toLowerCase();
    scheduleRender();
  },
  syncFromState(){
    if (!Editor.id || Editor.dirty) return;
    const e = S.entries.get(Editor.id);
    if (!e) return;
    const t = $('#nTitle'), b = $('#nBody');
    if (document.activeElement !== t && t.value !== e.title) { t.value = e.title; autosize(t); }
    if (document.activeElement !== b && b.value !== e.body) { b.value = e.body; autosize(b); }
  },
};
function autosize(t){
  const sc = $('#nScroll'), top = sc.scrollTop;
  t.style.height = 'auto';
  t.style.height = t.scrollHeight + 'px';
  sc.scrollTop = top;
}
function newNote(){
  if (!canWrite()) return;
  Editor.open(null);
  try { $('#nTitle').focus({ preventScroll: true }); } catch (e) {}
}
function closeNote(silent){
  Editor.commit();
  const e = S.entries.get(Editor.id);
  if (e && !e.title.trim() && !e.body.trim() && writableNow()) {
    S.entries.delete(e.id); removeEntryDoc(e.id);
    if (!silent) toast('Nota vacía descartada');
  }
  Editor.id = null; Editor.dirty = false;
  if (document.activeElement) document.activeElement.blur();
  setScreen($('#sNote'), 'off');
  setScreen($('#sFolder'), S.folder ? 'on' : 'off');
  scheduleRender();
}

/* ================= copiar ================= */
function execCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;pointer-events:none;';
  document.body.appendChild(ta);
  let ok = false;
  try {
    const sel = document.getSelection();
    const range = document.createRange();
    range.selectNodeContents(ta);
    sel.removeAllRanges(); sel.addRange(range);
    ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
    sel.removeAllRanges();
  } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
function copyText(text){
  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    let p;
    try { p = navigator.clipboard.writeText(text); } catch (e) { p = Promise.reject(e); }
    return p.then(() => true, () => execCopy(text));
  }
  return Promise.resolve(execCopy(text));
}
function copyAndTell(text, okMsg = 'Copiado'){
  if (!text) { toast('No hay nada que copiar'); return; }
  copyText(text).then(ok => ok ? toast(okMsg, 'check') : manualCopy(text));
}
function manualCopy(text){
  const sh = makeSheet(`<div class="grab"></div><div class="sh-head"><div class="sh-ht"><div class="sh-title">Copia manual</div><div class="sh-sub">El navegador no dejó copiar automáticamente</div></div></div>
    <div class="fbody"><p class="foot">Mantén pulsado el texto y elige «Copiar».</p><textarea class="inp" id="mcText" rows="6" readonly></textarea></div>`, 'tall');
  const t = $('#mcText', sh.el); t.value = text;
  setTimeout(() => { try { t.focus(); t.select(); } catch (e) {} }, 350);
}
function copySnip(id, cell){
  const e = S.entries.get(id); if (!e) return;
  const text = e.body || e.title;
  if (!text) { toast('Este texto está vacío'); return; }
  const card = cell && $('.snip', cell);
  if (card) { card.classList.add('copied'); setTimeout(() => card.classList.remove('copied'), 420); }
  copyAndTell(text);
}

const stack = [];
function makeSheet(html, kind = ''){
  const bd = document.createElement('div'); bd.className = 'backdrop';
  const el = document.createElement('div'); el.className = 'sheet ' + kind;
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = html;
  $('#layer').append(bd, el);
  const obj = {
    el, closed: false, onclose: null,
    close(){
      if (obj.closed) return; obj.closed = true;
      el.classList.remove('show'); bd.classList.remove('show');
      const i = stack.indexOf(obj); if (i >= 0) stack.splice(i, 1);
      if (el.contains(document.activeElement)) document.activeElement.blur();
      if (obj.onclose) obj.onclose();
      setTimeout(() => { bd.remove(); el.remove(); }, 520);
    }
  };
  if (!kind.includes('page')) bd.addEventListener('click', () => obj.close());
  el.addEventListener('click', e => { if (e.target.closest('[data-close]')) obj.close(); });
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('input.inp')) { e.preventDefault(); const nx = e.target.dataset.next; if (nx && $('#' + nx, el)) $('#' + nx, el).focus(); else e.target.blur(); }
  });
  stack.push(obj);
  el.getBoundingClientRect();
  el.classList.add('show'); bd.classList.add('show');
  return obj;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length && !document.querySelector('.dialog')) stack[stack.length - 1].close(); });

function actionSheet({ title, sub, icon, actions }){
  const rows = actions.map((a, i) => {
    if (a.sep) return '<div class="sep"></div>';
    const body = `${svg(a.icon)}<span class="al">${esc(a.label)}${a.sub ? `<small>${esc(a.sub)}</small>` : ''}</span>`;
    if (a.href) return `<a class="act" data-i="${i}" href="${esc(a.href)}"${isWeb(a.href) ? ' target="_blank" rel="noopener noreferrer"' : ''}>${body}</a>`;
    return `<button class="act${a.danger ? ' danger' : ''}" data-i="${i}" type="button">${body}</button>`;
  }).join('');
  const sh = makeSheet(`<div class="grab"></div>${title ? `<div class="sh-head">${icon ? `<span class="shic">${svg(icon)}</span>` : ''}<div class="sh-ht"><div class="sh-title">${esc(title)}</div>${sub ? `<div class="sh-sub">${esc(sub)}</div>` : ''}</div></div>` : ''}<div class="acts-list">${rows}<button class="act cancel" type="button" data-close>Cancelar</button></div>`);
  sh.el.addEventListener('click', e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const a = actions[+b.dataset.i];
    if (a.href) { sh.close(); return; }
    if (a.sync) { a.run(); sh.close(); return; }
    sh.close();
    setTimeout(a.run, 150);
  });
  return sh;
}

function confirmDialog({ title, message, ok = 'Eliminar', danger = true }){
  return new Promise(res => {
    const bd = document.createElement('div'); bd.className = 'backdrop dlg-bd';
    const d = document.createElement('div'); d.className = 'dialog'; d.setAttribute('role', 'alertdialog'); d.setAttribute('aria-modal', 'true');
    d.innerHTML = `<h3>${esc(title)}</h3>${message ? `<p>${esc(message)}</p>` : ''}<div class="btns"><button type="button" data-v="0">Cancelar</button><button type="button" data-v="1" class="${danger ? 'danger' : 'strong'}">${esc(ok)}</button></div>`;
    $('#layer').append(bd, d);
    d.getBoundingClientRect();
    bd.classList.add('show'); d.classList.add('show');
    const key = e => { if (e.key === 'Escape') done(false); };
    const done = v => {
      document.removeEventListener('keydown', key);
      bd.classList.remove('show'); d.classList.remove('show');
      setTimeout(() => { bd.remove(); d.remove(); }, 320);
      res(v);
    };
    d.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) done(b.dataset.v === '1'); });
    bd.addEventListener('click', () => done(false));
    document.addEventListener('keydown', key);
    try { $('[data-v="0"]', d).focus({ preventScroll: true }); } catch (e) {}
  });
}

let toastT = null, toastAct = null;
function toast(msg, icon, action){
  const t = $('#toast');
  if (toastAct && toastAct.expire && !(action && action.key === toastAct.key)) toastAct.expire();
  toastAct = action || null;
  t.innerHTML = (icon ? svg(icon) : '') + `<span>${esc(msg)}</span>` + (action ? `<button class="tact" type="button">${esc(action.label)}</button>` : '');
  t.classList.toggle('act', !!action);
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => {
    t.classList.remove('show');
    const a = toastAct; toastAct = null;
    if (a && a.expire) a.expire();
  }, action ? 4500 : msg.length > 32 ? 2800 : 1500);
}

function duplicateItem(id){
  if (!canWrite()) return;
  const it = S.home.items[id]; if (!it) return;
  const nid = newId();
  S.home.items[nid] = { ...it, id: nid, name: (it.name + ' (copia)').slice(0, 60) };
  S.home.order.splice(S.home.order.indexOf(id) + 1, 0, nid);
  if (it.kind !== 'link') for (const e of folderEntries(id)) { const ne = { ...e, id: newId(), folder: nid }; S.entries.set(ne.id, ne); saveEntry(ne); }
  saveHome();
  render();
  setTimeout(() => revealTile(nid), 60);
  toast('Duplicado', 'check');
}

async function askDeleteItem(id){
  if (!canWrite()) return;
  const it = S.home.items[id]; if (!it) return;
  const n = it.kind === 'link' ? 0 : folderEntries(id).length;
  const msg = it.kind === 'link' ? 'Se quitará este acceso directo.'
    : n ? `También se borrarán ${countLabel(it.kind, n)}. No se puede deshacer.`
    : 'La carpeta está vacía.';
  const ok = await confirmDialog({ title: `¿Eliminar «${it.name}»?`, message: msg });
  if (!ok || !canWrite() || !S.home.items[id]) return;
  delete S.home.items[id];
  S.home.order = S.home.order.filter(x => x !== id);
  saveHome();
  for (const e of folderEntries(id)) { S.entries.delete(e.id); removeEntryDoc(e.id); }
  if (S.folder === id) closeFolder();
  render();
  toast('Eliminado', 'trash-2');
}

const pad = n => String(n).padStart(2, '0');

const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const monthsBetween = (a, b) => { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); };
const recurDay = (start, ym) => `${ym}-${pad(Math.min(+start.slice(8, 10) || 1, daysIn(ym)))}`;
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  if (s === ymd(t)) return 'Hoy';

function parseAmount(v){
  let s = String(v || '').replace(/[\s€]/g, '');
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (s.includes(',')) { const i = s.lastIndexOf(','); s = s.slice(0, i).replace(/,/g, '') + '.' + s.slice(i + 1); }
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  if (!/^\d*\.?\d*$/.test(s) || s === '.' ) return NaN;
  const n = Math.round(parseFloat(s) * 100);
  return Number.isFinite(n) ? n : NaN;
}

const Fume = {
  timers: new Map(), on: new Set(), gone: new Set(),
  schedule(e){
    if (this.timers.has(e.id)) return;
    const wait = Math.max(0, e.done + DONE_MS - Date.now());
    this.timers.set(e.id, setTimeout(() => this.start(e.id, wait > 0), wait));
  },
  cancel(id){ clearTimeout(this.timers.get(id)); this.timers.delete(id); this.on.delete(id); this.gone.delete(id); },
  start(id, live){
    const e = S.entries.get(id);
    if (!e || !e.done) { this.cancel(id); return; }
    if (!writableNow()) { this.timers.delete(id); return; }   // se reintenta al reconectar
    const cell = S.folder === e.folder ? cellFor(id) : null;
    if (!cell || !live || document.visibilityState === 'hidden') { this.finish(id, live); return; }
    this.on.add(id); cell.classList.add('fume'); syncListCache();
    this.timers.set(id, setTimeout(() => {
      const c = cellFor(id);
      this.gone.add(id); if (c) c.classList.add('gone'); syncListCache();
      this.timers.set(id, setTimeout(() => this.finish(id, true), 360));
    }, 520));
  },
  finish(id, tell){
    this.cancel(id);
    const e = S.entries.get(id);
    if (!e || !e.done || !writableNow()) { scheduleRender(); return; }
    S.entries.delete(id); removeEntryDoc(id);
    const c = cellFor(id);
    if (c && folderEntries(e.folder).length) { c.remove(); syncListCache(); }
    scheduleRender();
    if (tell) Undo.push(e, 'done');
  },
};

  },
  restore(){
    const list = this.bin; this.bin = []; this.kind = '';
    if (!canWrite()) return;
    const ids = [];
    for (const x of list) {
      if (!S.home.items[x.folder] || S.entries.has(x.id)) continue;

  if (!lines.length) return 0;

  let min = Infinity;
  for (const e of folderEntries(fid)) if (e.pos < min) min = e.pos;

const moneyList = fid => folderEntries(fid).filter(e => !e.rep && e.day);
// Por mes: s = gastado hasta hoy, u = apuntado con fecha futura (pendiente)
function monthTotals(fid){
  const t = todayStr(), m = new Map();
  for (const e of moneyList(fid)) {
    if (e.inc) continue;
    const k = ymOf(e.day), o = m.get(k) || { s: 0, u: 0 };
    if (e.day <= t) o.s += e.amt; else o.u += e.amt;
    m.set(k, o);
  }
  return m;
}
function monthStats(fid, ym){
  const t = todayStr();
  const st = { spent: 0, soon: 0, inc: 0, variable: 0, nVar: 0, maxVar: 0, nOut: 0, max: null, cats: new Map(), items: [] };
  for (const e of moneyList(fid)) {
    if (ymOf(e.day) !== ym) continue;
    st.items.push(e);
    if (e.inc) { if (e.day <= t) st.inc += e.amt; continue; }
    st.nOut++;
    if (e.day > t) { st.soon += e.amt; continue; }
    st.spent += e.amt;
    if (!e.src) { st.variable += e.amt; st.nVar++; if (e.amt > st.maxVar) st.maxVar = e.amt; }
    st.cats.set(e.cat, (st.cats.get(e.cat) || 0) + e.amt);
    if (!st.max || e.amt > st.max.amt) st.max = e;
  }
  return st;
}
function spentUntil(fid, ym, dayNum){
  const t = todayStr(); let s = 0;
  for (const e of moneyList(fid)) if (!e.inc && ymOf(e.day) === ym && e.day <= t && +e.day.slice(8) <= dayNum) s += e.amt;
  return s;
}
// Los fijos mensuales son plantillas (rep) que generan un movimiento cada mes.
// El id del movimiento es fijo (plantilla~AAAAMM): si dos dispositivos lo crean a la vez, es el mismo.
function ensureRecurring(){
  if (!writableNow()) return;
  const cur = curYM(), now = Date.now();
  let changed = false;
  for (const t of [...S.entries.values()]) {
    if (!t.rep || !t.day) continue;
    const it = S.home.items[t.folder]; if (!it || it.kind !== 'money') continue;
    const start = ymOf(t.day);
    let m = t.upto ? addYM(t.upto, 1) : start;
    if (m < start) m = start;
    let last = t.upto, k = 0;
    while (m <= cur && k < 36) {
      const id = t.id + '~' + m.replace('-', '');
      if (!S.entries.has(id)) {
        const e = { id, folder: t.folder, title: t.title, body: '', pos: 0, created: now, updated: now, done: 0, amt: t.amt, cat: t.cat, inc: t.inc, day: recurDay(t.day, m), rep: 0, src: t.id, upto: '' };
        S.entries.set(id, e); saveEntry(e); changed = true;
      }
      last = m; m = addYM(m, 1); k++;
    }
    if (last && last !== t.upto) { t.upto = last; saveEntry(t); changed = true; }
  }
  if (changed) scheduleRender();
}

function migrate(){

  const vals = Object.values(h.items);

/* ================= finanzas: pantalla ================= */
const Chart = { days: null };
const r1 = n => Math.round(n * 10) / 10;
function niceMax(v){
  if (!(v > 0)) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v - 1e-9) return m * p;
  return 10 * p;
}
const tickLabel = v => v >= 10000 ? NUM1.format(v / 1000) + ' mil' : NUM1.format(v);
function barPath(x, w, yb, yt, r){
  const h = yb - yt; if (h <= 0) return '';
  r = Math.min(r, h, w / 2);
  return `M${r1(x)},${r1(yb)}V${r1(yt + r)}Q${r1(x)},${r1(yt)} ${r1(x + r)},${r1(yt)}H${r1(x + w - r)}Q${r1(x + w)},${r1(yt)} ${r1(x + w)},${r1(yt + r)}V${r1(yb)}Z`;
}
function gridLines(x0, x1, y0, yT, top){

}
function mvHTML(e, soon, tpl){
