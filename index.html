<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi espacio">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Mi espacio</title>
<style>
:root{
  /* Mi espacio: negro puro, tarjetas #191919, iconos blancos tipo Lucide.
     Layout: pila de pantallas tipo iOS (inicio > carpeta > nota), cuadrícula fija de 2 columnas. */
  --bg:#000000;
  --card:#191919;
  --card-hi:#242424;
  --raised:#262626;
  --sheet:#121212;
  --field:#1e1e1e;
  --line:#2a2a2a;
  --text:#ffffff;
  --muted:#8e8e93;
  --faint:#77777c;
  --danger:#ff453a;
  --ok:#30d158;
  --warn:#ffd60a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  --r-card:22px;
  --gap:12px;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --pl:max(22px, env(safe-area-inset-left,0px), calc((100% - 600px) / 2));
  --pr:max(22px, env(safe-area-inset-right,0px), calc((100% - 600px) / 2));
  color-scheme:dark;
  /* grises de la interfaz (los genera el tema; en claro se sustituyen abajo) */
  --wrgb:255,255,255;--scrim:rgba(0,0,0,.5);--panel:rgba(28,28,30,.72);
  --n000000:#000000;--n101010:#101010;--n111111:#111111;--n121212:#121212;--n141414:#141414;--n151515:#151515;--n161616:#161616;--n1a1a1a:#1a1a1a;--n1b1b1b:#1b1b1b;--n1c1c1c:#1c1c1c;--n1c1c1e:#1c1c1e;--n1d1d1d:#1d1d1d;--n1e1e1e:#1e1e1e;--n1f1f1f:#1f1f1f;--n202020:#202020;--n222222:#222222;--n232323:#232323;--n242424:#242424;--n262626:#262626;--n2a2a2a:#2a2a2a;--n2c2c2e:#2c2c2e;--n333333:#333333;--n39393d:#39393d;--n3a3a3c:#3a3a3c;--n4a4a4e:#4a4a4e;--n545458:#545458;--n5c5c61:#5c5c61;--n636366:#636366;--n6b6b70:#6b6b70;--n8e8e93:#8e8e93;--nc7c7cc:#c7c7cc;--nd1d1d6:#d1d1d6;--ne5e5ea:#e5e5ea;--nf2f2f2:#f2f2f2;--nffffff:#ffffff;--t48484c:#48484c;--t4a4a4e:#4a4a4e;--t55555a:#55555a;
}
/* ---------- modo claro (Configuración → Aspecto) ---------- */
html.light{
  --bg:#ffffff;--card:#f1f1f3;--card-hi:#e6e6ea;--raised:#e9e9ed;--sheet:#fafafb;--field:#eeeef1;--line:#dcdce0;--text:#0b0b0c;--muted:#636368;--faint:#77777c;--danger:#d92d20;--ok:#1a8f3e;--warn:#a87400;
  --wrgb:0,0,0;--scrim:rgba(235,235,240,.62);--panel:rgba(255,255,255,.82);color-scheme:light;
  --n000000:#ffffff;--n101010:#f6f6f6;--n111111:#f5f5f5;--n121212:#f5f5f5;--n141414:#f4f4f4;--n151515:#f3f3f3;--n161616:#f3f3f3;--n1a1a1a:#f0f0f0;--n1b1b1b:#f0f0f0;--n1c1c1c:#efefef;--n1c1c1e:#efefef;--n1d1d1d:#efefef;--n1e1e1e:#eeeeee;--n1f1f1f:#eeeeee;--n202020:#ededed;--n222222:#ececec;--n232323:#ebebeb;--n242424:#ebebeb;--n262626:#eaeaea;--n2a2a2a:#e7e7e7;--n2c2c2e:#e6e6e6;--n333333:#e2e2e2;--n39393d:#dedede;--n3a3a3c:#dedede;--n4a4a4e:#d5d5d5;--n545458:#cfcfcf;--n5c5c61:#cbcbcb;--n636366:#c7c7c7;--n6b6b70:#7c7c7c;--n8e8e93:#5f5f5f;--nc7c7cc:#2e2e2e;--nd1d1d6:#262626;--ne5e5ea:#151515;--nf2f2f2:#0b0b0b;--nffffff:#000000;--t48484c:#a5a5a5;--t4a4a4e:#a5a5a5;--t55555a:#a5a5a5;
}
/* con la barra de estado translúcida de iOS la hora va siempre en blanco: en claro se le pone una franja oscura detrás */
html.light body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--st);background:#000;z-index:500;pointer-events:none}
html.light .seg button[aria-pressed="true"],html.light .cstyles button[aria-pressed="true"]{background:#fff;color:#0b0b0c;box-shadow:0 1px 3px rgba(0,0,0,.16)}
html.light input[type="date"].inp::-webkit-calendar-picker-indicator,html.light input[type="time"].inp::-webkit-calendar-picker-indicator{filter:none}
html.light .stars{color:#e0a100}
html.light .starpick button[aria-pressed="true"]{color:#e0a100}
html.light .sheet{box-shadow:0 -8px 40px rgba(0,0,0,.12)}
html.light .dialog{box-shadow:0 12px 50px rgba(0,0,0,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none;font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:24px;height:24px;flex:none;display:block}
:focus-visible{outline:2px solid var(--nffffff);outline-offset:2px}

/* ---------- pantallas ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .46s var(--ease),opacity .46s var(--ease);will-change:transform}
.screen.off{transform:translateX(100%)}
.screen.under{transform:translateX(-24%);opacity:.3}
.scroll{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px var(--pr) 32px var(--pl)}

/* cabecera de inicio */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:calc(var(--st) + 22px) var(--pr) 6px var(--pl);flex:none}
.top h1{margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.022em;text-wrap:balance}
.top .sub{margin:5px 0 0;color:var(--muted);font-size:16px;letter-spacing:-.008em}
.round{width:44px;height:44px;border-radius:50%;background:var(--raised);display:grid;place-items:center;flex:none;transition:transform .2s var(--ease),background-color .2s}
.round:active{transform:scale(.88);background:var(--n333333)}
.round svg{width:24px;height:24px;stroke-width:2}
.pill{height:36px;padding:0 17px;border-radius:18px;background:var(--nffffff);color:var(--n000000);font-weight:600;font-size:16px;flex:none;transition:transform .2s var(--ease)}
.pill:active{transform:scale(.94)}

/* cuadrícula */
.grid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.cell{position:relative;min-width:0;display:flex}
.wig{position:relative;flex:1;display:flex;min-width:0}
.tile{position:relative;flex:1;min-width:0;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:17px 14px 16px;background:var(--card);border-radius:var(--r-card);color:var(--text);text-decoration:none;text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:transform .22s var(--ease),background-color .22s}
.tile .ic svg{width:30px;height:30px;stroke-width:1.8}
.tile .name{display:block;font-size:19px;line-height:1.2;font-weight:600;letter-spacing:-.016em;overflow-wrap:anywhere}
.tile .desc{display:block;margin-top:3px;font-size:15px;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.tile .ext{position:absolute;top:16px;right:14px;color:var(--faint)}
.tile .ext svg{width:18px;height:18px}
.tile.ph .name{color:var(--faint)}
.tile:active,.tile.pressing,.note:active,.note.pressing,.snip:active,.snip.pressing{transform:scale(.955);background:var(--card-hi)}
.lift{animation:lift .4s var(--ease)}
@keyframes lift{0%{transform:scale(.955)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
.cell.new .wig{animation:appear .55s var(--ease)}
@keyframes appear{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}

/* modo reorganizar */
.badge{position:absolute;top:-9px;left:-9px;width:28px;height:28px;border-radius:50%;background:var(--n3a3a3c);color:var(--nffffff);display:none;place-items:center;z-index:2;box-shadow:0 0 0 3px var(--bg)}
.badge svg{width:15px;height:15px;stroke-width:3}
.editing .badge{display:grid}
.editing .wig{animation:wig .32s ease-in-out infinite}
.editing .cell:nth-child(even) .wig{animation-delay:-.16s;animation-duration:.3s}
@keyframes wig{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.editing .tile,.editing .snip{cursor:grab}
.drag-src .wig{opacity:0;animation:none}
.drag-src::before{content:"";position:absolute;inset:0;border-radius:var(--r-card);border:1.5px dashed var(--n3a3a3c)}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;display:flex;filter:drop-shadow(0 18px 28px rgba(0,0,0,.75))}
.ghost .wig{animation:none}
.ghost .badge{display:none}
.ghost .tile,.ghost .snip{background:var(--card-hi)}

/* barra inferior */
.bottom{flex:none;padding:0 var(--pr) calc(var(--sb) + 10px) var(--pl)}
.bottom .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px;min-height:58px}
.bottom .lbl{color:var(--muted);font-size:15.5px;letter-spacing:-.008em}
.bottom .acts{display:flex;gap:4px;margin-right:-8px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;color:var(--nffffff);flex:none;transition:transform .2s var(--ease),background-color .2s}
.iconbtn:active{transform:scale(.88);background:var(--n1a1a1a)}
.iconbtn svg{width:26px;height:26px;stroke-width:1.8}

/* avisos */
.banner{display:flex;align-items:flex-start;gap:10px;margin:0 0 14px;padding:12px 14px;border-radius:16px;background:var(--n151515);color:var(--nd1d1d6);font-size:14.5px;line-height:1.4}
.banner .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--warn)}
.hint{margin:20px 4px 0;color:var(--faint);font-size:13.5px;line-height:1.4;text-align:center}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:56px 24px;color:var(--muted);font-size:15px;line-height:1.45}
.empty svg{width:40px;height:40px;color:var(--n3a3a3c);stroke-width:1.5;margin-bottom:6px}
.empty b{color:var(--nffffff);font-size:18px;font-weight:600}
.empty .pill{margin-top:12px}

/* pantalla de carpeta */
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px;padding:calc(var(--st) + 8px) var(--pr) 2px calc(var(--pl) - 12px);flex:none}
.back{display:flex;align-items:center;gap:1px;height:44px;min-width:0;max-width:62%;padding:0 10px 0 4px;font-size:17px;border-radius:12px;transition:opacity .2s}
.back:active{opacity:.5}
.back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back svg{width:28px;height:28px;stroke-width:2.2}
.navacts{display:flex;align-items:center;gap:2px;margin-right:-8px}
.navacts .pill{margin-left:6px;margin-right:8px}
.head{display:flex;align-items:center;gap:14px;padding:6px var(--pr) 14px var(--pl);flex:none}
.hic{width:52px;height:52px;border-radius:16px;background:var(--card);display:grid;place-items:center;flex:none}
.hic svg{width:28px;height:28px;stroke-width:1.8}
.ht{flex:1;min-width:0}
.ht h2{margin:0;font-size:28px;line-height:1.12;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance}
.ht p{margin:3px 0 0;color:var(--muted);font-size:15px}
.searchwrap{padding:0 var(--pr) 4px var(--pl);flex:none}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 12px;border-radius:12px;background:var(--n151515);color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 1.5px var(--n3a3a3c)}
.search svg{width:18px;height:18px}
.search input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;font-size:17px;color:var(--nffffff);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--n6b6b70)}
.clr{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}

/* notas y textos rápidos */
.note{flex:1;min-width:0;min-height:136px;display:flex;flex-direction:column;gap:6px;padding:15px 15px 13px;border-radius:20px;background:var(--card);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:transform .22s var(--ease),background-color .22s}
.note .t{font-size:16.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.note.untitled .t{color:var(--muted)}
.note .p{font-size:14.5px;line-height:1.38;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-line}
.note .d{margin-top:auto;padding-top:4px;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.snip{flex:1;min-width:0;min-height:70px;display:flex;align-items:center;padding:14px 15px;border-radius:18px;background:var(--card);font-size:16.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:transform .22s var(--ease),background-color .3s,color .3s}
.snip.copied{background:var(--nffffff);color:var(--n000000);transition:transform .22s var(--ease),background-color 0s,color 0s}
.ghost .snip,.ghost .note{transform:none}
.drag-src:has(.snip)::before{border-radius:18px}
.drag-src:has(.note)::before{border-radius:20px}

/* editor de nota */
#nScroll{padding-top:4px}
.ntitle{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;padding:0;margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em;overflow:hidden}
.ndate{margin:8px 0 16px;color:var(--faint);font-size:13.5px}
.nbody{display:block;width:100%;min-height:320px;border:0;outline:0;background:transparent;resize:none;padding:0 0 60px;margin:0;font-size:17.5px;line-height:1.5;overflow:hidden;color:var(--nf2f2f2)}
textarea::placeholder,input::placeholder{color:var(--t55555a)}

/* hojas */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);opacity:0;transition:opacity .36s var(--ease)}
.backdrop.show{opacity:1}
.backdrop:not(.show),.sheet:not(.show),.dialog:not(.show){pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;width:100%;max-width:600px;margin:0 auto;max-height:calc(100% - var(--st) - 16px);display:flex;flex-direction:column;background:var(--sheet);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .5s var(--ease);padding-bottom:var(--sb)}
.sheet.show{transform:none}
.sheet.page{height:calc(100% - var(--st) - 12px)}
.sheet.tall{max-height:min(86%, calc(100% - var(--st) - 16px))}
.grab{width:38px;height:5px;border-radius:3px;background:var(--n3a3a3c);margin:8px auto 2px;flex:none}
.sh-head{display:flex;align-items:center;gap:13px;padding:12px 22px 6px;flex:none}
.shic{width:44px;height:44px;border-radius:13px;background:var(--card);display:grid;place-items:center;flex:none}
.shic svg{width:24px;height:24px;stroke-width:1.8}
.sh-ht{min-width:0}
.sh-title{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.sh-sub{font-size:14px;color:var(--muted);margin-top:1px}
.acts-list{padding:8px 12px 10px;overflow-y:auto}
.act{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:9px 14px;border-radius:14px;text-align:left;font-size:17px;text-decoration:none;transition:background-color .15s}
.act:active{background:var(--n222222)}
.act svg{width:23px;height:23px;stroke-width:1.8}
.act .al{flex:1;min-width:0}
.act small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.act.danger{color:var(--danger)}
.act.cancel{justify-content:center;font-weight:600;margin-top:6px;background:var(--n1c1c1c)}
.sep{height:1px;background:var(--line);margin:4px 14px}

.fhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 8px 6px;flex:none}
.fhead .l{justify-self:start}
.fhead .r{justify-self:end}
.fhead .ft{font-size:17px;font-weight:600;text-align:center;padding:0 4px}
.tbtn{height:44px;padding:0 12px;font-size:17px;border-radius:12px;color:var(--nffffff)}
.tbtn.strong{font-weight:600}
.tbtn:disabled{color:var(--t4a4a4e)}
.tbtn:not(:disabled):active{opacity:.5}
.fbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 20px 28px;margin:0}
.preview{display:flex;justify-content:center;padding:6px 0 22px}
.preview .cell{width:calc(50% - 6px);max-width:210px;pointer-events:none}
.field{display:block;margin:0 0 16px}
.field > span{display:block;margin:0 4px 7px;color:var(--muted);font-size:13.5px;font-weight:500}
.inp{display:block;width:100%;height:50px;padding:0 15px;border-radius:14px;border:0;outline:0;background:var(--field);font-size:17px;color:var(--nffffff);-webkit-appearance:none;appearance:none}
.inp:focus{box-shadow:0 0 0 1.5px var(--n4a4a4e)}
textarea.inp{height:auto;min-height:190px;padding:14px 15px;line-height:1.45;resize:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--field)}
.seg button{height:42px;border-radius:11px;font-size:15.5px;font-weight:500;color:var(--muted);transition:background-color .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--n3a3a3c);color:var(--nffffff)}
.seg-note{margin:8px 4px 0;color:var(--faint);font-size:13px;line-height:1.4}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.icopt{aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:var(--field);color:var(--nffffff);transition:transform .15s var(--ease),background-color .15s,color .15s}
.icopt svg{width:24px;height:24px;stroke-width:1.8}
.icopt[aria-pressed="true"]{background:var(--nffffff);color:var(--n000000)}
.icopt:active{transform:scale(.88)}

.gl{margin:8px 6px 8px;color:var(--muted);font-size:13px;font-weight:500}
.group{background:var(--n1b1b1b);border-radius:16px;overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 16px;font-size:16.5px;text-align:left}
.row + .row{border-top:1px solid var(--n2a2a2a)}
.row .rv{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.row svg{width:21px;height:21px;stroke-width:1.9}
button.row:active{background:var(--n232323)}
.sdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--warn)}
.sdot.ok{background:var(--ok)}
.sdot.bad{background:var(--danger)}
.foot{color:var(--faint);font-size:13px;line-height:1.45;margin:2px 6px 18px}
.err{color:var(--danger);font-size:14px;margin:10px 4px 0}

/* diálogo */
.dlg-bd{z-index:110}
.dialog{position:fixed;left:50%;top:50%;z-index:111;width:min(300px,calc(100% - 48px));transform:translate(-50%,-50%) scale(1.08);opacity:0;transition:transform .32s var(--ease),opacity .22s;background:var(--n1f1f1f);border-radius:18px;overflow:hidden;text-align:center}
.dialog.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.dialog h3{margin:20px 18px 6px;font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.dialog p{margin:0 18px 18px;color:var(--nc7c7cc);font-size:14px;line-height:1.4}
.dialog .btns{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--n333333)}
.dialog .btns button{height:50px;font-size:17px}
.dialog .btns button + button{border-left:1px solid var(--n333333)}
.dialog .btns .danger{color:var(--danger);font-weight:600}
.dialog .btns .strong{font-weight:600}

/* aviso flotante */
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);z-index:200;display:flex;align-items:center;gap:8px;max-width:calc(100% - 40px);padding:11px 18px 11px 15px;border-radius:999px;background:var(--nf2f2f2);color:var(--n000000);font-size:15.5px;font-weight:600;line-height:1.3;transform:translate(-50%,14px) scale(.95);opacity:0;pointer-events:none;transition:transform .38s var(--ease),opacity .24s}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1}
.toast svg{width:18px;height:18px;stroke-width:2.6}

/* inicio: contador o total en la tarjeta */
.tile .meta{position:absolute;top:18px;right:14px;max-width:calc(100% - 66px);color:var(--muted);font-size:14px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .meta.cnt{top:16px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--n2c2c2e);color:var(--nffffff);font-size:13.5px;line-height:24px;text-align:center}

/* listas */
.addrow{display:flex;align-items:center;gap:12px;height:54px;margin:2px 0 12px;padding:0 5px 0 15px;border-radius:18px;background:var(--n151515);color:var(--muted)}
.addrow:focus-within{box-shadow:0 0 0 1.5px var(--n3a3a3c)}
.addrow .pc{width:26px;height:26px;border-radius:50%;border:2px dashed var(--n4a4a4e);display:grid;place-items:center;flex:none}
.addrow .pc svg{width:14px;height:14px;stroke-width:3}
.addrow input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;font-size:17px;color:var(--nffffff);-webkit-appearance:none;appearance:none}
.addrow .go{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--nffffff);flex:none}
.addrow .go svg{width:23px;height:23px;stroke-width:2.4}
.grid.list{display:flex;flex-direction:column;gap:0}
.list > .cell{display:grid;grid-template-rows:1fr;padding-bottom:8px;transition:grid-template-rows .34s var(--ease),padding-bottom .34s var(--ease)}
.list > .cell > .wig{min-height:0}
.list > .cell.gone{grid-template-rows:0fr;padding-bottom:0}
.list > .cell.gone > .wig{overflow:hidden}
.list > .cell.fume .wig{animation:fume .58s var(--ease) forwards}
@keyframes fume{to{opacity:0;filter:blur(7px);transform:translateY(-8px) scale(.97)}}
.list > .cell.new .wig{animation:appearL .38s var(--ease)}
@keyframes appearL{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.list .drag-src::before{bottom:8px;border-radius:18px}
.editing .list .wig{animation-name:wigs}
@keyframes wigs{0%,100%{transform:rotate(-.3deg)}50%{transform:rotate(.3deg)}}
.todo{flex:1;min-width:0;display:flex;align-items:center;gap:13px;min-height:56px;padding:13px 15px;border-radius:18px;background:var(--card);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .22s var(--ease),background-color .22s}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--n5c5c61);flex:none;display:grid;place-items:center;color:var(--n000000);transition:background-color .25s var(--ease),border-color .25s,transform .25s var(--ease)}
.chk svg{width:15px;height:15px;stroke-width:3.2;opacity:0;transform:scale(.3);transition:opacity .2s,transform .3s var(--ease)}
.todo.done .chk{background:var(--nffffff);border-color:var(--nffffff)}
.todo.done .chk svg{opacity:1;transform:none}
.tt{flex:1;min-width:0;font-size:16.5px;line-height:1.35;letter-spacing:-.01em;overflow-wrap:anywhere}
.tt span{background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 56%;background-size:0% 1.6px;-webkit-box-decoration-break:slice;box-decoration-break:slice;transition:background-size .42s var(--ease),color .3s}
.todo.done .tt span{background-size:100% 1.6px;color:var(--muted)}
.todo:active,.todo.pressing,.mv:active,.mv.pressing{transform:scale(.975);background:var(--card-hi)}
.ghost .todo{background:var(--card-hi)}
.inp.short{min-height:110px}

/* aviso con botón */
.toast{width:max-content}
.toast .tact{margin:-4px -8px -4px 4px;padding:6px 8px 6px 12px;border-left:1px solid var(--nc7c7cc);color:var(--n000000);font-size:15.5px;font-weight:700}

/* finanzas */
.money{padding-top:2px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0 -8px 10px}
.mnav .ml{flex:1;min-width:0;padding:3px 0;border-radius:12px;font-size:17px;font-weight:600;letter-spacing:-.01em;text-align:center}
.mnav .ml small{display:block;margin-top:1px;color:var(--muted);font-size:13px;font-weight:400}
.mnav .ml:active{opacity:.6}
.mnav .iconbtn:disabled{color:var(--n3a3a3c);background:none;transform:none}
.mcard{background:var(--card);border-radius:var(--r-card);padding:18px 18px 16px;margin-bottom:6px}
.mk{color:var(--muted);font-size:14.5px;font-weight:500}
.mbig{margin-top:4px;font-size:46px;line-height:1.05;font-weight:700;letter-spacing:-.035em;overflow-wrap:anywhere}
.mbig .c{font-size:27px;letter-spacing:-.015em}
.mcmp{display:flex;align-items:flex-start;gap:7px;margin-top:9px;color:var(--muted);font-size:14.5px;line-height:1.35}
.mcmp svg{width:18px;height:18px;stroke-width:2.2;margin-top:1px}
.mcmp.up svg{color:var(--danger)}
.mcmp.down svg{color:var(--ok)}
.meter{display:block;width:100%;margin-top:16px;text-align:left;font-size:14px;color:var(--muted)}
.mbar{display:flex;gap:2px;height:8px;border-radius:4px;background:var(--n2c2c2e);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:4px;flex:none}
.meter.ok .mbar i,.meter.ok .mst svg{background:none;color:var(--ok)}
.meter.warn .mst svg{color:var(--warn)}
.meter.bad .mst svg{color:var(--danger)}
.meter.ok .mbar i{background:var(--ok)}
.meter.warn .mbar i{background:var(--warn)}
.meter.bad .mbar i{background:var(--danger)}
.mbar i.u{opacity:.4}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;line-height:1.35}
.mrow b{color:var(--nffffff);font-weight:600}
.mrow.sm{display:block;margin-top:5px;font-size:13.5px}
.mst{display:flex;align-items:center;gap:5px;text-align:right}
.mst svg{width:16px;height:16px;stroke-width:2.3}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ms span{display:block;color:var(--muted);font-size:12.5px}
.ms b{display:block;margin-top:3px;font-size:16px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.ms b.pos{color:var(--ok)}
.ms b.neg{color:var(--danger)}
.mlink{display:flex;align-items:center;gap:11px;width:100%;margin-top:8px;padding:13px 14px;border-radius:16px;background:var(--card);font-size:15.5px;color:var(--nffffff);text-align:left}
.mlink span{flex:1;min-width:0}
.mlink svg{width:20px;height:20px;stroke-width:1.9}
.mlink svg:last-child{width:18px;height:18px;color:var(--faint)}
.mcard .mlink{margin-top:16px;background:var(--n232323)}
.mlink:active{opacity:.7}
.msec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 4px 10px}
.msec h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.msec span{color:var(--muted);font-size:14px}
.mbox{background:var(--card);border-radius:20px;padding:4px 0}
.crow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:7px;padding:11px 16px}
.crow + .crow{border-top:1px solid var(--n232323)}
.cic{width:34px;height:34px;border-radius:11px;background:var(--n262626);display:grid;place-items:center;flex:none}
.cic svg{width:18px;height:18px;stroke-width:1.9}
.crow .cic{grid-row:span 2}
.cn{font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.cb{grid-column:2 / 4;display:flex;align-items:center;gap:10px}
.ctrack{flex:1;height:6px;border-radius:3px;background:var(--n2a2a2a);overflow:hidden}
.ctrack i{display:block;height:100%;border-radius:3px;background:var(--nffffff)}
.cp{width:38px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.dg{display:flex;justify-content:space-between;gap:10px;margin:16px 6px 7px;color:var(--muted);font-size:13.5px;font-weight:500}
.msec + .dg{margin-top:4px}
.mvs{display:flex;flex-direction:column;gap:8px}
.mv{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:62px;padding:11px 15px 11px 13px;border-radius:18px;background:var(--card);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .22s var(--ease),background-color .22s}
.mv.soon{opacity:.6}
.mvt{flex:1;min-width:0}
.mvt b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvt small{display:flex;align-items:center;gap:4px;margin-top:2px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden}
.mvt small svg{width:13px;height:13px;stroke-width:2.2;flex:none}
.mva{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mva.inc{color:var(--ok)}
.chart{background:var(--card);border-radius:20px;padding:14px 14px 12px}
.chart .seg{margin-bottom:12px;background:var(--n232323)}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chart svg text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--n2c2c2e);stroke-width:1}
.chart .bud{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.chart .bon{fill:var(--nffffff)}
.chart .boff{fill:var(--n545458)}
.chart .uon{fill:rgba(var(--wrgb),.36)}
.chart .uoff{fill:rgba(84,84,88,.5)}
.chart text.on{fill:var(--nffffff);font-weight:600}
.chart text.vl{fill:var(--nffffff);font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.chart .hit,.chart .ov{fill:transparent;cursor:pointer}
.chart .lc{fill:none;stroke:var(--nffffff);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .lp{fill:none;stroke:var(--n636366);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .la{fill:rgba(var(--wrgb),.08)}
.chart .dot{fill:var(--nffffff);stroke:var(--card);stroke-width:2}
.chart .dotp{fill:var(--n8e8e93);stroke:var(--card);stroke-width:2}
.chart .xhl{stroke:var(--n8e8e93);stroke-width:1}
.cread{min-height:21px;margin:0 2px 8px;color:var(--muted);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.cread b{color:var(--nffffff);font-weight:600}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:10px 2px 0;color:var(--muted);font-size:12.5px}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{color:var(--nffffff);font-weight:600}
.legend i{display:block;width:14px;height:2px;border-radius:1px}
.legend i.kc{background:var(--nffffff)}
.legend i.kp{background:var(--n636366)}
.legend i.kb{height:0;border-top:2px dashed var(--warn);border-radius:0}
.legend i.ku{width:10px;height:10px;border-radius:3px;background:rgba(var(--wrgb),.36)}
.amt{display:flex;align-items:baseline;justify-content:center;gap:5px;padding:18px 0 20px;cursor:text}
.amt input{width:2.7ch;max-width:calc(100% - 50px);padding:0;border:0;outline:0;background:transparent;text-align:center;font-size:56px;font-weight:700;letter-spacing:-.03em;color:var(--nffffff);-webkit-appearance:none;appearance:none}
.amt input::placeholder{color:var(--n3a3a3c)}
.amt span{font-size:34px;font-weight:600;color:var(--muted)}
.lead{margin:12px 8px 0;text-align:center;font-size:17px;font-weight:600;line-height:1.35}
.foot.center{text-align:center;margin-left:14px;margin-right:14px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:68px;padding:8px 2px;border-radius:14px;background:var(--field);color:var(--nd1d1d6);font-size:12px;font-weight:500;line-height:1.15;text-align:center;transition:background-color .15s,color .15s,transform .15s var(--ease)}
.cat svg{width:22px;height:22px;stroke-width:1.8}
.cat[aria-pressed="true"]{background:var(--nffffff);color:var(--n000000)}
.cat:active{transform:scale(.92)}
.sug{display:flex;gap:8px;overflow-x:auto;margin:-6px -20px 16px;padding:0 20px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sug::-webkit-scrollbar{display:none}
.sug button{flex:none;height:34px;padding:0 13px;border-radius:17px;background:var(--field);color:var(--nd1d1d6);font-size:14.5px;white-space:nowrap}
.sug button:active{background:var(--n2c2c2e)}
.swrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin:0 0 4px;padding:10px 16px;border-radius:14px;background:var(--field);font-size:16.5px;text-align:left}
.swrow .al{flex:1;min-width:0}
.swrow small{display:block;margin-top:2px;color:var(--muted);font-size:13px}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--n39393d);flex:none;transition:background-color .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.swrow[aria-pressed="true"] .sw{background:var(--ok)}

#mfRepNote{margin-top:8px}
.dbtn{display:block;width:100%;height:50px;margin-top:14px;border-radius:14px;background:var(--n1c1c1c);color:var(--danger);font-size:17px;font-weight:500}
.dbtn:active{background:var(--n262626)}
.seg button:disabled{opacity:.35}
input[type="date"].inp{display:flex;align-items:center;text-align:left;line-height:50px}
input[type="date"].inp::-webkit-date-and-time-value{text-align:left}
input[type="date"].inp::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6}

/* entrada con contraseña */
.login{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 24px)}
.lg{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:stretch}
.lgic{width:64px;height:64px;border-radius:20px;background:var(--card);display:grid;place-items:center;margin:0 auto 18px}

.lgsub{margin:8px 4px 26px;text-align:center;color:var(--muted);font-size:15.5px;line-height:1.45}
.lgbtn{height:50px;border-radius:14px;font-size:17px;margin-top:4px;width:100%}
.lgbtn:disabled{opacity:.6}
.lglater{margin:14px auto 0;color:var(--muted)}
.lg .err{text-align:center}
.steps{margin:4px 0 14px;padding-left:22px;color:var(--ne5e5ea);font-size:16px;line-height:1.5}
.steps li{margin-bottom:10px}
.steps b{color:var(--nffffff)}

/* ---------- colores pastel ---------- */
.tile.tint,.hic.tint,.shic.tint{background:linear-gradient(150deg,var(--c1) 0%,var(--c2) 62%,rgba(0,0,0,0) 100%),var(--n141414);box-shadow:inset 0 0 0 1px var(--cb)}
.tile.tint .ic,.hic.tint,.shic.tint{color:var(--c)}
.tile.tint:active,.tile.tint.pressing{background:linear-gradient(150deg,var(--c1) 0%,var(--c2) 62%,rgba(0,0,0,0) 100%),var(--n202020)}
.ghost .tile.tint{background:linear-gradient(150deg,var(--c1) 0%,var(--c2) 62%,rgba(0,0,0,0) 100%),var(--n202020)}
.tile.tint .meta.cnt{background:var(--c1);color:var(--c)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw-c{position:relative;width:38px;height:38px;border-radius:50%;background:var(--c,#2c2c2e);display:grid;place-items:center;color:#000;transition:transform .15s var(--ease)}
.sw-c.none{background:var(--n1e1e1e);box-shadow:inset 0 0 0 1.5px var(--n3a3a3c);color:var(--n8e8e93)}
.sw-c.none svg{width:18px;height:18px}
.sw-c[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--sheet),0 0 0 4.5px var(--nffffff)}
.sw-c:not(.none) svg{width:17px;height:17px;stroke-width:3;opacity:0}
.sw-c[aria-pressed="true"]:not(.none) svg{opacity:1}
.sw-c:active{transform:scale(.88)}

/* ---------- carpetas que agrupan ---------- */
.gmini{display:grid;grid-template-columns:repeat(2,22px);grid-template-rows:repeat(2,22px);gap:5px;width:49px;height:49px;margin:-10px 0 -9px -1px}
.gm{display:grid;place-items:center;border-radius:7px;background:var(--n2a2a2a);color:var(--nffffff)}
.tile .gmini .gm svg{width:13px;height:13px;stroke-width:2.1}
.gm.e{background:rgba(var(--wrgb),.04);box-shadow:inset 0 0 0 1px rgba(var(--wrgb),.06)}
.gm.tint{background:var(--c1s);color:var(--c)}
.tile.tint .gm:not(.tint):not(.e){background:rgba(var(--wrgb),.09)}
.tile.drop-on{transform:scale(1.07);box-shadow:0 0 0 2px rgba(var(--wrgb),.75);transition:transform .25s var(--ease),box-shadow .2s}
/* Rendimiento: cerrada, la capa no existe (display:none), así el difuminado no se calcula detrás del inicio.
   Al abrir: un fotograma para crear la capa y después se animan solo opacity y transform (los baratos).
   El difuminado no se anima ni lo hereda un padre con opacidad (en Safari eso lo recalcula en cada fotograma). */
.grp{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--st) + 20px) 18px calc(var(--sb) + 28px);pointer-events:none}
.grp.on{display:flex}
.grp.show{pointer-events:auto}
.grp-bd{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);opacity:0;transition:opacity .28s ease-out;will-change:opacity;transform:translateZ(0)}
.grp.show .grp-bd{opacity:1}
.grp-in{position:relative;width:100%;max-width:440px;max-height:100%;display:flex;flex-direction:column;opacity:0;transform:scale(.92);transition:transform .38s var(--ease),opacity .2s ease-out;will-change:transform,opacity}
.grp.show .grp-in{opacity:1;transform:none}
.grp-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 6px 16px}
.grp-name{flex:1;min-width:0;margin:0;font-size:30px;font-weight:700;letter-spacing:-.022em;line-height:1.15;overflow-wrap:anywhere;text-align:left;color:var(--nffffff)}
.grp-name.tint{color:var(--c)}
.grp-panel{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px;border-radius:32px;background:var(--panel);box-shadow:inset 0 0 0 1px rgba(var(--wrgb),.07)}
.grp-panel.tint{box-shadow:inset 0 0 0 1px var(--cb)}
.grp-panel .tile{min-height:112px;background:var(--n1c1c1e)}
.grp .hint{margin-top:14px}
.grp-empty{grid-column:1/-1;padding:34px 16px;text-align:center;color:var(--muted);font-size:15px;line-height:1.45}
.pick{display:flex;align-items:center;gap:13px;width:100%;min-height:58px;padding:9px 14px;border-radius:14px;text-align:left;font-size:16.5px;transition:background-color .15s}
.pick + .pick{margin-top:2px}
.pick:active{background:var(--n1d1d1d)}
.pick .pic{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;flex:none}
.pick .pic svg{width:20px;height:20px;stroke-width:1.9}
.pick .pic.tint{background:var(--c1s);color:var(--c)}
.pick .al{flex:1;min-width:0}
.pick small{display:block;margin-top:1px;color:var(--muted);font-size:13px}
.pick .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--n4a4a4e);display:grid;place-items:center;flex:none;color:var(--n000000)}
.pick .ck svg{width:14px;height:14px;stroke-width:3.2;opacity:0}
.pick[aria-pressed="true"] .ck{background:var(--nffffff);border-color:var(--nffffff)}
.pick[aria-pressed="true"] .ck svg{opacity:1}

/* ---------- widget de calendario ---------- */
.cell.wide{grid-column:1/-1}
.tile.calw{flex-direction:row;align-items:stretch;gap:16px;min-height:132px;padding:16px 16px 15px 18px}
.cw-l{display:flex;flex-direction:column;justify-content:space-between;flex:none;width:76px}
.cw-wd{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#ff6961}
.tile.tint .cw-wd{color:var(--c)}
.cw-d{font-size:46px;line-height:1;font-weight:300;letter-spacing:-.04em;margin-top:2px}
.cw-m{font-size:14px;color:var(--muted);margin-top:auto}
.cw-r{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;padding-left:16px;border-left:1px solid rgba(var(--wrgb),.08);justify-content:center}
.cw-ev{display:grid;grid-template-columns:3px minmax(0,1fr);column-gap:10px;align-items:center}
.cw-ev i{grid-row:span 2;align-self:stretch;width:3px;border-radius:2px;background:var(--ec,var(--n8e8e93))}
.cw-ev b{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-ev small{font-size:13px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.cw-ev.now b{color:var(--nffffff)}
.cw-ev.now small{color:var(--nd1d1d6)}
.cw-more{font-size:13px;color:var(--muted)}
.cw-none{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.cw-sub{font-size:13.5px;color:var(--muted);line-height:1.35}
.ag-day{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 6px 8px;font-size:14px;font-weight:600;color:var(--nffffff)}
.ag-day:first-child{margin-top:4px}
.ag-day span{color:var(--muted);font-weight:500;font-size:13px}
.ag-ev{display:grid;grid-template-columns:4px minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--n1b1b1b)}
.ag-ev + .ag-ev{margin-top:6px}
.ag-ev i{grid-row:span 2;align-self:stretch;border-radius:2px;background:var(--ec,var(--n8e8e93))}
.ag-ev b{font-size:16px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.ag-ev small{grid-column:2;color:var(--muted);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.ag-ev .h{grid-row:1;grid-column:3;color:var(--nd1d1d6);font-size:14px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ag-ev.past{opacity:.45}
.ag-free{padding:12px 14px;border-radius:16px;background:var(--n151515);color:var(--faint);font-size:14.5px}

/* ---------- universidad ---------- */
.uni{padding-top:2px}
.u-sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 4px 10px}
.u-sec:first-child{margin-top:4px}
.u-sec h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.u-sec span,.u-sec button{color:var(--muted);font-size:14px}
.u-sec button{display:flex;align-items:center;gap:4px;height:32px;padding:0 4px;border-radius:10px}
.u-sec button svg{width:17px;height:17px;stroke-width:2.2}
.u-sec button:active{opacity:.5}
.xhero{position:relative;display:block;width:100%;text-align:left;padding:18px 18px 17px;border-radius:var(--r-card);background:var(--card);overflow:hidden}
.xhero.tint{background:linear-gradient(150deg,var(--c1) 0%,var(--c2) 62%,rgba(0,0,0,0) 100%),var(--n141414);box-shadow:inset 0 0 0 1px var(--cb)}
.xh-k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.xhero.tint .xh-k{color:var(--c)}
.xh-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:8px}
.xh-t{min-width:0}
.xh-t b{display:block;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.xh-t small{display:block;margin-top:5px;color:var(--nc7c7cc);font-size:14.5px;line-height:1.35}
.xh-n{flex:none;text-align:right}
.xh-n b{display:block;font-size:44px;line-height:1;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.xh-n small{display:block;margin-top:3px;color:var(--muted);font-size:13px}
.xlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.xrow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;column-gap:13px;padding:11px 15px 11px 11px;border-radius:18px;background:var(--card);text-align:left;width:100%}
.xd{display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:46px;border-radius:13px;background:var(--n242424);line-height:1}
.xd b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.xd small{margin-top:3px;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.xrow .xt b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xrow .xt small{display:block;margin-top:2px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xrow .xc{color:var(--nd1d1d6);font-size:13.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.xrow:active,.xhero:active{opacity:.75}
.u-msg{padding:16px 16px;border-radius:18px;background:var(--n151515);color:var(--muted);font-size:14.5px;line-height:1.45}
.u-msg b{color:var(--nffffff)}
.u-msg .pill{margin-top:12px;height:34px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .cell{display:flex}
.ulink{display:flex;align-items:center;gap:8px;height:42px;padding:0 15px 0 12px;border-radius:21px;background:var(--card);font-size:15px;font-weight:500;text-decoration:none;color:var(--nffffff);max-width:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s var(--ease),background-color .2s}
.ulink span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ulink svg{width:17px;height:17px;stroke-width:2;flex:none;color:var(--muted)}
.ulink.add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--n2c2c2e);color:var(--muted)}
.ulink:active,.ulink.pressing,.prof:active,.prof.pressing{transform:scale(.96);background:var(--card-hi)}
.profs{display:flex;flex-direction:column;gap:8px}
.profs .cell{display:flex}
.prof{flex:1;min-width:0;display:flex;align-items:center;gap:13px;min-height:64px;padding:11px 15px 11px 12px;border-radius:18px;background:var(--card);text-align:left;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .22s var(--ease),background-color .22s}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--n2a2a2a);font-size:15px;font-weight:700;letter-spacing:.02em;color:var(--nffffff)}
.av.tint{background:var(--c1s);color:var(--c)}
.prof .pt{flex:1;min-width:0}
.prof .pt b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .pt small{display:block;margin-top:2px;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof > svg{width:18px;height:18px;color:var(--faint)}
.u-add{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 15px;border-radius:18px;box-shadow:inset 0 0 0 1.5px var(--n232323);color:var(--muted);font-size:15.5px}
.u-add svg{width:19px;height:19px;stroke-width:2.2}
.u-add:active{background:var(--n111111)}
.info{background:var(--n1b1b1b);border-radius:16px;overflow:hidden;margin-bottom:12px}
.info .row{align-items:flex-start}
.info .row small{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.info .row .iv{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-line;line-height:1.4}
.info .row > svg{margin-top:12px;color:var(--muted)}
.btnrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-bottom:12px}
.btnrow a,.btnrow button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:66px;border-radius:16px;background:var(--n1f1f1f);font-size:13.5px;font-weight:500;color:var(--nffffff);text-decoration:none}
.btnrow svg{width:21px;height:21px;stroke-width:1.9}
.btnrow a:active,.btnrow button:active{background:var(--n2a2a2a)}
.u-notes-h{margin-top:26px}

/* ---------- horario ---------- */
.sc-wk{display:flex;align-items:center;gap:0}
.sc-wk button{display:grid;place-items:center;height:32px;min-width:30px;padding:0 4px;border-radius:10px;color:var(--nffffff);font-size:14.5px;font-weight:500}
.sc-wk button svg{width:19px;height:19px;stroke-width:2.2}
.sc-wk button:disabled{color:var(--n3a3a3c)}
.sc-wk .sc-wl{padding:0 6px;font-variant-numeric:tabular-nums}
.sc-sub{margin:-6px 4px 10px;color:var(--muted);font-size:13.5px}
.sched{background:var(--card);border-radius:20px;padding:12px 10px 10px 4px}
.sc-row{display:grid;grid-template-columns:26px repeat(5,minmax(0,1fr));column-gap:4px}
.sc-dh{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.sc-dh b{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;font-size:15px;color:var(--nffffff);font-weight:600;font-variant-numeric:tabular-nums}
.sc-dh.today{color:var(--nffffff)}
.sc-dh.today b{background:var(--nffffff);color:var(--n000000)}
.sc-head{margin-bottom:8px}
.sc-all{margin-bottom:6px}
.sc-all > span{display:flex;flex-direction:column;gap:3px;min-width:0}
.sc-all small{font-size:10.5px;color:var(--muted);text-align:center}
.sc-ad{display:block;width:100%;padding:3px 5px;border-radius:6px;font-size:10.5px;font-weight:600;line-height:1.25;color:var(--nffffff);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 2px 0 0 var(--ec)}
.sc-body{position:relative;border-top:1px solid var(--n262626)}
.sc-gut{position:relative}
.sc-gut i{position:absolute;right:0;transform:translateY(-50%);font-style:normal;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.sc-gut i:first-child{transform:none;margin-top:2px}
.sc-line{position:absolute;left:30px;right:0;height:1px;background:var(--n242424)}
.sc-col{position:relative;min-width:0}
.sc-col.today{background:rgba(var(--wrgb),.03);border-radius:0 0 8px 8px}
.sc-b{position:absolute;display:flex;flex-direction:column;gap:1px;padding:4px 4px 3px 6px;border-radius:7px;overflow:hidden;text-align:left;color:var(--nffffff);transition:transform .15s var(--ease)}
.sc-b:active{transform:scale(.95)}
.sc-b.cl{background:var(--c1s);box-shadow:inset 3px 0 0 var(--c)}
.sc-b b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;font-weight:600;line-height:1.2;letter-spacing:-.01em;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.sc-b.nar{padding:4px 2px 3px 5px}
.sc-b.nar b{display:block;white-space:nowrap;text-overflow:ellipsis;font-size:10.5px}
.sc-b small{font-size:10px;color:rgba(var(--wrgb),.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-b.past{opacity:.62}
.sc-now{position:absolute;left:-3px;right:0;height:2px;background:#ff453a;border-radius:1px;z-index:2;pointer-events:none}
.sc-now::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#ff453a}
.sc-leg{display:flex;gap:16px;margin:10px 0 0 30px;color:var(--muted);font-size:12px}
.sc-leg span{display:flex;align-items:center;gap:6px}
.sc-leg i{width:12px;height:12px;border-radius:4px}
.sc-leg .k-cl{background:rgba(183,168,247,.3);box-shadow:inset 3px 0 0 #B7A8F7}
.sc-leg .k-ev{box-shadow:inset 0 0 0 1px var(--n8e8e93)}
.seg.days{grid-template-columns:repeat(5,1fr)}
.field.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field.two > label > span{display:block;margin:0 4px 7px;color:var(--muted);font-size:13.5px;font-weight:500}
input[type="time"].inp{display:flex;align-items:center;line-height:50px}
input[type="time"].inp::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6}

/* ---------- hábitos ---------- */
.habit{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;padding:14px 14px 13px;border-radius:20px;background:linear-gradient(150deg,var(--c1) 0%,var(--c2) 62%,rgba(0,0,0,0) 100%),var(--n141414);box-shadow:inset 0 0 0 1px var(--cb);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .22s var(--ease)}
.habit:active,.habit.pressing{transform:scale(.98)}
.hb-top{display:flex;align-items:center;gap:13px}
.hb-ck{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 2.5px var(--c);color:var(--n000000);transition:background-color .25s var(--ease),transform .25s var(--ease)}
.hb-ck svg{width:21px;height:21px;stroke-width:3.2;opacity:0;transform:scale(.3);transition:opacity .2s,transform .35s var(--ease)}
.habit.done .hb-ck{background:var(--c)}
.habit.done .hb-ck svg{opacity:1;transform:none}
.habit.pop .hb-ck{animation:hbpop .45s var(--ease)}
@keyframes hbpop{0%{transform:scale(.8)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.hb-t{flex:1;min-width:0}
.hb-t b{display:block;font-size:17px;font-weight:600;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-t small{display:flex;align-items:center;gap:4px;margin-top:2px;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden}
.hb-t small svg{width:14px;height:14px;stroke-width:2.2;color:var(--c);flex:none}
.hb-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hb-d{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0;border-radius:10px}
.hb-d small{font-size:11px;font-weight:600;color:var(--faint)}
.hb-d.today small{color:var(--nffffff)}
.hb-d i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--wrgb),.06);color:var(--n000000)}
.hb-d i svg{width:14px;height:14px;stroke-width:3.2;opacity:0}
.hb-d.on i{background:var(--c)}
.hb-d.on i svg{opacity:1}
.hb-d.today:not(.on) i{box-shadow:inset 0 0 0 1.5px var(--c)}
.hb-d:disabled{opacity:.35}
.hb-d:not(:disabled):active i{transform:scale(.85)}
.ghost .habit{transform:none}
.list .drag-src:has(.habit)::before{border-radius:20px}
.stepper{display:flex;align-items:center;justify-content:space-between;height:50px;padding:4px;border-radius:14px;background:var(--field)}
.stepper button{width:56px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--n2c2c2e)}
.stepper button svg{width:20px;height:20px;stroke-width:2.4}
.stepper b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.hs-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:18px}
.hs-stats div{padding:12px 6px;border-radius:14px;background:var(--n1b1b1b);text-align:center}
.hs-stats b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--c,var(--nffffff))}
.hs-stats small{display:block;margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.25}
.hm-wrap{display:grid;grid-template-columns:minmax(0,1fr) 14px;grid-template-rows:auto auto;column-gap:6px;row-gap:4px}
.hm-months{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));font-size:10.5px;color:var(--muted);white-space:nowrap}
.hm-grid{grid-row:2;display:grid;grid-template-columns:repeat(18,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:3px}
.hm{aspect-ratio:1;border-radius:4px;background:rgba(var(--wrgb),.07)}
.hm.on{background:var(--c)}
.hm.today{box-shadow:0 0 0 1.5px var(--nffffff)}
.hm:disabled{opacity:.25}
.hm-days{grid-row:2;grid-column:2;display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:9.5px;color:var(--faint);align-items:center}

/* ---------- atajos de Siri ---------- */
details.siri{background:var(--n1b1b1b);border-radius:16px;margin-bottom:8px;overflow:hidden}
details.siri summary{display:flex;align-items:center;gap:12px;padding:12px 14px;list-style:none;cursor:pointer;font-size:16px;font-weight:600}
details.siri summary::-webkit-details-marker{display:none}
details.siri summary .shic{width:38px;height:38px;border-radius:11px}
details.siri summary .shic svg{width:20px;height:20px}
details.siri summary .al{flex:1;min-width:0}
details.siri summary small{display:block;margin-top:2px;color:var(--muted);font-size:13px;font-weight:400;line-height:1.35}
details.siri summary > svg{width:18px;height:18px;color:var(--faint);transition:transform .2s}
details.siri[open] summary > svg{transform:rotate(90deg)}
details.siri .steps{margin:2px 0 6px;padding:0 16px 4px 34px;font-size:15px;line-height:1.5}
details.siri .foot{margin:0 16px 14px}
.kv{display:flex;flex-direction:column;gap:4px;margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--n111111)}
.kv span{display:flex;gap:10px;align-items:baseline;font-size:14px}
.kv code{min-width:74px;color:var(--nffffff);font-weight:600}
.kv i{font-style:normal;color:var(--nc7c7cc)}
details.siri code,.foot code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}

/* ---------- vista de rayas (Fusión) ---------- */
.topacts{display:flex;gap:10px;flex:none}
.ghostbtn{background:transparent;box-shadow:inset 0 0 0 1.5px var(--n2c2c2e)}
.grid.rows{grid-template-columns:minmax(0,1fr);gap:8px}
.rows .tile{flex-direction:row;align-items:center;gap:15px;min-height:62px;padding:12px 16px;border-radius:20px;background:var(--n111111)}
.rows .tile .ic svg{width:23px;height:23px}
.rows .tile .txt{flex:1;min-width:0}
.rows .tile .name{font-size:21px;font-weight:500;letter-spacing:-.022em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .tile .desc{display:none}
.rows .tile .meta{position:static;max-width:45%;margin-left:auto;font-size:14px;font-weight:500}
.rows .tile .meta.cnt{min-width:26px}
.rows .tile .ext{position:static;color:var(--faint)}
.rows .tile.tint{background:var(--n111111);box-shadow:none}
.rows .tile.tint:active,.rows .tile.tint.pressing{background:var(--n1b1b1b)}
.rows .tile .gmini{transform:scale(.62);margin:-10px -12px -10px -9px;transform-origin:center}
.rows .tile.calw{background:var(--n161616);min-height:118px;align-items:stretch;padding:16px 16px 15px 18px;gap:16px}
.rows .tile.calw.tint{background:linear-gradient(150deg,var(--c1) 0%,var(--c2) 62%,rgba(0,0,0,0) 100%),var(--n141414)}
.grp-panel .grid.rows .tile{background:var(--n1c1c1e)}
.grid.swap{animation:swapin .32s var(--ease)}
@keyframes swapin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- estilo de color (Configuración; cada dispositivo) ---------- */
/* Sólido: la tarjeta entera del color pastel, texto oscuro (el widget de calendario va en oscuro) */
.cs-solido :is(.grid,.ghost) .tile.tint:not(.calw){background:var(--cp);box-shadow:none;color:#141414}
.cs-solido :is(.grid,.ghost) .tile.tint:not(.calw):active,.cs-solido :is(.grid,.ghost) .tile.tint:not(.calw).pressing{background:var(--cp);filter:brightness(.86)}
.cs-solido :is(.grid,.ghost) .tile.tint:not(.calw) :is(.ic,.name){color:#141414}
.cs-solido :is(.grid,.ghost) .tile.tint:not(.calw) :is(.desc,.meta,.ext){color:rgba(0,0,0,.58)}
.cs-solido :is(.grid,.ghost) .tile.tint:not(.calw) .meta.cnt{background:rgba(0,0,0,.14);color:#141414}
.cs-solido :is(.grid,.ghost) .tile.tint:not(.calw) .gm{background:rgba(0,0,0,.13);color:#141414}
.cs-solido :is(.grid,.ghost) .tile.tint:not(.calw) .gm.e{background:rgba(0,0,0,.06);box-shadow:none}
/* Oscuro: versión muy oscura del color, sólida */
.cs-oscuro :is(.grid,.ghost) .tile.tint,.cs-solido :is(.grid,.ghost) .tile.tint.calw{background:var(--cd);box-shadow:none}
.cs-oscuro :is(.grid,.ghost) .tile.tint:active,.cs-oscuro :is(.grid,.ghost) .tile.tint.pressing,.cs-solido :is(.grid,.ghost) .tile.calw.tint:active,.cs-solido :is(.grid,.ghost) .tile.calw.tint.pressing{background:var(--cdh)}
/* Resplandor: luz de color que entra por el lado derecho */
.cs-brillo :is(.grid,.ghost) .tile.tint{background:radial-gradient(circle at 100% 0%,var(--cg),rgba(0,0,0,0) 62%),var(--n121212);box-shadow:none}
.cs-brillo :is(.grid,.ghost) .tile.tint:active,.cs-brillo :is(.grid,.ghost) .tile.tint.pressing{background:radial-gradient(circle at 100% 0%,var(--cg),rgba(0,0,0,0) 62%),var(--n1e1e1e)}
.cs-brillo .grid.rows .tile.tint{background:radial-gradient(ellipse 60% 140% at 100% 50%,var(--cg),rgba(0,0,0,0) 70%),var(--n101010)}
/* Símbolo: tarjeta gris y el color solo en el icono */
.cs-icono :is(.grid,.ghost) .tile.tint{background:var(--n161616);box-shadow:none}
.cs-icono :is(.grid,.ghost) .tile.tint:active,.cs-icono :is(.grid,.ghost) .tile.tint.pressing{background:var(--n202020)}
.cs-icono .grid.rows .tile.tint{background:var(--n111111)}
.cs-icono :is(.grid,.ghost) .tile.tint .meta.cnt{background:var(--n2c2c2e);color:var(--nffffff)}
/* selector en Configuración */
.seg.three{grid-template-columns:repeat(3,1fr)}
.cstyles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.cstyles button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 2px 9px;border-radius:14px;background:var(--field);color:var(--muted);font-size:12.5px;font-weight:500;transition:background-color .2s,color .2s}
.cstyles button[aria-pressed="true"]{background:var(--n3a3a3c);color:var(--nffffff)}
.csp{--c:#B7A8F7;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--c)}
.csp svg{width:21px;height:21px;stroke-width:1.9}
.csp.tinte{background:linear-gradient(150deg,rgba(183,168,247,.2),rgba(183,168,247,.045) 62%,rgba(0,0,0,0)),#141414;box-shadow:inset 0 0 0 1px rgba(183,168,247,.22)}
.csp.solido{background:var(--c);color:#141414}
.csp.oscuro{background:rgb(38,35,49)}
.csp.brillo{background:radial-gradient(circle at 100% 0%,rgba(183,168,247,.5),rgba(0,0,0,0) 70%),#121212}
.csp.icono{background:#161616}

/* ---------- por ver y por leer · gastos compartidos ---------- */
.seg.mtabs{grid-template-columns:repeat(3,1fr);margin:2px 0 12px}
.seg.mtabs button{font-size:14.5px}
.mv .adv{width:40px;height:40px;margin:-4px -5px -4px 0;border-radius:50%;display:grid;place-items:center;background:var(--n2a2a2a);color:var(--nffffff);flex:none;transition:transform .15s var(--ease)}
.mv .adv svg{width:17px;height:17px;stroke-width:2.6}
.mv .adv:active{transform:scale(.86)}
.stars{display:flex;gap:1px;color:var(--warn);flex:none}
.stars svg{width:14px;height:14px;fill:currentColor;stroke-width:0}
.stars .o{color:var(--n3a3a3c)}
.starpick{display:flex;gap:6px}
.starpick button{flex:1;height:48px;border-radius:14px;background:var(--field);display:grid;place-items:center;color:var(--t48484c)}
.starpick button[aria-pressed="true"]{color:var(--warn)}
.starpick svg{width:24px;height:24px;fill:currentColor;stroke-width:0}
.chipsel{display:flex;flex-wrap:wrap;gap:8px}
.chipsel button{height:40px;padding:0 16px;border-radius:20px;background:var(--field);color:var(--nd1d1d6);font-size:15.5px;font-weight:500;transition:background-color .15s,color .15s}
.chipsel button[aria-pressed="true"]{background:var(--nffffff);color:var(--n000000)}
.fgrid-top{margin-bottom:6px}
.fgrid-top .msec:first-child{margin-top:18px}
.mv.pay .av{width:34px;height:34px;font-size:12.5px}
.mv.pay{cursor:default}
.mva.neg{color:var(--danger)}
.prow{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 8px 8px 14px}
.prow + .prow{border-top:1px solid var(--n2a2a2a)}
.prow b{flex:1;min-width:0;font-size:16.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .av{width:36px;height:36px;font-size:13px}
.prow .iconbtn svg{width:19px;height:19px;color:var(--muted)}

/* ---------- bloqueo con Face ID ---------- */
.lockscr{position:fixed;inset:0;z-index:400;background:var(--n000000);display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 24px);overflow-y:auto}
.lockscr .lg{align-items:center;text-align:center}
.lockscr .lgsub{margin-bottom:22px}
.lockscr form{width:100%}
html.locked :is(#app,#layer,#grp,#toast,#login){visibility:hidden}

/* ---------- buscador general ---------- */
.sheet .searchwrap{padding:0 20px 8px}
.sres .pick .al > span,.sres .pick small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres .pick > svg{width:17px;height:17px;color:var(--faint);flex:none}
.sres .gl:first-child{margin-top:2px}
.sres .empty{padding:40px 16px}

/* ---------- deslizar desde el borde para volver ---------- */
.screen.swiping{transition:none!important}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
}
