    asks: [['Dicta la nota', 'Texto']], fields: [['texto', 'la respuesta a «Dicta la nota»']] },
  { id: 'hoy', say: 'Qué tengo hoy', icon: 'calendar-days', what: 'Siri te lee lo que te queda hoy: eventos de Google Calendar y clases del horario.',
    asks: [], fields: [] },
  { id: 'manana', say: 'Qué tengo mañana', icon: 'calendar', what: 'Todo lo de mañana: eventos de Google Calendar y clases del horario.',
    asks: [], fields: [] },
  { id: 'clase', say: 'Qué clase tengo', icon: 'clock', what: 'La clase que tienes ahora y la siguiente, con el aula.',
    asks: [], fields: [] },
  { id: 'examen', say: 'Próximo examen', icon: 'graduation-cap', what: 'Lo siguiente de tu calendario de Universidad y cuántos días faltan.',
    asks: [], fields: [] },
  { id: 'mes', say: 'Cuánto llevo gastado', icon: 'chart-column', what: 'Lo que llevas gastado este mes, en qué más y lo que queda del presupuesto.',
    asks: [], fields: [] },
];
function siriRecipe(r){
  const steps = [`Abre la app <b>Atajos</b>, pulsa <b>+</b> y arriba ponle de nombre <b>${esc(r.say)}</b> (es lo que le dirás a Siri).`];
  r.asks.forEach(([q, type]) => steps.push(`Añade la acción <b>Pedir entrada</b>. Pregunta: <b>${esc(q)}</b>. Tipo de entrada: <b>${type}</b>.`));
  const rows = [['op', 'atajo'], ['clave', 'tu clave (cópiala arriba)'], ['accion', r.id], ...r.fields.map(([k, v]) => [k, v])];
  steps.push(`Añade <b>Obtener contenido de URL</b>. En la URL pega la <b>dirección</b> de arriba. Toca la flecha para ver más: <b>Método: POST</b> y <b>Cuerpo de solicitud: JSON</b>. Añade estos campos, todos de tipo <b>Texto</b>. A la izquierda va el nombre, escrito tal cual; a la derecha, el valor:<span class="kv">${rows.map(([k, v]) => `<span><code>${esc(k)}</code><i>${esc(v)}</i></span>`).join('')}</span>${r.fields.length ? 'Para poner una respuesta, toca la casilla de la <b>derecha</b> (el valor, no el nombre) y, en la fila que sale encima del teclado, elige la variable <b>Entrada proporcionada</b> de esa pregunta. El nombre de la izquierda se queda solo con su palabra.' : ''}`);
  steps.push('Añade <b>Mostrar resultado</b> y elige <b>Contenido de URL</b>. Cuando lo uses con Siri, te lo dirá en voz alta.');
  return `<details class="siri"><summary><span class="shic">${svg(r.icon)}</span><span class="al">«Oye Siri, ${esc(r.say.charAt(0).toLowerCase() + r.say.slice(1))}»<small>${esc(r.what)}</small></span>${svg('chevron-right')}</summary><ol class="steps">${steps.map(s => `<li>${s}</li>`).join('')}</ol>${r.tip ? `<p class="foot">${esc(r.tip)}</p>` : ''}</details>`;
}
function openSiri(){
  const sh = makeSheet(`<div class="grab"></div><div class="sh-head"><span class="shic">${svg('mic')}</span><div class="sh-ht"><div class="sh-title">Atajos de Siri</div><div class="sh-sub">Apunta cosas hablando, sin abrir la app</div></div></div>
    <div class="fbody"><div id="siTop"></div>
      <p class="gl">Atajos</p>
      <p class="foot">Créalos una vez en la app Atajos del iPhone (unos 2 minutos cada uno). Toca uno para ver los pasos.</p>
      ${SIRI.map(siriRecipe).join('')}
      <p class="foot" style="margin-top:14px">Si tienes varias secciones del mismo tipo (por ejemplo dos listas), añade el campo <code>carpeta</code> con el nombre de la que quieras. Siri tarda 1–3 segundos en responder y necesita internet. Si un atajo contesta «No conozco la acción», falta actualizar el servidor (Codigo.gs).</p>
    </div>`, 'page');
  const top = $('#siTop', sh.el);
  const st = { busy: false, activo: null, err: '' };
  const paint = () => {
    const key = ls.get(K_ATAJO) || '', url = serverUrl();
    if (P.db !== SS || !SS.token()) { top.innerHTML = '<div class="u-msg">Los atajos funcionan con la versión de la app conectada a Google y con la sesión iniciada.</div>'; return; }
    if (st.err) { top.innerHTML = `<div class="u-msg">${esc(st.err)}</div>`; return; }
    if (key && st.activo !== false) {
      top.innerHTML = `<p class="gl">Lo que tienes que copiar</p><div class="group">
        <button class="row" type="button" data-copy="url">${svg('link')}<span class="al" style="flex:1;min-width:0">Dirección<small style="display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(url)}</small></span>${svg('copy')}</button>
        <button class="row" type="button" data-copy="key">${svg('key-round')}<span class="al" style="flex:1;min-width:0">Tu clave de atajos<small style="display:block;color:var(--muted);font-size:13px">${esc(key.slice(0, 4))}••••••••${esc(key.slice(-4))}</small></span>${svg('copy')}</button></div>
        <p class="foot">La clave solo sirve para añadir cosas y para «¿qué tengo hoy?»: con ella no se pueden ver tus notas ni borrar nada. No la compartas.</p>
        <div class="group"><button class="row" type="button" data-k="crear">${svg('refresh-cw')}Cambiar la clave<span class="rv">Los atajos viejos dejan de funcionar</span></button><button class="row" type="button" data-k="quitar" style="color:var(--danger)">${svg('x')}Desactivar los atajos</button></div>`;
    } else {
      top.innerHTML = `<div class="u-msg">${st.activo ? 'Ya creaste una clave en otro dispositivo. Puedes crear una nueva aquí (la anterior dejará de funcionar) o copiarla desde ese dispositivo.' : 'Primero crea tu clave de atajos. Es distinta de tu contraseña y solo sirve para los atajos.'}<br><button class="pill" type="button" data-k="crear"${st.busy ? ' disabled' : ''}>${st.busy ? 'Creando…' : st.activo ? 'Crear una clave nueva' : 'Crear mi clave'}</button></div>`;
    }
  };
  const call = async accion => {
    const quiet = accion === 'estado';
    if (!quiet) { st.busy = true; paint(); }
    try {
      const r = await SS.request({ op: 'atajos', token: SS.token(), accion });
      if (r && r.ok) { st.activo = r.activo; st.err = ''; if (r.clave) ls.set(K_ATAJO, r.clave); if (!r.activo) ls.set(K_ATAJO, ''); return r; }
      if (r && r.error === 'auth') { sh.close(); SS.onAuthLost(); return null; }
      st.err = r && r.error === 'op' ? 'Falta un paso: actualiza el servidor (Codigo.gs) para usar los atajos.' : 'No se pudo conectar con el servidor. Inténtalo otra vez.';
    } catch (e) { st.err = 'Sin conexión con el servidor. Inténtalo con internet.'; }
    finally { st.busy = false; paint(); }
    return null;
  };
  sh.el.addEventListener('click', async e => {
    const c = e.target.closest('[data-copy]');
    if (c) { copyAndTell(c.dataset.copy === 'url' ? serverUrl() : ls.get(K_ATAJO) || '', c.dataset.copy === 'url' ? 'Dirección copiada' : 'Clave copiada'); return; }
    const k = e.target.closest('[data-k]'); if (!k || st.busy) return;
    if (k.dataset.k === 'quitar') {
      if (!await confirmDialog({ title: '¿Desactivar los atajos?', message: 'Los atajos que hayas creado dejarán de funcionar hasta que crees una clave nueva.', ok: 'Desactivar' })) return;
      if (await call('quitar')) toast('Atajos desactivados', 'check');
    } else {
      if (ls.get(K_ATAJO) && !await confirmDialog({ title: '¿Cambiar la clave?', message: 'Tendrás que pegar la nueva en cada atajo.', ok: 'Cambiar', danger: false })) return;
      if (await call('crear')) toast('Clave creada · cópiala en tus atajos', 'check');
    }
  });
  paint();
  if (P.db === SS && SS.token()) call('estado');
}

/* ================= buscador general ================= */
// Busca en todo: secciones del inicio, notas, textos rápidos, listas, gastos, hábitos y Universidad.
function snippetAround(text, n){
  const flat = String(text || '').replace(/\s+/g, ' ').trim();
  const i = norm(flat).indexOf(n);
  if (i < 0) return flat.slice(0, 90);
  const a = Math.max(0, i - 28);
  return (a ? '…' : '') + flat.slice(a, i + 80);
}
const whereOf = it => { const g = groupOf(it.id); return g ? `${g.name} › ${it.name}` : it.name; };
function entryResult(e, it, n){
  const r = { type: 'entry', id: e.id, color: it.color, updated: e.updated || 0, go: 'chevron-right' };
  const w = whereOf(it);
  if (it.kind === 'notes' || (it.kind === 'uni' && !e.t)) {
    r.icon = 'file-text'; r.title = e.title.trim() || firstLine(e.body) || 'Nota sin título';
    r.sub = n && !norm(e.title).includes(n) ? snippetAround(e.body, n) : `${w} · ${fmtDate(e.updated)}`;
  } else if (it.kind === 'copy') { r.icon = 'copy'; r.go = 'copy'; r.title = e.title.trim() || firstLine(e.body) || 'Sin título'; r.sub = `Toca para copiar · ${w}`; }
  else if (it.kind === 'list') { r.icon = 'list-checks'; r.title = e.title; r.sub = `${e.done ? 'Tachado' : 'Pendiente'} · ${w}`; }
  else if (it.kind === 'money') { r.icon = 'wallet'; r.title = e.title.trim() || catInfo(e.cat, e.inc).n; r.sub = `${e.inc ? '+' : ''}${money(e.amt)}${e.day ? ' · ' + fmtDay(e.day) : ''} · ${w}`; }
  else if (it.kind === 'habits') { r.icon = 'flame'; r.title = e.title; r.sub = `Hábito · ${w}`; }
  else if (it.kind === 'media') { const ty = mediaType(e.cat); r.icon = ty.i; r.title = e.title; r.sub = [ty.n, MEDIA_ST[e.dow] || MEDIA_ST[0], w].join(' · '); }
  else if (it.kind === 'split') { if (e.inc) return null; r.icon = 'receipt'; r.title = e.title || 'Gasto'; r.sub = `${money(e.amt)} · pagó ${e.subj} · ${w}`; }
  else if (e.t === 'prof') { r.icon = 'user'; r.title = e.title; r.sub = ['Profesor', e.subj].filter(Boolean).join(' · '); }
  else if (e.t === 'link') { r.icon = 'link'; r.title = e.title || e.url; r.sub = `Enlace · ${w}`; }
  else if (e.t === 'class') { r.icon = 'clock'; r.title = e.title; r.sub = ['Clase', e.dow ? WEEKDAYS[e.dow % 7] : '', e.hs, e.room].filter(Boolean).join(' · '); }
  else return null;
  return r;
}
function searchAll(q){
  const n = norm(q.trim());
  if (!n) return [];
  const out = [];
  for (const it of Object.values(S.home.items)) {
    if (it.kind === 'cal') continue;
    const inName = norm(it.name).includes(n);
    if (inName || norm(it.desc).includes(n)) out.push({ type: 'item', id: it.id, icon: it.icon, color: it.color, title: it.name, sub: kindLabel(it.kind), go: it.kind === 'link' ? 'arrow-up-right' : 'chevron-right', rank: inName ? 0 : 1, updated: 0 });
  }

let suppressClickUntil = 0, lpHeld = false;
document.addEventListener('click', e => { if (Date.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); } }, true);
const endHold = () => { if (lpHeld) { lpHeld = false; suppressClickUntil = Date.now() + 400; } };
document.addEventListener('pointerup', endHold, true);
document.addEventListener('pointercancel', endHold, true);
document.addEventListener('touchend', endHold, true);
document.addEventListener('touchstart', () => {}, { passive: true }); // activa :active en iOS

function longPress(container, sel, onLong, disabled, deep = false){
  let t = null, cur = null, sx = 0, sy = 0;
  const own = cell => !!cell && (deep ? container.contains(cell) : cell.parentElement === container);
  const clear = () => { clearTimeout(t); t = null; if (cur) cur.classList.remove('pressing'); cur = null; };
  container.addEventListener('pointerdown', e => {
    if (disabled() || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const cell = e.target.closest('.cell');
    if (!own(cell) || e.target.closest('.badge')) return;
    clear();
    cur = $(sel, cell); sx = e.clientX; sy = e.clientY;
    if (cur) cur.classList.add('pressing');
    t = setTimeout(() => {
      const c = cur; clear();
      lpHeld = true; suppressClickUntil = Date.now() + 100000;
      if (c) { c.classList.remove('lift'); void c.offsetWidth; c.classList.add('lift'); }
      onLong(cell.dataset.id, cell);
    }, 480);
  });
  container.addEventListener('pointermove', e => { if (t && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) clear(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => container.addEventListener(ev, () => { if (t) clear(); }));
  container.addEventListener('contextmenu', e => {
    const cell = e.target.closest('.cell');
    if (!own(cell)) return;
    e.preventDefault();
    if (disabled() || lpHeld || Date.now() < suppressClickUntil) return;
    clear();
    suppressClickUntil = Date.now() + 400;
    onLong(cell.dataset.id, cell);
  });
}

function sortable(container, { scroller, active, onDrop, canMerge = null, onMerge = null }){
  let st = null;
  const cells = () => [...container.children].filter(c => c.classList.contains('cell'));
  const cellAt = target => { const c = target.closest('.cell'); return c && c.parentElement === container ? c : null; };
  function start(cell, x, y, mouse){
    st = { cell, sx: x, sy: y, x, y, mouse, on: false, timer: null };
    if (!mouse) st.timer = setTimeout(begin, 160);
  }
  function begin(){
    if (!st || st.on) return;
    const r = st.cell.getBoundingClientRect();
    st.ox = st.sx - r.left; st.oy = st.sy - r.top;
    const g = st.cell.cloneNode(true);
    g.classList.add('ghost'); g.removeAttribute('data-id');
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    document.body.appendChild(g);
    st.ghost = g; st.on = true; Drag.active = true;
    st.before = cells().map(c => c.dataset.id).join('|');
    st.cell.classList.add('drag-src');
    place();
    st.raf = requestAnimationFrame(tick);
  }
  function clearHover(){
    if (!st) return;
    clearTimeout(st.hoverT); st.hover = null; st.hoverMode = '';
    if (st.merge) { const t = $('.tile', st.merge); if (t) t.classList.remove('drop-on'); st.merge = null; }
  }
  function place(){
    st.ghost.style.transform = `translate3d(${st.x - st.ox}px, ${st.y - st.oy}px, 0) scale(${st.merge ? .9 : 1.05})`;
    const cr = container.getBoundingClientRect();
    const px = st.x - cr.left, py = st.y - cr.top;
    const list = cells();
    let c = null;
    for (const x of list) {
      if (x === st.cell) continue;
      if (px >= x.offsetLeft && px <= x.offsetLeft + x.offsetWidth && py >= x.offsetTop && py <= x.offsetTop + x.offsetHeight) { c = x; break; }
    }
    if (!canMerge) { if (c) moveTo(c, list); return; }
    // Con carpetas: en el centro de otra tarjeta (quieto un momento) se agrupan; por el borde, se reordena.
    if (!c) { clearHover(); return; }
    const w = c.offsetWidth, h = c.offsetHeight;
    const center = px > c.offsetLeft + w * .2 && px < c.offsetLeft + w * .8 && py > c.offsetTop + h * .18 && py < c.offsetTop + h * .82;
    const mode = center && canMerge(st.cell.dataset.id, c.dataset.id) ? 'm' : 'r';
    if (st.hover === c && st.hoverMode === mode) return;
    clearHover();
    st.hover = c; st.hoverMode = mode;
    st.hoverT = setTimeout(() => {
      if (!st || st.hover !== c) return;
      if (mode === 'm') { st.merge = c; const t = $('.tile', c); if (t) t.classList.add('drop-on'); place(); }
      else { st.hover = null; st.hoverMode = ''; moveTo(c, cells()); }
    }, mode === 'm' ? 380 : 150);
  }
  function moveTo(target, list){
    const from = list.indexOf(st.cell), to = list.indexOf(target);
    const first = new Map(list.map(c => [c, c.getBoundingClientRect()]));
    if (to > from) target.after(st.cell); else target.before(st.cell);
    for (const c of list) { c.style.transition = 'none'; c.style.transform = ''; }
    const moved = [];
    for (const c of list) {
      if (c === st.cell) continue;
      const a = first.get(c), b = c.getBoundingClientRect();
      const dx = a.left - b.left, dy = a.top - b.top;
      if (dx || dy) { c.style.transform = `translate(${dx}px, ${dy}px)`; moved.push(c); }
    }
    void container.offsetWidth;
    for (const c of moved) { c.style.transition = 'transform .28s cubic-bezier(.32,.72,0,1)'; c.style.transform = ''; }
  }
  function tick(){
    if (!st || !st.on) return;
    const sr = scroller.getBoundingClientRect(), edge = 72;
    let v = 0;
    if (st.y < sr.top + edge) v = -Math.min(16, (sr.top + edge - st.y) / 4);
    else if (st.y > sr.bottom - edge) v = Math.min(16, (st.y - (sr.bottom - edge)) / 4);
    if (v) { const b = scroller.scrollTop; scroller.scrollTop += v; if (scroller.scrollTop !== b) place(); }
    st.raf = requestAnimationFrame(tick);
  }
  function finish(){
    const s = st; st = null;
    if (!s) return;
    clearTimeout(s.timer);
    if (!s.on) return;
    cancelAnimationFrame(s.raf);
    clearTimeout(s.hoverT);
    suppressClickUntil = Date.now() + 400;
    const into = s.merge ? s.merge.dataset.id : null;
    const r = (s.merge || s.cell).getBoundingClientRect();
    s.ghost.style.transition = 'transform .26s cubic-bezier(.32,.72,0,1), opacity .26s';
    s.ghost.style.transform = `translate3d(${r.left}px, ${r.top}px, 0) scale(${into ? .4 : 1})`;
    if (into) s.ghost.style.opacity = '0';
    const after = cells().map(c => c.dataset.id);
    setTimeout(() => {
      s.ghost.remove();
      s.cell.classList.remove('drag-src');
      if (s.merge) { const t = $('.tile', s.merge); if (t) t.classList.remove('drop-on'); }
      for (const c of cells()) { c.style.transition = ''; c.style.transform = ''; }
      Drag.active = false;
      if (after.join('|') !== s.before) onDrop(after, s.cell.dataset.id);
      if (into && onMerge) onMerge(s.cell.dataset.id, into);
      lastHome = ''; lastFolder = ''; lastGroup = '';
      render();
    }, 270);
  }
  container.addEventListener('touchstart', e => {
    if (!active() || e.touches.length !== 1 || st || e.target.closest('.badge')) return;
    const c = cellAt(e.target); if (!c) return;
    const t = e.touches[0];
    start(c, t.clientX, t.clientY, false);
  }, { passive: true });
  container.addEventListener('touchmove', e => {
    if (!st || st.mouse) return;
    const t = e.touches[0]; st.x = t.clientX; st.y = t.clientY;
    if (!st.on) { if (Math.hypot(st.x - st.sx, st.y - st.sy) > 8) { clearTimeout(st.timer); st = null; } return; }
    e.preventDefault();
    place();
  }, { passive: false });
  container.addEventListener('touchend', () => { if (st && !st.mouse) finish(); });
  container.addEventListener('touchcancel', () => { if (st && !st.mouse) finish(); });
  container.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0 || !active() || st || e.target.closest('.badge')) return;
    const c = cellAt(e.target); if (!c) return;
    e.preventDefault();
    start(c, e.clientX, e.clientY, true);
  });
  window.addEventListener('pointermove', e => {
    if (!st || !st.mouse) return;
    st.x = e.clientX; st.y = e.clientY;
    if (!st.on) { if (Math.hypot(st.x - st.sx, st.y - st.sy) > 5) begin(); else return; }
    place();
  });
  window.addEventListener('pointerup', () => { if (st && st.mouse) finish(); });
  container.addEventListener('dragstart', e => e.preventDefault());
}

// Deslizar desde el borde izquierdo para volver (como en las apps del iPhone).
// La pantalla sigue al dedo; si pasas de un tercio o lo haces rápido, vuelve atrás.
function bindSwipeBack(){
  let st = null;
  const reset = () => { for (const el of [st.cur, st.under]) { el.classList.remove('swiping'); el.style.transform = ''; el.style.opacity = ''; } };
  document.addEventListener('touchstart', e => {
    st = null;
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (t.clientX > 28) return;
    if (stack.length || G.id || S.editing || Drag.active || $('.dialog') || $('#login')) return;
    const note = !!Editor.id && !$('#sNote').classList.contains('off');
    if (!note && !S.folder) return;
    st = { cur: note ? $('#sNote') : $('#sFolder'), under: note ? $('#sFolder') : $('#sHome'), note, sx: t.clientX, sy: t.clientY, x: t.clientX, px: t.clientX, pt: e.timeStamp, v: 0, on: false, w: window.innerWidth || 390 };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!st) return;
    const t = e.touches[0], dx = t.clientX - st.sx, dy = t.clientY - st.sy;
    if (!st.on) {
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { st = null; return; }
      if (dx < 10 || dx < Math.abs(dy)) return;
      st.on = true;
      st.cur.classList.add('swiping'); st.under.classList.add('swiping');
    }
    if (e.cancelable) e.preventDefault();
    const dt = e.timeStamp - st.pt;
    if (dt > 0) { st.v = (t.clientX - st.px) / dt; st.px = t.clientX; st.pt = e.timeStamp; }
    st.x = t.clientX;
    const d = Math.max(0, dx), p = Math.min(1, d / st.w);
    st.cur.style.transform = `translate3d(${d}px,0,0)`;
    st.under.style.transform = `translateX(${-24 * (1 - p)}%)`;
    st.under.style.opacity = String(.3 + .7 * p);
  }, { passive: false });
  const end = cancel => {
    if (!st) return;
    const s = st;
    if (!s.on) { st = null; return; }
    const d = s.x - s.sx;
    const go = !cancel && d > 24 && (d / s.w > .34 || s.v > .45);
    void s.cur.offsetWidth;
    reset(); st = null;
    suppressClickUntil = Date.now() + 350;
    if (go) { if (s.note) closeNote(false); else closeFolder(); }
  };
  document.addEventListener('touchend', () => end(false));
  document.addEventListener('touchcancel', () => end(true));
}

/* ================= enlaces de eventos ================= */
function bind(){
  $$('[data-ic]').forEach(el => el.insertAdjacentHTML('afterbegin', svg(el.dataset.ic)));

  // inicio
  $('#hAdd').addEventListener('click', () => { if (canWrite()) createMenu(); });
  $('#hView').addEventListener('click', () => View.toggle());
  $('#hDone').addEventListener('click', stopEditing);
  $('#hFolder').addEventListener('click', () => { if (canWrite()) openGroupForm(); });
  $('#hSettings').addEventListener('click', openSettings);
  $('#hSearch').addEventListener('click', openSearch);
  document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === 'k' && !stack.length && !$('.dialog') && !$('#login')) { e.preventDefault(); openSearch(); } });
  bindSwipeBack();
  const hGrid = $('#hGrid');
  const tapItem = (e, scope) => {
    const cell = e.target.closest('.cell'); if (!cell) return;
    const id = cell.dataset.id, it = S.home.items[id]; if (!it) return;
    if (e.target.closest('.badge')) { e.preventDefault(); askDeleteItem(id); return; }
    if (S.editing === scope) { e.preventDefault(); return; }
    if (it.kind === 'link') { if (!safeUrl(it.url)) { e.preventDefault(); openItemForm({ id }); } return; }
    if (it.kind === 'group') { openGroup(id); return; }
    if (it.kind === 'cal') { openAgenda(); return; }
    openFolder(id);
  };
  hGrid.addEventListener('click', e => tapItem(e, 'home'));
  $('#hScroll').addEventListener('click', e => { if (S.editing === 'home' && !e.target.closest('.cell')) stopEditing(); });
  longPress(hGrid, '.tile', id => itemActions(id), () => S.editing === 'home');
  sortable(hGrid, { scroller: $('#hScroll'), active: () => S.editing === 'home', onDrop: order => {
    if (!canWrite()) return;
    const known = order.filter(id => S.home.items[id]);
    S.home.order = known.concat(S.home.order.filter(id => !known.includes(id)));
    saveHome();
  }, canMerge: (a, b) => groupable(S.home.items[a]) && (groupable(S.home.items[b]) || (S.home.items[b] && S.home.items[b].kind === 'group')), onMerge: mergeOnDrop });

  // carpeta que agrupa (se abre encima del inicio)
  const gGrid = $('#gGrid');
  $('#grpBd').addEventListener('click', () => { if (S.editing === 'grp') stopEditing(); else closeGroup(); });
  $('#grp').addEventListener('click', e => { if (e.target === $('#grp') || e.target.classList.contains('grp-in')) { if (S.editing === 'grp') stopEditing(); else closeGroup(); } });
  $('#grpName').addEventListener('click', () => { if (G.id && S.editing !== 'grp') openGroupForm({ id: G.id }); });
  $('#grpDone').addEventListener('click', stopEditing);
  gGrid.addEventListener('click', e => tapItem(e, 'grp'));
  longPress(gGrid, '.tile', id => itemActions(id), () => S.editing === 'grp');
  sortable(gGrid, { scroller: $('#grpPanel'), active: () => S.editing === 'grp', onDrop: order => {
    if (!canWrite()) return;
    const g = S.home.items[G.id]; if (!g) return;
    const known = order.filter(id => g.children.includes(id));
    g.children = known.concat(g.children.filter(id => !known.includes(id)));
    saveHome();
  }});
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && G.id && !stack.length && !document.querySelector('.dialog')) { if (S.editing === 'grp') stopEditing(); else closeGroup(); } });
  bindUni();
  setInterval(() => { if (Object.values(S.home.items).some(i => i.kind === 'cal')) { lastHome = ''; scheduleRender(); } }, 60000);

  // carpeta
  $('#fBack').addEventListener('click', closeFolder);
  $('#fDone').addEventListener('click', stopEditing);
  $('#fAdd').addEventListener('click', () => {
    const it = S.home.items[S.folder]; if (!it) return;
    if (it.kind === 'notes') newNote();
    else if (it.kind === 'uni') uniAddMenu();
    else if (it.kind === 'habits') openHabitForm();
    else if (it.kind === 'media') openMediaForm();
    else if (it.kind === 'split') openSplitForm();
    else if (it.kind === 'list') focusNewTodo();
    else if (it.kind === 'money') openMoneyForm({ focus: true });
    else openSnipForm();
  });
  const fGrid = $('#fGrid');
  fGrid.addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) { const a = act.dataset.act; if (a === 'newNote') newNote(); else if (a === 'newSnip') openSnipForm(); else if (a === 'newHabit') openHabitForm(); else if (a === 'newMedia') openMediaForm(); else if (a === 'newSplit') openSplitForm(); else if (a === 'splitPeople') splitPeople(S.folder); return; }
    const tab = e.target.closest('[data-mtab]');
    if (tab) { S.mediaTab = +tab.dataset.mtab; renderFolder(); return; }
    const pay = e.target.closest('[data-pay]');
    if (pay) { settlePay(S.folder, +pay.dataset.pay); return; }
    const cell = e.target.closest('.cell'); if (!cell) return;
    const id = cell.dataset.id;
    if (e.target.closest('.badge')) { askDeleteEntry(id); return; }
    if (S.editing === S.folder) return;
    const it = S.home.items[S.folder]; if (!it) return;
    if (it.kind === 'notes' || it.kind === 'uni') Editor.open(id);
    else if (it.kind === 'habits') {
      const d = e.target.closest('[data-day]'), ck = e.target.closest('[data-today]');
      if (d) { if (!d.disabled) toggleHabitDay(id, d.dataset.day, cell); }
      else if (ck) toggleHabitDay(id, dkey(new Date()), cell);
      else habitSheet(id);
    }
    else if (it.kind === 'list') toggleTodo(id, cell);
    else if (it.kind === 'copy') copySnip(id, cell);
    else if (it.kind === 'media') { if (e.target.closest('.adv')) advanceMedia(id); else openMediaForm(id); }
    else if (it.kind === 'split') { const x = S.entries.get(id); if (x && x.inc) entryActions(id); else openSplitForm(id); }
  });
  $('#fScroll').addEventListener('click', e => { if (S.editing && S.editing === S.folder && !e.target.closest('.cell')) stopEditing(); });
  longPress(fGrid, '.note, .snip, .todo, .habit, .mv', id => entryActions(id), () => S.editing === S.folder);
  sortable(fGrid, { scroller: $('#fScroll'), active: () => !!S.folder && S.editing === S.folder, onDrop: onSnipDrop });
  const q = $('#fQuery');
  q.addEventListener('input', () => { S.query = q.value; $('#fClear').hidden = !q.value; renderFolder(); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') q.blur(); });
  $('#fClear').addEventListener('click', () => { q.value = ''; S.query = ''; $('#fClear').hidden = true; renderFolder(); });
  bindLists();
  bindMoney();

  // teclado en tarjetas
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"].tile, .note, .snip, .todo, .mv') && e.target === document.activeElement) { e.preventDefault(); e.target.click(); }
  });

  // nota
  const nT = $('#nTitle'), nB = $('#nBody'), sNote = $('#sNote');
  $('#nBack').addEventListener('click', () => closeNote(false));
  nT.addEventListener('input', () => { autosize(nT); Editor.onInput(); });
  nB.addEventListener('input', () => { autosize(nB); Editor.onInput(); });
  nT.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); nB.focus(); try { nB.setSelectionRange(0, 0); } catch (x) {} } });
  $('#nCopy').addEventListener('click', () => copyAndTell(nB.value || nT.value));
  $('#nShare').hidden = !canShare;
  $('#nShare').addEventListener('click', () => shareText(nT.value.trim(), [nT.value.trim(), nB.value.trim()].filter(Boolean).join('\n\n')));
  $('#nDel').addEventListener('click', async () => {
    Editor.commit();
    if (!S.entries.has(Editor.id)) { Editor.dirty = false; closeNote(true); return; }
    if (await askDeleteEntry(Editor.id)) { Editor.dirty = false; closeNote(true); }
  });
  $('#nDone').addEventListener('pointerdown', e => e.preventDefault());
  $('#nDone').addEventListener('click', () => { Editor.commit(); if (document.activeElement) document.activeElement.blur(); });
  sNote.addEventListener('focusin', e => { if (e.target.matches('textarea') && !e.target.readOnly) { $('#nDone').hidden = false; $('#nDel').hidden = true; } });
  sNote.addEventListener('focusout', () => setTimeout(() => {
    const a = document.activeElement;
    if (!(a && sNote.contains(a) && a.matches('textarea'))) { $('#nDone').hidden = true; $('#nDel').hidden = Editor.ro; }
  }, 0));

  // guardar al salir
  const flush = () => { Editor.commit(); if (S.mode === 'local') flushLocal(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); else { maintenance(); scheduleRender(); } });
  window.addEventListener('pagehide', flush);
}

/* ================= arranque ================= */
function boot(){
  let snap = null;
  if (sheetsWanted()) { SS.load(); const v = SS.snapshot(); if (v.home) snap = v; }
  else snap = ls.get(K_CACHE) || ls.get(K_LOCAL);
  if (snap && snap.home) loadSnapshot(snap);
  Cal.init();
  bind();
  render();
  if (Lock.cfg()) { Lock.inited = true; Lock.init(); }
  connect();
  // Fuera de claude.ai: guarda la propia app en el dispositivo para que se abra aunque no haya internet.
  if (standalone && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
}
boot();
})();
</script>
